# Prefer MIT when a dependency offers MIT OR Apache-2.0.
# Read crate-level license documents; nested documents need explicit clarifications.
max-depth = 1
accepted = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "MPL-2.0",
    "Apache-2.0 WITH LLVM-exception",
]
ignore-dev-dependencies = true
# License collection tools are not shipped in the application.
ignore-build-dependencies = true


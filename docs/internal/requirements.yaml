      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#sctn-credProtect-extension
    text: 'userVerificationOptionalWithCredentialIDList 0x02'
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::ctap22::ctap::credential_protection_policy::maps_credential_protection_policies_to_their_ctap_extension_values

  - source:
      title: CTAP 2.2 — 12.1 Credential Protection / required policy mapping
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#sctn-credProtect-extension
    text: 'userVerificationRequired 0x03'
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::ctap22::ctap::credential_protection_policy::maps_credential_protection_policies_to_their_ctap_extension_values

  - source:
      title: CTAP 2.2 — 12.1 Credential Protection / authenticator input
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#sctn-credProtect-extension
    text: 'The platform sends the authenticatorMakeCredential request with the following CBOR map entry in the "extensions" field to the authenticator: "credProtect": <credProtect Value>'

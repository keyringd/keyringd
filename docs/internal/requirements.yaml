  - source:
      title: CTAP 2.2 — 12.6 PIN Complexity Extension
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#sctn-pincomplexitypolicy-extension

  - source:
      title: CTAP 2.2 — 11.5.1 QR-initiated Transactions / handshake initiator
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#hybrid-qr-initiated
    text: The client platform speaks first to prove possession of the BLE advert.

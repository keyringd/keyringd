      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#pinProto2
    text: 'Note: This is two separate invocations of HKDF whose results are concatenated together. It can NOT be equivalently performed using a single invocation with L=64.'
    tests:
      - keyringd-fido-client::keyringd_fido_client::tests::spec::ctap22::ctap_client::pin_uv_auth::crypto::protocol_two_derives_independent_hmac_and_aes_keys

  - source:
      title: CTAP 2.2 — 6.5.7 PIN/UV Auth Protocol Two / encryption
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#pinProto2
    text: Discard the first 32 bytes of key. (This selects the AES-key portion of the shared secret.) Let iv be a 16-byte, random bytestring. Let ct be the AES-256-CBC encryption of demPlaintext using key and iv. (No padding is performed as the size of demPlaintext is required to be a multiple of the AES block length.) Return iv || ct.
    tests:
      - keyringd-fido-client::keyringd_fido_client::tests::spec::ctap22::ctap_client::pin_uv_auth::crypto::protocol_two_prefixes_a_fresh_iv_and_encrypts_with_the_aes_half_of_the_secret
      - keyringd-fido-client::keyringd_fido_client::tests::spec::ctap22::ctap_client::pin_uv_auth::crypto::rejects_pin_uv_plaintext_that_is_not_aligned_to_an_aes_block


      title: CTAP 2.2 — 6.4 authenticatorGetInfo / uv option
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#authenticatorGetInfo
    text: 'uv user verification: Indicates that the authenticator supports a built-in user verification method. For example, devices with UI, biometrics fall into this category. If present and set to true, it indicates that the device is capable of built-in user verification and its user verification feature is presently configured. If present and set to false, it indicates that the authenticator is capable of built-in user verification and its user verification feature is not presently configured. For example, an authenticator featuring a built-in biometric user verification feature that is not presently configured will return this "uv" option id set to false. If absent, it indicates that the authenticator does not have a built-in user verification capability. A device that can only do Client PIN will not return the "uv" option id. If a device is capable of both built-in user verification and Client PIN, the authenticator will return both the "uv" and the "clientPin" option ids. Not Supported'
    tests:
      - keyringd-fido-client::keyringd_fido_client::tests::spec::ctap22::fido_client::operation::ctap_user_verification::uses_the_legacy_uv_option_when_permission_scoped_built_in_uv_tokens_are_unavailable


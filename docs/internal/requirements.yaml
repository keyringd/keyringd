      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::cose_elliptic_curve::uses_the_registered_cose_curve_number_for_p_256
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::credential_public_key::ec2_key_requires_algorithm_curve_and_coordinates

  - source:
      title: WebAuthn Level 3 — 5.8.6 User verification requirement values
      url: https://www.w3.org/TR/webauthn-3/#enum-userVerificationRequirement
    text: 'enum UserVerificationRequirement { "required", "preferred", "discouraged" };'
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::user_verification_requirement::exposes_every_user_verification_requirement_value

  - source:
      title: WebAuthn Level 3 — 5.8.8 User-agent hint values
      url: https://www.w3.org/TR/webauthn-3/#enum-hints
    text: 'enum PublicKeyCredentialHint { "security-key", "client-device", "hybrid", };'
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::public_key_credential_hint::uses_the_standardized_webauthn_credential_hints_and_preserves_future_values

  - source:
      title: WebAuthn Level 3 — 5.9 Permissions Policy integration
      url: https://www.w3.org/TR/webauthn-3/#sctn-permissions-policy
    text: This specification defines two policy-controlled features identified by the feature-identifier tokens "publickey-credentials-create" and "publickey-credentials-get". Their default allowlists are both 'self'. [Permissions-Policy]
    scope: out-of-scope
    reason: Permissions Policy is enforced by a browser user agent; keyringd is a native client library and does not host Documents.

  - source:
      title: WebAuthn Level 3 — 5.10 Cross-origin iframes
      url: https://www.w3.org/TR/webauthn-3/#sctn-iframe-guidance
    text: The Web Authentication API is disabled by default in cross-origin iframes.
    scope: out-of-scope
    reason: keyringd has no browser iframe execution context.

  - source:
      title: WebAuthn Level 3 — 5.11 Related origins
      url: https://www.w3.org/TR/webauthn-3/#sctn-related-origins
    text: By default, Web Authentication requires that the RP ID be equal to the origin’s effective domain, or a registrable domain suffix of the origin’s effective domain.
    scope: out-of-scope
    reason: Related-origin discovery and browser origin validation are outside the native keyringd API.

  - source:
      title: WebAuthn Level 3 — 6.1 Authenticator data / minimum length
      url: https://www.w3.org/TR/webauthn-3/#sctn-authenticator-data
    text: The authenticator data structure is a byte array of 37 bytes or more, laid out as shown in Table 1.
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::authenticator_data::rejects_authenticator_data_shorter_than_the_37_byte_prefix

  - source:
      title: WebAuthn Level 3 — 6.1 Authenticator data / RP ID hash
      url: https://www.w3.org/TR/webauthn-3/#table-authData
    text: rpIdHash 32 SHA-256 hash of the RP ID the credential is scoped to.
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::authenticator_data::a_round_trip_conversion_of_authenticator_data_for_assertion

  - source:
      title: WebAuthn Level 3 — 6.1 Authenticator data / flags
      url: https://www.w3.org/TR/webauthn-3/#table-authData
    text: 'flags 1 Flags (bit 0 is the least significant bit): Bit 0: User Present (UP) result. 1 means the user is present. 0 means the user is not present. Bit 1: Reserved for future use (RFU1). Bit 2: User Verified (UV) result. 1 means the user is verified. 0 means the user is not verified. Bit 3: Backup Eligibility (BE). 1 means the public key credential source is backup eligible. 0 means the public key credential source is not backup eligible. Bit 4: Backup State (BS). 1 means the public key credential source is currently backed up. 0 means the public key credential source is not currently backed up. Bit 5: Reserved for future use (RFU2). Bit 6: Attested credential data included (AT). Indicates whether the authenticator added attested credential data. Bit 7: Extension data included (ED). Indicates if the authenticator data has extensions.'
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::authenticator_data::a_round_trip_conversion_of_authenticator_data_for_assertion
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::authenticator_data::attested_es256_key_and_extension_can_be_transformed_back_and_forth
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::authenticator_data::reject_reserved_or_contradictory_backup_flags

  - source:
      title: WebAuthn Level 3 — 6.1 Authenticator data / signature counter
      url: https://www.w3.org/TR/webauthn-3/#table-authData
    text: signCount 4 Signature counter, 32-bit unsigned big-endian integer.
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::authenticator_data::a_round_trip_conversion_of_authenticator_data_for_assertion

  - source:
      title: WebAuthn Level 3 — 6.1 Authenticator data / attested credential data
      url: https://www.w3.org/TR/webauthn-3/#table-authData
    text: attestedCredentialData variable (if present) attested credential data (if present). See § 6.5.1 Attested Credential Data for details. Its length depends on the length of the credential ID and credential public key being attested.
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::authenticator_data::attested_es256_key_and_extension_can_be_transformed_back_and_forth

  - source:
      title: WebAuthn Level 3 — 6.1 Authenticator data / extensions
      url: https://www.w3.org/TR/webauthn-3/#table-authData
    text: extensions variable (if present) Extension-defined authenticator data. This is a CBOR [RFC8949] map with extension identifiers as keys, and authenticator extension outputs as values. See § 9 WebAuthn Extensions for details.
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::authenticator_data::attested_es256_key_and_extension_can_be_transformed_back_and_forth

  - source:
      title: WebAuthn Level 3 — 6.1 Authenticator data / user flags
      url: https://www.w3.org/TR/webauthn-3/#sctn-authenticator-data
    text: The UP flag SHALL be set if and only if the authenticator performed a test of user presence. The UV flag SHALL be set if and only if the authenticator performed user verification. The RFU bits SHALL be set to zero.
    scope: other-component
    reason: The authenticator produces these flags; keyringd parses and exposes UP and UV and rejects non-zero reserved bits.

  - source:
      title: WebAuthn Level 3 — 6.1 Authenticator data / backup eligibility
      url: https://www.w3.org/TR/webauthn-3/#sctn-authenticator-data
    text: The BE flag SHALL be set if and only if the credential is a multi-device credential. This value MUST NOT change after a registration ceremony as defined in § 6.1.3 Credential Backup State.
    scope: other-component
    reason: The authenticator owns credential backup eligibility; keyringd parses and exposes the flag.

  - source:
      title: WebAuthn Level 3 — 6.1 Authenticator data / backup state
      url: https://www.w3.org/TR/webauthn-3/#sctn-authenticator-data
    text: The BS flag SHALL be set if and only if the credential is a multi-device credential and is currently backed up. If the backup status of a credential is uncertain or the authenticator suspects a problem with the backed up credential, the BS flag SHOULD NOT be set.
    scope: other-component
    reason: The authenticator owns current backup state; keyringd parses it and rejects the invalid BS=1, BE=0 combination.

  - source:
      title: WebAuthn Level 3 — 6.1 Authenticator data / attestation flag
      url: https://www.w3.org/TR/webauthn-3/#sctn-authenticator-data
    text: For attestation signatures, the authenticator MUST set the AT flag and include the attestedCredentialData. For assertion signatures, the AT flag MUST NOT be set and the attestedCredentialData MUST NOT be included.
    scope: other-component
    reason: The authenticator chooses and emits the AT flag; keyringd parses attested credential data only when it is present.

  - source:
      title: WebAuthn Level 3 — 6.1 Authenticator data / extension flag
      url: https://www.w3.org/TR/webauthn-3/#sctn-authenticator-data
    text: If the authenticator does not include any extension data, it MUST set the ED flag to zero, and to one if extension data is included.
    scope: other-component
    reason: The authenticator emits the ED flag; keyringd requires the encoded extension map and flag to agree.

  - source:
      title: WebAuthn Level 3 — 6.1.1 Signature counter / unsupported counter
      url: https://www.w3.org/TR/webauthn-3/#sctn-sign-counter
    text: Authenticators that do not implement a signature counter leave the signCount in the authenticator data constant at zero.
    scope: other-component
    reason: The authenticator maintains the counter; keyringd exposes its unsigned value without operating an RP credential database.

  - source:
      title: WebAuthn Level 3 — 6.1.1 Signature counter / RP comparison
      url: https://www.w3.org/TR/webauthn-3/#sctn-sign-counter
    text: A Relying Party stores the signature counter of the most recent authenticatorGetAssertion operation. (Or the counter from the authenticatorMakeCredential operation if no authenticatorGetAssertion has ever been performed on a credential.) In subsequent authenticatorGetAssertion operations, the Relying Party compares the stored signature counter value with the new signCount value returned in the assertion’s authenticator data.
    scope: other-component
    reason: keyringd exposes signCount, but persistent RP account state and clone-risk policy belong to the application using the library.

  - source:
      title: WebAuthn Level 3 — 6.1.2 FIDO U2F signature compatibility
      url: https://www.w3.org/TR/webauthn-3/#sctn-fido-u2f-sig-format-compat
    text: The format for assertion signatures, which sign over the concatenation of an authenticator data structure and the hash of the serialized client data, are compatible with the FIDO U2F authentication signature format (see Section 5.4 of [FIDO-U2F-Message-Formats]).
    scope: out-of-scope
    reason: Existing project documentation excludes CTAP1/U2F command support; WebAuthn assertion data remains parsed in its native Level 3 form.

  - source:
      title: WebAuthn Level 3 — 6.1.3 Credential backup state / valid combinations
      url: https://www.w3.org/TR/webauthn-3/#table-backupStates
    text: 'BE BS Description 0 0 The credential is a single-device credential. 0 1 This combination is not allowed. 1 0 The credential is a multi-device credential and is not currently backed up. 1 1 The credential is a multi-device credential and is currently backed up.'
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::authenticator_data::accepts_every_valid_backup_eligibility_and_state_combination
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::authenticator_data::reject_reserved_or_contradictory_backup_flags

  - source:
      title: WebAuthn Level 3 — 6.3.1 Credential lookup
      url: https://www.w3.org/TR/webauthn-3/#sctn-op-lookup-credsource-by-credid
    text: 'If authenticator can decrypt credentialId into a public key credential source credSource: Set credSource.id to credentialId. Return credSource. For each public key credential source credSource of authenticator’s credentials map: If credSource.id is credentialId, return credSource. Return null.'
    scope: other-component
    reason: Credential-source storage and lookup are authenticator responsibilities; keyringd supplies credential IDs over CTAP.

  - source:
      title: WebAuthn Level 3 — 6.3.2 Make credential / cancel prior operation
      url: https://www.w3.org/TR/webauthn-3/#sctn-op-make-cred
    text: Before invoking this operation, the client MUST invoke the authenticatorCancel operation in order to abort all other operations in progress in the authenticator session.
    tests:
      - keyringd-fido-client::keyringd_fido_client::tests::spec::webauthn3::fido_client::returns_busy_from_makecredential_while_getassertion_is_running

  - source:
      title: WebAuthn Level 3 — 6.3.2 Make credential / parameter validation
      url: https://www.w3.org/TR/webauthn-3/#sctn-op-make-cred
    text: Check if all the supplied parameters are syntactically well-formed and of the correct length. If not, return an error code equivalent to "UnknownError" and terminate the operation.
    scope: other-component
    reason: The authenticator validates received operation parameters; keyringd must encode well-formed CTAP requests and propagate errors.

  - source:
      title: WebAuthn Level 3 — 6.3.2 Make credential / supported algorithm
      url: https://www.w3.org/TR/webauthn-3/#sctn-op-make-cred
    text: Check if at least one of the specified combinations of PublicKeyCredentialType and cryptographic parameters in credTypesAndPubKeyAlgs is supported. If not, return an error code equivalent to "NotSupportedError" and terminate the operation.
    scope: other-component
    reason: The authenticator decides its supported algorithms; keyringd supplies the requested ES256 parameters and propagates failure.

  - source:
      title: WebAuthn Level 3 — 6.3.2 Make credential / excluded credential
      url: https://www.w3.org/TR/webauthn-3/#sctn-op-make-cred
    text: If the user confirms consent to create a new credential return an error code equivalent to "InvalidStateError" and terminate the operation. does not consent to create a new credential return an error code equivalent to "NotAllowedError" and terminate the operation.
    scope: other-component
    reason: The authenticator performs exclusion lookup and consent; keyringd supplies excludeCredentials and maps the resulting status.

  - source:
      title: WebAuthn Level 3 — 6.3.2 Make credential / discoverable capability
      url: https://www.w3.org/TR/webauthn-3/#sctn-op-make-cred
    text: If requireResidentKey is true and the authenticator cannot store a client-side discoverable public key credential source, return an error code equivalent to "ConstraintError" and terminate the operation.
    scope: other-component
    reason: The authenticator enforces its credential-storage capability; keyringd requests discoverable credentials within the documented scope.

  - source:
      title: WebAuthn Level 3 — 6.3.2 Make credential / user verification capability
      url: https://www.w3.org/TR/webauthn-3/#sctn-op-make-cred
    text: If requireUserVerification is true and the authenticator cannot perform user verification, return an error code equivalent to "ConstraintError" and terminate the operation.
    scope: other-component
    reason: The authenticator enforces its user-verification capability; keyringd selects and sends the effective requirement.

  - source:
      title: WebAuthn Level 3 — 6.3.2 Make credential / authorization gesture
      url: https://www.w3.org/TR/webauthn-3/#op-makecred-step-user-consent
    text: If requireUserVerification is true, the authorization gesture MUST include user verification. If requireUserPresence is true, the authorization gesture MUST include a test of user presence. If the user does not consent or if user verification fails, return an error code equivalent to "NotAllowedError" and terminate the operation.
    scope: other-component
    reason: The authenticator collects the authorization gesture; keyringd conveys requirements and operation status.

  - source:
      title: WebAuthn Level 3 — 6.3.2 Make credential / attestation result
      url: https://www.w3.org/TR/webauthn-3/#sctn-op-make-cred
    text: On successful completion of this operation, the authenticator returns the attestation object to the client.
    scope: other-component
    reason: The authenticator creates the attestation object; keyringd decodes and exposes the returned bytes.

  - source:
      title: WebAuthn Level 3 — 6.3.3 Get assertion / cancel prior operation
      url: https://www.w3.org/TR/webauthn-3/#sctn-op-get-assertion
    text: Before invoking this operation, the client MUST invoke the authenticatorCancel operation in order to abort all other operations in progress in the authenticator session.
    tests:
      - keyringd-fido-client::keyringd_fido_client::tests::spec::webauthn3::fido_client::returns_busy_from_getassertion_while_makecredential_is_running

  - source:
      title: WebAuthn Level 3 — 6.3.3 Get assertion / credential filtering
      url: https://www.w3.org/TR/webauthn-3/#sctn-op-get-assertion
    text: Remove any items from credentialOptions whose rpId is not equal to rpId. If credentialOptions is now empty, return an error code equivalent to "NotAllowedError" and terminate the operation.
    scope: other-component
    reason: The authenticator filters stored credential sources by RP ID; keyringd sends rpId and any allow list.

  - source:
      title: WebAuthn Level 3 — 6.3.3 Get assertion / authorization gesture
      url: https://www.w3.org/TR/webauthn-3/#authenticatorGetAssertion-prompt-select-credential
    text: If requireUserVerification is true, the authorization gesture MUST include user verification. If requireUserPresence is true, the authorization gesture MUST include a test of user presence. If the user does not consent, return an error code equivalent to "NotAllowedError" and terminate the operation.
    scope: other-component
    reason: The authenticator collects user consent and verification; keyringd conveys the effective requirement.

  - source:
      title: WebAuthn Level 3 — 6.3.3 Get assertion / signature input
      url: https://www.w3.org/TR/webauthn-3/#sctn-op-get-assertion
    text: Let signature be the assertion signature of the concatenation authenticatorData || hash using the privateKey of selectedCredential as shown in Figure 5, below. A simple, undelimited concatenation is safe to use here because the authenticator data describes its own length. The hash of the serialized client data (which potentially has a variable length) is always the last element.
    scope: other-component
    reason: The authenticator owns the credential private key and generates the signature; keyringd returns authenticatorData and signature for verification by its caller.

  - source:
      title: WebAuthn Level 3 — 6.3.3 Get assertion / return values
      url: https://www.w3.org/TR/webauthn-3/#authenticatorGetAssertion-return-values
    text: 'Return to the user agent: selectedCredential.id, if either a list of credentials (i.e., allowCredentialDescriptorList) of length 2 or greater was supplied by the client, or no such list was supplied. authenticatorData signature selectedCredential.userHandle'
    scope: other-component
    reason: The authenticator determines the response members; keyringd preserves optional credential and user identifiers and the signed response values.

  - source:
      title: WebAuthn Level 3 — 6.3.4 Cancel operation
      url: https://www.w3.org/TR/webauthn-3/#sctn-op-cancel
    text: When this operation is invoked by the client in an authenticator session, it has the effect of terminating any authenticatorMakeCredential or authenticatorGetAssertion operation currently in progress in that authenticator session. The authenticator stops prompting for, or accepting, any user input related to authorizing the canceled operation. The client ignores any further responses from the authenticator for the canceled operation.
    tests:
      - keyringd-fido-client::keyringd_fido_client::tests::spec::webauthn3::fido_client::os_usb_exposes_operation_lifecycle_and_cancel_id
      - keyringd-fido-client::keyringd_fido_client::tests::spec::ctap22::fido_client::operation::operation_manager::cancel_selected_channels_in_cancel_during_ctap_operation

  - source:
      title: WebAuthn Level 3 — 6.3.5 Silent credential discovery
      url: https://www.w3.org/TR/webauthn-3/#sctn-op-silent-discovery
    text: This is an OPTIONAL operation authenticators MAY support to enable conditional user mediation.
    scope: out-of-scope
    reason: keyringd does not implement browser conditional mediation or silent credential discovery.

  - source:
      title: WebAuthn Level 3 — 6.4.1.1 Client string truncation
      url: https://www.w3.org/TR/webauthn-3/#sctn-strings-truncation-client
    text: Choose a size limit equal to or greater than the specified minimum supported length. The string MAY be truncated so that its length in bytes in the UTF-8 character encoding satisfies that limit. This truncation MUST respect UTF-8 code point boundaries, and SHOULD respect grapheme cluster boundaries [UAX29]. The resulting truncated value MAY be shorter than the chosen size limit but MUST NOT be shorter than the longest prefix substring that satisfies the size limit and ends on a grapheme cluster boundary.
    scope: out-of-scope
    reason: keyringd does not select the optional truncation behavior; it sends owned, valid UTF-8 Rust strings and therefore does not apply the conditional rules governing a truncated value.

  - source:
      title: WebAuthn Level 3 — 6.4.1.1 Client string encoding
      url: https://www.w3.org/TR/webauthn-3/#sctn-strings-truncation-client
    text: 'Ensure that any strings sent to authenticators are validly encoded. Handle the case where strings have been truncated resulting in an invalid encoding. For example, any partial code point at the end may be dropped or replaced with U+FFFD.'
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::ctap22::pin::normalize_text_to_utf_8_nfc
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::public_key_credential_rp_entity::requires_a_name_in_webauthn_while_permitting_an_id_only_ctap_entity
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::public_key_credential_user_entity::requires_names_in_webauthn_while_permitting_an_id_only_ctap_entity

  - source:
      title: WebAuthn Level 3 — 6.4.2 Language and direction encoding
      url: https://www.w3.org/TR/webauthn-3/#sctn-strings-langdir
    text: This encoding is NOT RECOMMENDED; clients and authenticators MAY ignore such encoding in new values.
    scope: out-of-scope
    reason: keyringd transports ordinary UTF-8 entity strings and does not implement the deprecated embedded language-and-direction encoding.

  - source:
      title: WebAuthn Level 3 — 6.5.1 Attested credential data / AAGUID
      url: https://www.w3.org/TR/webauthn-3/#table-attestedCredentialData
    text: aaguid 16 The AAGUID of the authenticator.
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::authenticator_data::attested_es256_key_and_extension_can_be_transformed_back_and_forth

  - source:
      title: WebAuthn Level 3 — 6.5.1 Attested credential data / credential ID length
      url: https://www.w3.org/TR/webauthn-3/#table-attestedCredentialData
    text: credentialIdLength 2 Byte length L of credentialId, 16-bit unsigned big-endian integer. Value MUST be ≤ 1023.
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::authenticator_data::rejects_an_attested_credential_id_longer_than_1023_bytes

  - source:
      title: WebAuthn Level 3 — 6.5.1 Attested credential data / credential ID
      url: https://www.w3.org/TR/webauthn-3/#table-attestedCredentialData
    text: credentialId L Credential ID
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::authenticator_data::attested_es256_key_and_extension_can_be_transformed_back_and_forth

  - source:
      title: WebAuthn Level 3 — 6.5.1 Attested credential data / public key
      url: https://www.w3.org/TR/webauthn-3/#table-attestedCredentialData
    text: The credential public key encoded in COSE_Key format, as defined in Section 7 of [RFC9052], using the CTAP2 canonical CBOR encoding form. The COSE_Key-encoded credential public key MUST contain the "alg" parameter and MUST NOT contain any other OPTIONAL parameters. The "alg" parameter MUST contain a COSEAlgorithmIdentifier value.
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::credential_public_key::ec2_key_requires_algorithm_curve_and_coordinates
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::credential_public_key::rejects_a_credential_public_key_that_is_not_canonically_encoded
      - keyringd-fido-client::keyringd_fido_client::tests::spec::webauthn3::fido_client::operation::response_validation::rejects_optional_cose_key_parameters_during_client_response_validation

  - source:
      title: WebAuthn Level 3 — 6.5.4 Attestation object
      url: https://www.w3.org/TR/webauthn-3/#sctn-generating-an-attestation-object
    text: 'Return the attestation object as a CBOR map with the following syntax, filled in with variables initialized by this algorithm: attObj = { authData: bytes, ; Each choice in $$attStmtType defines the fmt value and attStmt structure $$attStmtType } .within attStmtTemplate attStmtTemplate = { authData: bytes, fmt: text, attStmt: ( { * tstr => any } ; Map is filled in by each concrete attStmtType // [ * any ] ; attStmt may also be an array ) }'
    scope: other-component
    reason: The authenticator generates the object; keyringd decodes and validates its fmt, authData, and attStmt members.
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::attestation_object::none_attestation_can_be_transformed_back_and_forth
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::attestation_object::reject_missing_or_duplicate_fields
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::attestation_statement::round_trip_conversion_of_known_attestation_formats

  - source:
      title: WebAuthn Level 3 — 6.5.5 ES256 signature format
      url: https://www.w3.org/TR/webauthn-3/#sctn-signature-attestation-types
    text: For COSEAlgorithmIdentifier -7 (ES256), and other ECDSA-based algorithms, the sig value MUST be encoded as an ASN.1 DER Ecdsa-Sig-Value, as defined in [RFC3279] section 2.2.3.
    scope: other-component
    reason: The authenticator produces the assertion or attestation signature and the RP verifies its algorithm-specific encoding; keyringd-fido-client transports the signature bytes without generating an ECDSA signature.

  - source:
      title: WebAuthn Level 3 — 7.1 Registration / response type
      url: https://www.w3.org/TR/webauthn-3/#sctn-registering-a-new-credential
    text: Let response be credential.response. If response is not an instance of AuthenticatorAttestationResponse, abort the ceremony with a user-visible error.
    scope: other-component
    reason: The Relying Party application runs the registration ceremony; keyringd exposes a typed AuthenticatorAttestationResponse.

  - source:
      title: WebAuthn Level 3 — 7.1 Registration / client data decoding
      url: https://www.w3.org/TR/webauthn-3/#sctn-registering-a-new-credential
    text: >-
      Let JSONtext be the result of running UTF-8 decode on the value of response.clientDataJSON. Note: Using any implementation of UTF-8 decode is acceptable as long as it yields the same result as that yielded by the UTF-8 decode algorithm. In particular, any leading byte order mark (BOM) must be stripped. Let C, the client data claimed as collected during the credential creation, be the result of running an implementation-specific JSON parser on JSONtext.
    scope: other-component
    reason: The Relying Party application validates the ceremony data returned by its client; keyringd preserves the exact clientDataJSON bytes and provides a model codec.

  - source:
      title: WebAuthn Level 3 — 7.1 Registration / client data type and challenge
      url: https://www.w3.org/TR/webauthn-3/#sctn-registering-a-new-credential
    text: Verify that the value of C.type is webauthn.create. Verify that the value of C.challenge equals the base64url encoding of pkOptions.challenge.
    scope: other-component
    reason: Expected ceremony type and challenge are RP application state; keyringd cannot authenticate them without that state.

  - source:
      title: WebAuthn Level 3 — 7.1 Registration / origin
      url: https://www.w3.org/TR/webauthn-3/#sctn-registering-a-new-credential
    text: Verify that the value of C.origin is an origin expected by the Relying Party. See § 13.4.9 Validating the origin of a credential for guidance.
    scope: other-component
    reason: Origin allow-list policy belongs to the Relying Party; keyringd is a native client and has no browser origin policy.

  - source:
      title: WebAuthn Level 3 — 7.1 Registration / cross-origin context
      url: https://www.w3.org/TR/webauthn-3/#sctn-registering-a-new-credential
    text: 'If C.crossOrigin is present and set to true, verify that the Relying Party expects that this credential would have been created within an iframe that is not same-origin with its ancestors. If C.topOrigin is present: Verify that the Relying Party expects that this credential would have been created within an iframe that is not same-origin with its ancestors. Verify that the value of C.topOrigin matches the origin of a page that the Relying Party expects to be sub-framed within.'
    scope: out-of-scope
    reason: keyringd has no browser iframe execution context; an RP receiving browser-generated client data must perform these checks.

  - source:
      title: WebAuthn Level 3 — 7.1 Registration / client data hash
      url: https://www.w3.org/TR/webauthn-3/#sctn-registering-a-new-credential
    text: Let hash be the result of computing a hash over response.clientDataJSON using SHA-256.
    scope: other-component
    reason: Attestation verification is an RP operation; keyringd computes the same hash when issuing CTAP requests but does not verify RP attestation trust.

  - source:
      title: WebAuthn Level 3 — 7.1 Registration / attestation object decoding
      url: https://www.w3.org/TR/webauthn-3/#sctn-registering-a-new-credential
    text: Perform CBOR decoding on the attestationObject field of the AuthenticatorAttestationResponse structure to obtain the attestation statement format fmt, the authenticator data authData, and the attestation statement attStmt.
    scope: other-component
    reason: The RP owns registration verification; keyringd provides the AttestationObject decoder and exposes all three decoded components.

  - source:
      title: WebAuthn Level 3 — 7.1 Registration / RP ID hash
      url: https://www.w3.org/TR/webauthn-3/#sctn-registering-a-new-credential
    text: Verify that the rpIdHash in authData is the SHA-256 hash of the RP ID expected by the Relying Party.
    scope: other-component
    reason: The RP verifies the registration RP ID hash; keyringd-fido-client returns authenticator data without performing this check.

  - source:
      title: WebAuthn Level 3 — 7.1 Registration / user presence and verification
      url: https://www.w3.org/TR/webauthn-3/#sctn-registering-a-new-credential
    text: If options.mediation is not set to conditional, verify that the UP bit of the flags in authData is set. If the Relying Party requires user verification for this registration, verify that the UV bit of the flags in authData is set.
    scope: other-component
    reason: The RP verifies registration UP and UV flags against its policy; keyringd-fido-client preserves these flags.

  - source:
      title: WebAuthn Level 3 — 7.1 Registration / backup flags
      url: https://www.w3.org/TR/webauthn-3/#sctn-registering-a-new-credential
    text: If the BE bit of the flags in authData is not set, verify that the BS bit is not set.
    scope: other-component
    reason: The RP validates received authenticator state; keyringd's AuthenticatorData decoder already rejects the invalid flag combination.

  - source:
      title: WebAuthn Level 3 — 7.1 Registration / negotiated algorithm
      url: https://www.w3.org/TR/webauthn-3/#sctn-registering-a-new-credential
    text: Verify that the "alg" parameter in the credential public key in authData matches the alg attribute of one of the items in pkOptions.pubKeyCredParams.
    scope: other-component
    reason: The RP performs final registration validation against its original options; keyringd exposes both the decoded algorithm and option list.

  - source:
      title: WebAuthn Level 3 — 7.1 Registration / attestation verification
      url: https://www.w3.org/TR/webauthn-3/#sctn-registering-a-new-credential
    text: Verify that attStmt is a correct attestation statement, conveying a valid attestation signature, by using the attestation statement format fmt’s verification procedure given attStmt, authData and hash.
    scope: other-component
    reason: Cryptographic attestation verification and trust policy belong to the RP; keyringd models and decodes supported attestation statements.

  - source:
      title: WebAuthn Level 3 — 7.1 Registration / attestation trust
      url: https://www.w3.org/TR/webauthn-3/#sctn-registering-a-new-credential
    text: If the attestation statement is not deemed trustworthy, the Relying Party SHOULD fail the registration ceremony.
    scope: other-component
    reason: Acceptable trust anchors and attestation policy are application-specific RP responsibilities.

  - source:
      title: WebAuthn Level 3 — 7.1 Registration / credential ID length
      url: https://www.w3.org/TR/webauthn-3/#sctn-registering-a-new-credential
    text: Verify that the credentialId is ≤ 1023 bytes. Credential IDs larger than this many bytes SHOULD cause the RP to fail this registration ceremony.
    scope: other-component
    reason: The RP decides whether to persist the registration; keyringd preserves the authenticator-provided credential ID.

  - source:
      title: WebAuthn Level 3 — 7.1 Registration / duplicate credential ID
      url: https://www.w3.org/TR/webauthn-3/#sctn-registering-a-new-credential
    text: Verify that the credentialId is not yet registered for any user. If the credentialId is already known then the Relying Party SHOULD fail this registration ceremony.
    scope: other-component
    reason: Only the RP account database can determine whether a credential ID is already registered.

  - source:
      title: WebAuthn Level 3 — 7.1 Registration / credential record
      url: https://www.w3.org/TR/webauthn-3/#sctn-registering-a-new-credential
    text: 'Let credentialRecord be a new credential record with the following contents: type credential.type. id credential.id or credential.rawId, whichever format is preferred by the Relying Party. publicKey The credential public key in authData. signCount authData.signCount. uvInitialized The value of the UV flag in authData. transports The value returned from response.getTransports(). backupEligible The value of the BE flag in authData. backupState The value of the BS flag in authData.'
    scope: other-component
    reason: Credential-record persistence belongs to the RP account store; keyringd exposes the source fields.

  - source:
      title: WebAuthn Level 3 — 7.1 Registration / extension outputs
      url: https://www.w3.org/TR/webauthn-3/#sctn-registering-a-new-credential
    text: The Relying Party MUST be prepared to handle such situations, whether by ignoring the unsolicited extensions or by rejecting the attestation. The Relying Party MUST also be prepared to handle cases where none or not all of the requested extensions were acted upon.
    scope: other-component
    reason: The RP applies extension-output policy; keyringd preserves supported and unknown extension output values where its models require it.

  - source:
      title: WebAuthn Level 3 — 7.1 Registration / successful persistence
      url: https://www.w3.org/TR/webauthn-3/#sctn-registering-a-new-credential
    text: If all the above steps are successful, store credentialRecord in the user account that was denoted in pkOptions.user and continue the registration ceremony as appropriate. Otherwise, fail the registration ceremony.
    scope: other-component
    reason: User-account storage and registration outcome are RP application responsibilities.

  - source:
      title: WebAuthn Level 3 — 7.2 Authentication / response type
      url: https://www.w3.org/TR/webauthn-3/#sctn-verifying-assertion
    text: Let response be credential.response. If response is not an instance of AuthenticatorAssertionResponse, abort the ceremony with a user-visible error.
    scope: other-component
    reason: The RP application runs the authentication ceremony; keyringd exposes a typed AuthenticatorAssertionResponse.

  - source:
      title: WebAuthn Level 3 — 7.2 Authentication / allowed credential
      url: https://www.w3.org/TR/webauthn-3/#sctn-verifying-assertion
    text: If pkOptions.allowCredentials is not empty, verify that credential.id identifies one of the public key credentials listed in pkOptions.allowCredentials.
    scope: other-component
    reason: The RP verifies that the returned credential belongs to its allowed credentials; keyringd-fido-client passes the allow list to the authenticator.

  - source:
      title: WebAuthn Level 3 — 7.2 Authentication / identified user
      url: https://www.w3.org/TR/webauthn-3/#sctn-verifying-assertion
    text: If the user was identified before the authentication ceremony was initiated, e.g., via a username or cookie, verify that the identified user account contains a credential record whose id equals credential.rawId. Let credentialRecord be that credential record. If response.userHandle is present, verify that it equals the user handle of the user account.
    scope: other-component
    reason: User-account lookup and user-handle association require the RP database; keyringd returns the optional handle.

  - source:
      title: WebAuthn Level 3 — 7.2 Authentication / discoverable user
      url: https://www.w3.org/TR/webauthn-3/#sctn-verifying-assertion
    text: If the user was not identified before the authentication ceremony was initiated, verify that response.userHandle is present. Verify that the user account identified by response.userHandle contains a credential record whose id equals credential.rawId. Let credentialRecord be that credential record.
    scope: other-component
    reason: The RP resolves the returned user handle to an account; keyringd-fido-client additionally requires a user entity for discoverable authentication.

  - source:
      title: WebAuthn Level 3 — 7.2 Authentication / client data decoding
      url: https://www.w3.org/TR/webauthn-3/#sctn-verifying-assertion
    text: >-
      Let JSONtext be the result of running UTF-8 decode on the value of cData. Note: Using any implementation of UTF-8 decode is acceptable as long as it yields the same result as that yielded by the UTF-8 decode algorithm. In particular, any leading byte order mark (BOM) must be stripped. Let C, the client data claimed as used for the signature, be the result of running an implementation-specific JSON parser on JSONtext.
    scope: other-component
    reason: The RP validates signed client data against its ceremony state; keyringd preserves the exact bytes.

  - source:
      title: WebAuthn Level 3 — 7.2 Authentication / client data type and challenge
      url: https://www.w3.org/TR/webauthn-3/#sctn-verifying-assertion
    text: Verify that the value of C.type is the string webauthn.get. Verify that the value of C.challenge equals the base64url encoding of pkOptions.challenge.
    scope: other-component
    reason: Expected ceremony type and challenge are RP state; keyringd returns the exact signed client data.

  - source:
      title: WebAuthn Level 3 — 7.2 Authentication / origin
      url: https://www.w3.org/TR/webauthn-3/#sctn-verifying-assertion
    text: Verify that the value of C.origin is an origin expected by the Relying Party. See § 13.4.9 Validating the origin of a credential for guidance.
    scope: other-component
    reason: Origin policy belongs to the RP and browser deployment, outside the native keyringd client.

  - source:
      title: WebAuthn Level 3 — 7.2 Authentication / cross-origin context
      url: https://www.w3.org/TR/webauthn-3/#sctn-verifying-assertion
    text: 'If C.crossOrigin is present and set to true, verify that the Relying Party expects this credential to be used within an iframe that is not same-origin with its ancestors. If C.topOrigin is present: Verify that the Relying Party expects this credential to be used within an iframe that is not same-origin with its ancestors. Verify that the value of C.topOrigin matches the origin of a page that the Relying Party expects to be sub-framed within.'
    scope: out-of-scope
    reason: keyringd has no browser iframe execution context; an RP receiving browser-generated client data must perform these checks.

  - source:
      title: WebAuthn Level 3 — 7.2 Authentication / RP ID hash
      url: https://www.w3.org/TR/webauthn-3/#sctn-verifying-assertion
    text: Verify that the rpIdHash in authData is the SHA-256 hash of the RP ID expected by the Relying Party.
    scope: other-component
    reason: The RP verifies the assertion RP ID hash; keyringd-fido-client returns authenticator data without performing this check.

  - source:
      title: WebAuthn Level 3 — 7.2 Authentication / user presence and verification
      url: https://www.w3.org/TR/webauthn-3/#sctn-verifying-assertion
    text: Verify that the UP bit of the flags in authData is set. Determine whether user verification is required for this assertion. User verification SHOULD be required if, and only if, pkOptions.userVerification is set to required. If user verification was determined to be required, verify that the UV bit of the flags in authData is set. Otherwise, ignore the value of the UV flag.
    scope: other-component
    reason: The RP verifies assertion UP and UV flags against its policy; keyringd-fido-client preserves these flags.

  - source:
      title: WebAuthn Level 3 — 7.2 Authentication / backup flags
      url: https://www.w3.org/TR/webauthn-3/#sctn-verifying-assertion
    text: If the BE bit of the flags in authData is not set, verify that the BS bit is not set.
    scope: other-component
    reason: The RP validates authenticator state; keyringd's AuthenticatorData decoder rejects the invalid flag combination.

  - source:
      title: WebAuthn Level 3 — 7.2 Authentication / assertion signature
      url: https://www.w3.org/TR/webauthn-3/#sctn-verifying-assertion
    text: Let hash be the result of computing a hash over the cData using SHA-256. Using credentialRecord.publicKey, verify that sig is a valid signature over the binary concatenation of authData and hash.
    scope: other-component
    reason: The RP owns the stored credential public key and authenticates the assertion; keyringd supplies the exact signed components.

  - source:
      title: WebAuthn Level 3 — 7.2 Authentication / signature counter
      url: https://www.w3.org/TR/webauthn-3/#sctn-verifying-assertion
    text: 'If authData.signCount is nonzero or credentialRecord.signCount is nonzero, then run the following sub-step: If authData.signCount is greater than credentialRecord.signCount: The signature counter is valid. less than or equal to credentialRecord.signCount: This is a signal, but not proof, that the authenticator may be cloned.'
    scope: other-component
    reason: Counter comparison and clone-risk policy require the RP's persisted credential record.

  - source:
      title: WebAuthn Level 3 — 7.2 Authentication / extension outputs
      url: https://www.w3.org/TR/webauthn-3/#sctn-verifying-assertion
    text: The Relying Party MUST be prepared to handle such situations, whether by ignoring the unsolicited extensions or by rejecting the assertion. The Relying Party MUST also be prepared to handle cases where none or not all of the requested extensions were acted upon.
    scope: other-component
    reason: The RP applies extension-output policy; keyringd exposes decoded extension data.

  - source:
      title: WebAuthn Level 3 — 7.2 Authentication / credential state update
      url: https://www.w3.org/TR/webauthn-3/#sctn-verifying-assertion
    text: 'Update credentialRecord with new state values: Update credentialRecord.signCount to the value of authData.signCount. Update credentialRecord.backupState to the value of currentBs. If credentialRecord.uvInitialized is false, update it to the value of the UV bit in the flags in authData.'
    scope: other-component
    reason: Persisted credential state belongs to the RP account database.

  - source:
      title: WebAuthn Level 3 — 7.2 Authentication / outcome
      url: https://www.w3.org/TR/webauthn-3/#sctn-verifying-assertion
    text: If all the above steps are successful, continue the authentication ceremony as appropriate. Otherwise, fail the authentication ceremony.
    scope: other-component
    reason: The RP application owns the final authentication decision.

  - source:
      title: WebAuthn Level 3 — 8.1 Attestation format identifier / syntax
      url: https://www.w3.org/TR/webauthn-3/#sctn-attstn-fmt-ids
    text: Unregistered attestation statement format identifiers SHOULD use lowercase reverse domain-name naming, using a domain name registered by the developer, in order to assure uniqueness of the identifier. All attestation statement format identifiers MUST be a maximum of 32 octets in length and MUST consist only of printable USASCII characters, excluding backslash and doublequote, i.e., VCHAR as defined in [RFC5234] but without %x22 and %x5c.
    tests:
      - keyringd-fido-client::keyringd_fido_client::tests::spec::webauthn3::fido_client::operation::response_validation::rejects_invalid_attestation_format_identifiers_during_client_response_validation

  - source:
      title: WebAuthn Level 3 — 8.1 Attestation format identifier / matching
      url: https://www.w3.org/TR/webauthn-3/#sctn-attstn-fmt-ids
    text: Implementations MUST match WebAuthn attestation statement format identifiers in a case-sensitive fashion.
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::attestation_statement::matches_attestation_format_identifiers_case_sensitively

  - source:
      title: WebAuthn Level 3 — 8.2 Packed attestation / syntax
      url: https://www.w3.org/TR/webauthn-3/#sctn-packed-attestation
    text: 'The syntax of a Packed Attestation statement is defined by the following CDDL: $$attStmtType //= ( fmt: "packed", attStmt: packedStmtFormat ) packedStmtFormat = { alg: COSEAlgorithmIdentifier, sig: bytes, x5c: [ attestnCert: bytes, * (caCert: bytes) ] } // { alg: COSEAlgorithmIdentifier sig: bytes, }'
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::packed_attestation_statement::reject_an_empty_certificate_chain_when_decoding_and_encoding
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::packed_attestation_statement::enforce_required_fields_and_cbor_types_in_packed_attestation
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::packed_attestation_statement::round_trips_the_packed_algorithm_signature_and_certificate_chain_in_order
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::attestation_statement::round_trip_conversion_of_known_attestation_formats

  - source:
      title: WebAuthn Level 3 — 8.2 Packed attestation / algorithm
      url: https://www.w3.org/TR/webauthn-3/#sctn-packed-attestation
    text: alg A COSEAlgorithmIdentifier containing the identifier of the algorithm used to generate the attestation signature.
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::packed_attestation_statement::round_trips_the_packed_algorithm_signature_and_certificate_chain_in_order

  - source:
      title: WebAuthn Level 3 — 8.2 Packed attestation / signature
      url: https://www.w3.org/TR/webauthn-3/#sctn-packed-attestation
    text: sig A byte string containing the attestation signature.
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::packed_attestation_statement::round_trips_the_packed_algorithm_signature_and_certificate_chain_in_order

  - source:
      title: WebAuthn Level 3 — 8.2 Packed attestation / certificate chain
      url: https://www.w3.org/TR/webauthn-3/#sctn-packed-attestation
    text: x5c The elements of this array contain attestnCert and its certificate chain (if any), each encoded in X.509 format. The attestation certificate attestnCert MUST be the first element in the array.
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::packed_attestation_statement::round_trips_the_packed_algorithm_signature_and_certificate_chain_in_order

  - source:
      title: WebAuthn Level 3 — 8.2 Packed attestation / verification
      url: https://www.w3.org/TR/webauthn-3/#sctn-packed-attestation
    text: Verify that attStmt is valid CBOR conforming to the syntax defined above and perform CBOR decoding on it to extract the contained fields.
    scope: other-component
    reason: keyringd validates and decodes the wire structure, while the RP performs cryptographic attestation verification and trust evaluation.

  - source:
      title: WebAuthn Level 3 — 8.2.1 Packed attestation certificate
      url: https://www.w3.org/TR/webauthn-3/#sctn-packed-attestation-cert-requirements
    text: The Basic Constraints extension MUST have the CA component set to false.
    scope: other-component
    reason: X.509 attestation certificate validation is an RP responsibility outside keyringd's protocol-model scope.

  - source:
      title: WebAuthn Level 3 — 8.2.2 Enterprise packed attestation
      url: https://www.w3.org/TR/webauthn-3/#sctn-enterprise-packed-attestation-cert-requirements
    text: This extension MUST NOT be present in non-enterprise attestations.
    scope: out-of-scope
    reason: Enterprise attestation policy and device-identifying certificate extensions are outside the documented keyringd use case.

  - source:
      title: WebAuthn Level 3 — 8.3 TPM attestation
      url: https://www.w3.org/TR/webauthn-3/#sctn-tpm-attestation
    text: This attestation statement format is generally used by authenticators that use a Trusted Platform Module as their cryptographic engine.
    scope: out-of-scope
    reason: keyringd does not provide a typed TPM attestation model or TPM verification; the generic unknown-format representation preserves its CBOR statement.

  - source:
      title: WebAuthn Level 3 — 8.4 Android key attestation
      url: https://www.w3.org/TR/webauthn-3/#sctn-android-key-attestation
    text: When the authenticator in question is a platform authenticator on the Android "N" or later platform, the attestation statement is based on the Android key attestation.
    scope: out-of-scope
    reason: keyringd does not provide Android platform attestation verification; the generic unknown-format representation preserves its CBOR statement.

  - source:
      title: WebAuthn Level 3 — 8.5 Android SafetyNet attestation
      url: https://www.w3.org/TR/webauthn-3/#sctn-android-safetynet-attestation
    text: This format is deprecated and is expected to be removed in a future revision of this document.
    scope: out-of-scope
    reason: The deprecated SafetyNet format is not part of the keyringd native client scope; its statement can remain opaque.

  - source:
      title: WebAuthn Level 3 — 8.6 FIDO U2F attestation / syntax
      url: https://www.w3.org/TR/webauthn-3/#sctn-fido-u2f-attestation
    text: 'The syntax of a FIDO U2F attestation statement is defined as follows: $$attStmtType //= ( fmt: "fido-u2f", attStmt: u2fStmtFormat ) u2fStmtFormat = { x5c: [ attestnCert: bytes ], sig: bytes }'
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::attestation_statement::round_trip_conversion_of_known_attestation_formats
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::fido_u2f_attestation_statement::requires_exactly_one_attestation_certificate
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::fido_u2f_attestation_statement::enforce_required_fields_and_cbor_types_of_fido_u2f_attestation

  - source:
      title: WebAuthn Level 3 — 8.6 FIDO U2F attestation / certificate
      url: https://www.w3.org/TR/webauthn-3/#sctn-fido-u2f-attestation
    text: x5c A single element array containing the attestation certificate in X.509 format.
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::fido_u2f_attestation_statement::requires_exactly_one_attestation_certificate

  - source:
      title: WebAuthn Level 3 — 8.6 FIDO U2F attestation / verification
      url: https://www.w3.org/TR/webauthn-3/#sctn-fido-u2f-attestation
    text: Check that x5c has exactly one element and let attCert be that element.
    scope: other-component
    reason: keyringd enforces the one-certificate wire shape; the RP performs the subsequent certificate and signature verification.

  - source:
      title: WebAuthn Level 3 — 8.7 None attestation / syntax
      url: https://www.w3.org/TR/webauthn-3/#sctn-none-attestation
    text: 'The syntax of a none attestation statement is defined as follows: $$attStmtType //= ( fmt: "none", attStmt: emptyMap ) emptyMap = {}'
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::attestation_object::none_attestation_can_be_transformed_back_and_forth
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::attestation_statement::rejects_a_non_empty_none_attestation_statement

  - source:
      title: WebAuthn Level 3 — 8.7 None attestation / verification
      url: https://www.w3.org/TR/webauthn-3/#sctn-none-attestation
    text: Return implementation-specific values representing attestation type None and an empty attestation trust path.
    scope: other-component
    reason: The RP decides whether None attestation is acceptable; keyringd enforces the empty-map representation.

  - source:
      title: WebAuthn Level 3 — 8.8 Apple anonymous attestation
      url: https://www.w3.org/TR/webauthn-3/#sctn-apple-anonymous-attestation
    text: This attestation statement format is exclusively used by Apple for certain types of Apple devices that support WebAuthn.
    scope: out-of-scope
    reason: keyringd does not provide Apple attestation certificate verification; the generic unknown-format representation preserves its CBOR statement.

  - source:
      title: WebAuthn Level 3 — 8.9 Compound attestation
      url: https://www.w3.org/TR/webauthn-3/#sctn-compound-attestation
    text: The "compound" attestation statement format is used to pass multiple, self-contained attestation statements in a single ceremony.
    scope: out-of-scope
    reason: Existing project documentation explicitly excludes WebAuthn compound attestation.

  - source:
      title: WebAuthn Level 3 — 9.1 Extension identifier
      url: https://www.w3.org/TR/webauthn-3/#sctn-extension-id
    text: All extension identifiers MUST be a maximum of 32 octets in length and MUST consist only of printable USASCII characters, excluding backslash and doublequote, i.e., VCHAR as defined in [RFC5234] but without %x22 and %x5c. Implementations MUST match WebAuthn extension identifiers in a case-sensitive fashion.
    tests:
      - keyringd-fido-client::keyringd_fido_client::tests::spec::webauthn3::fido_client::operation::response_validation::accepts_syntactically_valid_unknown_authenticator_extension_identifiers_during_client_response_validation
      - keyringd-fido-client::keyringd_fido_client::tests::spec::webauthn3::fido_client::operation::response_validation::rejects_invalid_authenticator_extension_identifiers_during_client_response_validation
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::authentication_extensions_authenticator_outputs::round_trips_authenticator_extension_outputs_as_a_cbor_map

  - source:
      title: WebAuthn Level 3 — 9.2 Client extension output
      url: https://www.w3.org/TR/webauthn-3/#sctn-extension-specification
    text: Any client extension that is processed by the client MUST return a client extension output value so that the WebAuthn Relying Party knows that the extension was honored by the client.
    scope: out-of-scope
    reason: keyringd exposes native FIDO operation results rather than the browser WebAuthn client-extension result contract and does not process client extensions whose outputs must be returned to a WebAuthn Relying Party.

  - source:
      title: WebAuthn Level 3 — 9.2 Authenticator extension output
      url: https://www.w3.org/TR/webauthn-3/#sctn-extension-specification
    text: Similarly, any extension that requires authenticator processing MUST return an authenticator extension output to let the Relying Party know that the extension was honored by the authenticator.
    scope: other-component
    reason: The authenticator produces authenticator extension outputs; keyringd decodes and preserves the returned map.

  - source:
      title: WebAuthn Level 3 — 9.3 Client extension input
      url: https://www.w3.org/TR/webauthn-3/#sctn-extension-request-parameters
    text: A Relying Party simultaneously requests the use of an extension and sets its client extension input by including an entry in the extensions option to the create() or get() call. The entry key is the extension identifier and the value is the client extension input.
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::authentication_extensions_client_inputs::represents_the_credential_properties_and_credential_protection_client_inputs

  - source:
      title: WebAuthn Level 3 — 9.3 Extension input definitions
      url: https://www.w3.org/TR/webauthn-3/#sctn-extension-request-parameters
    text: Extension definitions MUST specify the valid values for their client extension input.
    scope: out-of-scope
    reason: This requirement applies to authors of WebAuthn extension specifications; keyringd implements selected registered extensions but does not define extension specifications.

  - source:
      title: WebAuthn Level 3 — 9.3 Invalid client extension input
      url: https://www.w3.org/TR/webauthn-3/#sctn-extension-request-parameters
    text: Clients SHOULD ignore extensions with an invalid client extension input.
    tests:
      - keyringd-fido-client::keyringd_fido_client::tests::spec::webauthn3::fido_client::ignores_an_unknown_credential_protection_policy_client_extension_input

  - source:
      title: WebAuthn Level 3 — 9.3 Authenticator extension request maps
      url: https://www.w3.org/TR/webauthn-3/#sctn-extension-request-parameters
    text: Extensions that have authenticator processing MUST specify the method of computing the authenticator extension input from the client extension input, and MUST define extensions for the CDDL types AuthenticationExtensionsAuthenticatorInputs and AuthenticationExtensionsAuthenticatorOutputs by defining an additional choice for the $$extensionInput and $$extensionOutput group sockets using the extension identifier as the entry key.
    scope: out-of-scope
    reason: This is a requirement on authors of WebAuthn extension specifications; keyringd implements selected registered extensions but does not define a new extension specification or its CDDL sockets.

  - source:
      title: WebAuthn Level 3 — 9.4 Client extension output map
      url: https://www.w3.org/TR/webauthn-3/#sctn-client-extension-processing
    text: Likewise, the client extension outputs are represented as a dictionary in the result of getClientExtensionResults() with extension identifiers as keys, and the client extension output value of each extension as the value. Like the client extension input, the client extension output is a value that can be encoded in JSON. There MUST NOT be any values returned for ignored extensions.
    scope: out-of-scope
    reason: keyringd does not expose the browser PublicKeyCredential.getClientExtensionResults() API; its documented public operations return native MakeCredentialResult and GetAssertionsResult values.

  - source:
      title: WebAuthn Level 3 — 9.4 Authenticator-to-client extension processing
      url: https://www.w3.org/TR/webauthn-3/#sctn-client-extension-processing
    text: Extensions that require authenticator processing MUST define the process by which the client extension input can be used to determine the CBOR authenticator extension input and the process by which the CBOR authenticator extension output, and the unsigned extension output if used, can be used to determine the client extension output.
    scope: out-of-scope
    reason: This requirement governs what each extension specification must define, not generic client runtime behavior; keyringd does not author WebAuthn extension specifications.

  - source:
      title: WebAuthn Level 3 — 9.5 Authenticator extension input map
      url: https://www.w3.org/TR/webauthn-3/#sctn-authenticator-extension-processing
    text: The CBOR authenticator extension input value of each processed authenticator extension is included in the extensions parameter of the authenticatorMakeCredential and authenticatorGetAssertion operations. The extensions parameter is a CBOR map where each key is an extension identifier and the corresponding value is the authenticator extension input for that extension.
    tests:
      - keyringd-fido-client::keyringd_fido_client::tests::spec::ctap22::fido_client::operation::operation_manager::preserves_an_enforced_relying_party_credential_protection_policy

  - source:
      title: WebAuthn Level 3 — 9.5 Authenticator extension output map
      url: https://www.w3.org/TR/webauthn-3/#sctn-authenticator-extension-processing
    text: Likewise, the extension output is represented in the extensions part of the authenticator data. The extensions part of the authenticator data is a CBOR map where each key is an extension identifier and the corresponding value is the authenticator extension output for that extension.
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::authentication_extensions_authenticator_outputs::round_trips_authenticator_extension_outputs_as_a_cbor_map

  - source:
      title: WebAuthn Level 3 — 9.5 Ignored authenticator extensions
      url: https://www.w3.org/TR/webauthn-3/#sctn-authenticator-extension-processing
    text: For each supported extension, the authenticator extension processing rule for that extension is used create the authenticator extension output, and unsigned extension output if used, from the authenticator extension input and possibly also other inputs. There MUST NOT be any values returned for ignored extensions.
    scope: other-component
    reason: The authenticator decides which extension inputs it processes; keyringd carries and decodes the resulting maps.

  - source:
      title: WebAuthn Level 3 — 10.1.1 FIDO AppID extension
      url: https://www.w3.org/TR/webauthn-3/#sctn-appid-extension
    text: This extension allows WebAuthn Relying Parties that have previously registered a credential using the legacy FIDO U2F JavaScript API [FIDOU2FJavaScriptAPI] to request an assertion.
    scope: out-of-scope
    reason: Existing project documentation excludes legacy CTAP1/U2F command fallback and keyringd does not migrate legacy AppID-scoped credentials.

  - source:
      title: WebAuthn Level 3 — 10.1.2 FIDO AppID exclusion extension
      url: https://www.w3.org/TR/webauthn-3/#sctn-appid-exclude-extension
    text: This registration extension allows WebAuthn Relying Parties to exclude authenticators that contain specified credentials that were created with the legacy FIDO U2F JavaScript API [FIDOU2FJavaScriptAPI].
    scope: out-of-scope
    reason: Existing project documentation excludes legacy CTAP1/U2F commands and AppID migration.

  - source:
      title: WebAuthn Level 3 — 10.1.3 Credential properties / client input
      url: https://www.w3.org/TR/webauthn-3/#sctn-authenticator-credential-properties-extension
    text: 'The Boolean value true to indicate that this extension is requested by the Relying Party. partial dictionary AuthenticationExtensionsClientInputs { boolean credProps; }; partial dictionary AuthenticationExtensionsClientInputsJSON { boolean credProps; };'
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::authentication_extensions_client_inputs::represents_the_credential_properties_and_credential_protection_client_inputs

  - source:
      title: WebAuthn Level 3 — 10.1.3 Credential properties / processing
      url: https://www.w3.org/TR/webauthn-3/#sctn-authenticator-credential-properties-extension
    text: Set rk to the value of the requireResidentKey parameter that was used in the invocation of the authenticatorMakeCredential operation.
    scope: out-of-scope
    reason: keyringd-fido-client returns its documented native MakeCredentialResult rather than a browser PublicKeyCredential with getClientExtensionResults(); it requires discoverable credentials but does not implement browser credProps result processing.

  - source:
      title: WebAuthn Level 3 — 10.1.3 Credential properties / client output
      url: https://www.w3.org/TR/webauthn-3/#sctn-authenticator-credential-properties-extension
    text: 'Set clientExtensionResults["credProps"]["rk"] to the value of the requireResidentKey parameter that was used in the invocation of the authenticatorMakeCredential operation. dictionary CredentialPropertiesOutput { boolean rk; }; partial dictionary AuthenticationExtensionsClientOutputs { CredentialPropertiesOutput credProps; }; partial dictionary AuthenticationExtensionsClientOutputsJSON { CredentialPropertiesOutput credProps; };'
    scope: out-of-scope
    reason: keyringd requires discoverable credentials but returns its documented native MakeCredentialResult rather than a browser PublicKeyCredential with a credProps client-extension result.

  - source:
      title: WebAuthn Level 3 — 10.1.3 Credential properties / discoverability
      url: https://www.w3.org/TR/webauthn-3/#dom-credentialpropertiesoutput-rk
    text: This OPTIONAL property, known abstractly as the client-side discoverable credential property or as the resident key credential property, is a Boolean value indicating whether the PublicKeyCredential returned as a result of a registration ceremony is a client-side discoverable credential. If rk is true, the credential is a discoverable credential. If rk is false, the credential is a server-side credential. If rk is not present, it is not known whether the credential is a discoverable credential or a server-side credential.
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::authentication_extensions_client_outputs::preserves_an_explicit_true_discoverable_credential_result
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::authentication_extensions_client_outputs::preserves_an_explicit_false_discoverable_credential_result
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::authentication_extensions_client_outputs::preserves_an_omitted_discoverable_credential_result

  - source:
      title: WebAuthn Level 3 — 10.1.4 PRF extension
      url: https://www.w3.org/TR/webauthn-3/#prf-extension
    text: This client registration extension and authentication extension allows a Relying Party to evaluate outputs from a pseudo-random function (PRF) associated with a credential. The PRFs provided by this extension map from BufferSources of any length to 32-byte BufferSources.
    scope: out-of-scope
    reason: keyringd does not request or consume PRF outputs, and the underlying CTAP hmac-secret extension is outside the documented scope.

  - source:
      title: WebAuthn Level 3 — 10.1.5 Large blob extension
      url: https://www.w3.org/TR/webauthn-3/#sctn-large-blob-extension
    text: This client registration extension and authentication extension allows a Relying Party to store opaque data associated with a credential.
    scope: out-of-scope
    reason: keyringd does not read, write, or manage per-credential large blobs; CTAP large-blob facilities are also outside scope.

  - source:
      title: WebAuthn Level 3 — 11 User agent automation
      url: https://www.w3.org/TR/webauthn-3/#sctn-automation
    text: For the purposes of user agent automation and web application testing, this document defines a number of [WebDriver] extension commands.
    scope: out-of-scope
    reason: keyringd is a native FIDO protocol/client library and does not implement WebDriver endpoints or browser virtual authenticators.

  - source:
      title: WebAuthn Level 3 — 13.2 Client-authenticator proximity
      url: https://www.w3.org/TR/webauthn-3/#sctn-client-authenticator-proximity
    text: If designing a solution where the authenticator does not need to be physically close to the client, or where client and authenticator do not communicate directly, designers SHOULD consider how this affects the enforcement of scope restrictions and the strength of the authenticator as a something you have authentication factor.
    scope: out-of-scope
    reason: This is security-design guidance to solution designers rather than a testable client protocol behavior; the ledger separately tracks the concrete Hybrid transport scope and transaction requirements implemented by keyringd.

  - source:
      title: WebAuthn Level 3 — 13.3.1 Attestation certificate hierarchy
      url: https://www.w3.org/TR/webauthn-3/#sctn-cert-hierarchy
    text: A 3-tier hierarchy for attestation certificates is RECOMMENDED (i.e., Attestation Root, Attestation Issuing CA, Attestation Certificate). It is also RECOMMENDED that for each WebAuthn Authenticator device line (i.e., model), a separate issuing CA is used to help facilitate isolating problems with a specific version of an authenticator model.
    scope: other-component
    reason: Attestation certificate issuance belongs to authenticator manufacturers and is not performed by keyringd.

  - source:
      title: WebAuthn Level 3 — 13.3.2 Compromised attestation certificate
      url: https://www.w3.org/TR/webauthn-3/#sctn-ca-compromise
    text: A WebAuthn Authenticator attestation certificate MUST be revoked by the issuing CA if its private key has been compromised.
    scope: other-component
    reason: Certificate revocation is the issuing CA and authenticator manufacturer's responsibility.

  - source:
      title: WebAuthn Level 3 — 13.4.3 Cryptographic challenge generation
      url: https://www.w3.org/TR/webauthn-3/#sctn-cryptographic-challenges
    text: Therefore, the values of both PublicKeyCredentialCreationOptions.challenge and PublicKeyCredentialRequestOptions.challenge MUST be randomly generated by Relying Parties in an environment they trust (e.g., on the server-side), and the returned challenge value in the client’s response MUST match what was generated.
    scope: other-component
    reason: The caller supplies challenge bytes to keyringd; trusted random generation and response matching belong to the RP.

  - source:
      title: WebAuthn Level 3 — 13.4.3 Cryptographic challenge entropy
      url: https://www.w3.org/TR/webauthn-3/#sctn-cryptographic-challenges
    text: In order to prevent replay attacks, the challenges MUST contain enough entropy to make guessing them infeasible. Challenges SHOULD therefore be at least 16 bytes long.
    scope: other-component
    reason: Challenge entropy is controlled by the RP application that supplies the value.

  - source:
      title: WebAuthn Level 3 — 13.4.5 Revoked attestation certificates
      url: https://www.w3.org/TR/webauthn-3/#sctn-revoked-attestation-certificates
    text: It is thus RECOMMENDED that Relying Parties remember intermediate attestation CA certificates during registration in order to un-register related public key credentials if the registration was performed after revocation of such certificates.
    scope: other-component
    reason: RP certificate-trust history and credential revocation require persistent application state outside keyringd.

  - source:
      title: WebAuthn Level 3 — 13.4.6 Multiple credentials
      url: https://www.w3.org/TR/webauthn-3/#sctn-credential-loss-key-mobility
    text: Relying Parties SHOULD allow and encourage users to register multiple credentials to the same user account. Relying Parties SHOULD make use of the excludeCredentials and user.id options to ensure that these different credentials are bound to different authenticators.
    scope: other-component
    reason: Account recovery and registered-credential policy belong to the RP application; keyringd exposes the relevant option fields.

  - source:
      title: WebAuthn Level 3 — 13.4.8 Subdomain origin safety
      url: https://www.w3.org/TR/webauthn-3/#sctn-code-injection
    text: Therefore, the Relying Party by default SHOULD NOT allow a subdomain origin when verifying the assertion. If the Relying Party needs to allow a subdomain origin, then the Relying Party MUST NOT serve untrusted code on any allowed subdomain of origins within the scope of its public key credentials.
    scope: other-component
    reason: Web origin hosting and code-injection controls belong to the RP deployment, not the native keyringd client.

  - source:
      title: WebAuthn Level 3 — 13.4.9 Origin validation
      url: https://www.w3.org/TR/webauthn-3/#sctn-validating-origin
    text: When registering a credential and when verifying an assertion, the Relying Party MUST validate the origin member of the client data. The Relying Party MUST NOT accept unexpected values of origin, as doing so could allow a malicious website to obtain valid credentials.
    scope: other-component
    reason: The RP defines expected origins; keyringd preserves the client data but has no browser deployment allow-list.

  - source:
      title: WebAuthn Level 3 — 13.4.9 Top origin validation
      url: https://www.w3.org/TR/webauthn-3/#sctn-validating-origin
    text: When topOrigin is present, the Relying Party MUST validate that its value is expected.
    scope: out-of-scope
    reason: keyringd has no browser iframe context; an RP accepting browser client data must validate topOrigin.

  - source:
      title: WebAuthn Level 3 — 14.3 Biometric privacy
      url: https://www.w3.org/TR/webauthn-3/#sctn-biometric-privacy
    text: Biometric data is not revealed to the WebAuthn Relying Party; it is used only locally to perform user verification authorizing the creation and registration of, or authentication using, a public key credential.
    scope: other-component
    reason: Biometric matching and data protection occur inside the authenticator or platform; keyringd receives only the signed UV result.

  - source:
      title: WebAuthn Level 3 — 14.4.2 Authenticator PII disclosure
      url: https://www.w3.org/TR/webauthn-3/#sctn-pii-privacy
    text: If an authenticator chooses to do so, it SHOULD NOT expose personally identifying information unless successful user verification has been performed. If the authenticator supports user verification with more than one concurrently enrolled user, the authenticator SHOULD NOT expose personally identifying information of users other than the currently verified user. Consequently, an authenticator that is not capable of user verification SHOULD NOT store personally identifying information.
    scope: other-component
    reason: Authenticator storage and disclosure policy are outside the client library; keyringd transports the protocol-defined user entity.

  - source:
      title: WebAuthn Level 3 — 14.5.1 Registration privacy
      url: https://www.w3.org/TR/webauthn-3/#sctn-make-credential-privacy
    text: In order to protect users from being identified without consent, implementations of the [[Create]](origin, options, sameOriginWithAncestors) method need to take care to not leak information that could enable a malicious WebAuthn Relying Party to distinguish between these cases, where "excluded" means that at least one of the credentials listed by the Relying Party in excludeCredentials is bound to the authenticator.
    scope: out-of-scope
    reason: keyringd is explicitly not a browser WebAuthn client and does not implement the origin-bearing [[Create]] method; its native API forwards excludeCredentials and reports native operation outcomes to its trusted caller.

  - source:
      title: WebAuthn Level 3 — 14.5.1 Registration privacy / consent
      url: https://www.w3.org/TR/webauthn-3/#sctn-make-credential-privacy
    text: The above is not a concern, however, if the user has consented to create a new credential before a distinguishable error is returned, because in this case the user has confirmed intent to share the information that would be leaked.
    scope: out-of-scope
    reason: This condition qualifies the browser [[Create]] privacy requirement that is outside the native keyringd API; user consent itself is collected by the selected authenticator or OS credential UI.

  - source:
      title: WebAuthn Level 3 — 14.5.2 Authentication privacy
      url: https://www.w3.org/TR/webauthn-3/#sctn-assertion-privacy
    text: In order to protect users from being identified without consent, implementations of the [[DiscoverFromExternalSource]](origin, options, sameOriginWithAncestors) method need to take care to not leak information that could enable a malicious WebAuthn Relying Party to distinguish between these cases, where "named" means that the credential is listed by the Relying Party in allowCredentials.
    scope: out-of-scope
    reason: keyringd does not implement the browser origin-bearing [[DiscoverFromExternalSource]] method; its native API performs explicit credential operations for its trusted SSH application caller.

  - source:
      title: WebAuthn Level 3 — 14.5.3 Operating system account isolation
      url: https://www.w3.org/TR/webauthn-3/#sctn-os-account-privacy
    text: If a platform authenticator is included in a client device with a multi-user operating system, the platform authenticator and client device SHOULD work together to ensure that the existence of any platform credential is revealed only to the operating system user that created that platform credential.
    scope: other-component
    reason: OS account isolation belongs to the platform authenticator and operating system; keyringd uses explicitly available transports.

  - source:
      title: WebAuthn Level 3 — 14.5.4 Client capability disclosure
      url: https://www.w3.org/TR/webauthn-3/#sctn-disclosing-client-capabilities
    text: To reduce this risk, clients SHOULD prefer to omit a key from the returned record rather than returning a value of false.
    scope: out-of-scope
    reason: keyringd does not expose the browser getClientCapabilities() record.

  - source:
      title: WebAuthn Level 3 — 14.5.5 Cross-origin user interface
      url: https://www.w3.org/TR/webauthn-3/#sctn-cross-origin-use
    text: 'For scenarios where the calling origin and RP ID are different, such as with Related Origin Requests, WebAuthn Clients and client platforms SHOULD ensure that the credential and authenticator selection interfaces provide clear context to the user by displaying both: The caller’s origin: The origin of the fully active document that is invoking navigator.credentials The Relying Party ID: The RP ID for which the credential was originally created or will be created'
    scope: out-of-scope
    reason: keyringd has no browser origin, related-origin request, or iframe UI context.

  - source:
      title: WebAuthn Level 3 — 14.6.1 User handle contents
      url: https://www.w3.org/TR/webauthn-3/#sctn-user-handle-privacy
    text: Since the user handle is not considered personally identifying information in § 14.4.2 Privacy of personally identifying information Stored in Authenticators, and since authenticators MAY reveal user handles without first performing user verification, the Relying Party MUST NOT include personally identifying information, e.g., e-mail addresses or usernames, in the user handle.
    scope: other-component
    reason: The RP application chooses user handles; keyringd treats them as opaque bytes.

  - source:
      title: WebAuthn Level 3 — 14.6.1 Random user handles
      url: https://www.w3.org/TR/webauthn-3/#sctn-user-handle-privacy
    text: It is RECOMMENDED to let the user handle be 64 random bytes, and store this value in the user account.
    scope: other-component
    reason: User-handle generation and account storage belong to the RP application.

  - source:
      title: WebAuthn Level 3 — 14.6.3 Unknown credential signalling
      url: https://www.w3.org/TR/webauthn-3/#sctn-credential-id-privacy-leak
    text: When signalling that a credential id was not recognized, the WebAuthn Relying Party SHOULD use the signalUnknownCredential(options) method instead of the signalAllAcceptedCredentials(options) method to avoid exposing credential IDs to an unauthenticated caller.
    scope: out-of-scope
    reason: keyringd does not implement browser credential signal methods or authenticator credential inventory synchronization.

  - source:
      title: WebAuthn Level 3 — 15 User verification accessibility
      url: https://www.w3.org/TR/webauthn-3/#sctn-accessiblility-considerations
    text: User verification-capable authenticators, whether roaming or platform, should offer users more than one user verification method. For example, both fingerprint sensing and PIN entry. This allows for fallback to other user verification means if the selected one is not working for some reason.
    scope: other-component
    reason: The authenticator and platform provide verification methods; keyringd-fido-client can negotiate built-in UV and client PIN only when advertised.

  - source:
      title: WebAuthn Level 3 — 15 Ceremony timeout adjustment
      url: https://www.w3.org/TR/webauthn-3/#sctn-accessiblility-considerations
    text: If a client platform determines that a Relying Party-supplied timeout does not appropriately adhere to the latter [WCAG21] guidelines, then the client platform MAY adjust the timeout accordingly.
    scope: out-of-scope
    reason: keyringd does not perform the optional client-platform WCAG assessment or adjust caller-supplied timeouts. The native API uses the supplied value unchanged and a 120-second default only when it is omitted.

  - source:
      title: WebAuthn Level 3 — 15.1 Ceremony timeout range
      url: https://www.w3.org/TR/webauthn-3/#sctn-timeout-recommended-range
    text: 'Recommended range: 300000 milliseconds to 600000 milliseconds.'
    scope: out-of-scope
    reason: keyringd-fido-client uses caller-supplied timeouts unchanged, without clamping them to a client-defined range. The native API uses a 120-second default only when the timeout is omitted.

  - source:
      title: WebAuthn Level 3 — 15.1 Ceremony timeout default
      url: https://www.w3.org/TR/webauthn-3/#sctn-timeout-recommended-range
    text: 'Recommended default value: 300000 milliseconds (5 minutes).'
    scope: out-of-scope
    reason: keyringd-fido-client uses a fixed 120-second native-client default. Callers can override the timeout per operation; the API does not adopt this non-normative recommended default.

  - source:
      title: RFC 9987 — 3 Protocol Overview / client-driven request-response
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-3
    text: The agent protocol is a packetised request-response protocol that is solely driven by the client. It consists of a number of requests sent from a client to an agent and a set of reply messages that are sent in response.
    tests:
      - keyringd-ssh-agent-protocol::keyringd_ssh_agent_protocol::tests::spec::rfc9987::response_ordering::returns_pipelined_responses_in_request_order
      - keyringd-ssh-agent-protocol::keyringd_ssh_agent_protocol::tests::spec::rfc9987::server::accept_stream_and_handle_ssh_agent_connections

  - source:
      title: RFC 9987 — 3 Protocol Overview / no unsolicited Agent messages
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-3
    text: At no time does the agent send messages except in response to a client request.
    tests:
      - keyringd-ssh-agent-protocol::keyringd_ssh_agent_protocol::tests::spec::rfc9987::server::accept_stream_and_handle_ssh_agent_connections

  - source:
      title: RFC 9987 — 3 Protocol Overview / reply ordering
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-3
    text: Replies are sent in order.
    tests:
      - keyringd-ssh-agent-protocol::keyringd_ssh_agent_protocol::tests::spec::rfc9987::response_ordering::returns_pipelined_responses_in_request_order

  - source:
      title: RFC 9987 — 3 Protocol Overview / subset of key types and operations
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-3
    text: Agents MAY implement support for only a subset of available key types and MAY additionally refuse some operations in particular contexts. For example, an agent may allow only clients local to itself to add keys or may make particular subsets of keys available to a given client.
    tests:
      - keyringd-core::keyringd_core::tests::spec::rfc9987::request_handler::rejects_every_unsupported_or_unassigned_ssh_agent_request_type

  - source:
      title: RFC 9987 — 3 Protocol Overview / refused operations
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-3
    text: For this reason, clients of the agent SHOULD be prepared to fail gracefully if any operation is refused.
    scope: other-component
    reason: This requirement applies to clients of the SSH Agent protocol; keyringd implements the responder side.

  - source:
      title: RFC 9987 — 4 Terminology and Units / SSH encoding data types
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-4
    text: All encoding data types ("byte", "uint32", "string", etc.) are as specified in Section 5 of [RFC4251].
    tests:
      - keyringd-ssh-agent-protocol::keyringd_ssh_agent_protocol::tests::spec::rfc9987::wire_messages::decodes_an_ssh_agentc_sign_request_fixed_vector
      - keyringd-ssh-agent-protocol::keyringd_ssh_agent_protocol::tests::spec::rfc9987::wire_messages::encodes_identity_key_blobs_and_utf_8_comments_in_list_order

  - source:
      title: RFC 9987 — 4 Terminology and Units / byte array
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-4
    text: Additionally, the type "byte[]" without a specified length within the square brackets indicates an unadorned sequence of zero or more bytes where the length is determined by context.
    tests:
      - keyringd-ssh-agent-protocol::keyringd_ssh_agent_protocol::tests::spec::rfc9987::wire_messages::decodes_an_ssh_agentc_extension_request_with_empty_contents
      - keyringd-ssh-agent-protocol::keyringd_ssh_agent_protocol::tests::spec::rfc9987::wire_messages::decodes_an_ssh_agentc_extension_request_with_opaque_binary_contents

  - source:
      title: RFC 9987 — 4 Terminology and Units / length units
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-4
    text: All length units are given in bytes unless otherwise specified.
    tests:
      - keyringd-ssh-agent-protocol::keyringd_ssh_agent_protocol::tests::spec::rfc9987::connection_framing::reassembles_a_length_prefix_and_payload_split_across_reads
      - keyringd-ssh-agent-protocol::keyringd_ssh_agent_protocol::tests::spec::rfc9987::wire_messages::decodes_an_ssh_agentc_sign_request_fixed_vector

  - source:
      title: RFC 9987 — 5 Protocol Messages / message framing
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-5
    text: |-
      Messages consist of a "length", "type", and "contents".

          uint32            length
          byte              type
          byte[length - 1]  contents
    tests:
      - keyringd-ssh-agent-protocol::keyringd_ssh_agent_protocol::tests::spec::rfc9987::connection_framing::reassembles_a_length_prefix_and_payload_split_across_reads
      - keyringd-ssh-agent-protocol::keyringd_ssh_agent_protocol::tests::spec::rfc9987::connection_framing::reassembles_request_contents_split_across_multiple_body_reads
      - keyringd-ssh-agent-protocol::keyringd_ssh_agent_protocol::tests::spec::rfc9987::connection_framing::rejects_eof_in_a_framed_message_body
      - keyringd-ssh-agent-protocol::keyringd_ssh_agent_protocol::tests::spec::rfc9987::connection::reject_the_cut_off_ssh_agent_length_prefix

  - source:
      title: RFC 9987 — 5.1 Generic Agent Responses / success response
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-5.1
    text: |-
      On success, the agent MUST reply either with the single-byte response:

          byte              SSH_AGENT_SUCCESS

      or with a request-specific success message that may contain additional fields.
    tests:
      - keyringd-ssh-agent-protocol::keyringd_ssh_agent_protocol::tests::spec::rfc9987::wire_messages::encodes_generic_success_and_failure_as_single_byte_responses

  - source:
      title: RFC 9987 — 5.1 Generic Agent Responses / failure response
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-5.1
    text: |-
      On failure, the agent MUST reply with the single-byte response:

          byte              SSH_AGENT_FAILURE

      or with a request-specific failure message that may contain additional fields.
    tests:
      - keyringd-ssh-agent-protocol::keyringd_ssh_agent_protocol::tests::spec::rfc9987::connection_framing::returns_ssh_agent_failure_on_the_wire_for_invalid_requests
      - keyringd-ssh-agent-protocol::keyringd_ssh_agent_protocol::tests::spec::rfc9987::wire_messages::encodes_generic_success_and_failure_as_single_byte_responses

  - source:
      title: RFC 9987 — 5.1 Generic Agent Responses / unknown or unsupported request
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-5.1
    text: SSH_AGENT_FAILURE messages MUST also be sent in reply to requests with unknown or unsupported types.
    tests:
      - keyringd-ssh-agent-protocol::keyringd_ssh_agent_protocol::tests::spec::rfc9987::connection_framing::returns_ssh_agent_failure_on_the_wire_for_invalid_requests
      - keyringd-core::keyringd_core::tests::spec::rfc9987::request_handler::rejects_every_unsupported_or_unassigned_ssh_agent_request_type

  - source:
      title: RFC 9987 — 5.2 Adding Keys to the Agent / add identity message
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-5.2
    text: |-
      The generic format for the SSH_AGENTC_ADD_IDENTITY message is:

          byte             SSH_AGENTC_ADD_IDENTITY
          string           key type
          byte[]           key data
          string           comment
    scope: out-of-scope
    reason: keyringd is a read-only Agent backed by configured credentials and does not accept requests to add private keys.

  - source:
      title: RFC 9987 — 5.2 Adding Keys to the Agent / add identity fields
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-5.2
    text: Here "key type" is the specified key type name, for example, "ssh-rsa" for an RSA key as defined by [RFC4253]. The "key data" consists of the public and private components of the key and varies by key type, as specified in Sections 5.2.1 through 5.2.4 for commonly used key types. A "comment" is a human-readable key name or comment as a UTF-8 string that may serve to identify the key in user-visible messages. This string may be of zero length.
    scope: out-of-scope
    reason: keyringd does not accept SSH_AGENTC_ADD_IDENTITY or retain caller-supplied private-key material and comments.

  - source:
      title: RFC 9987 — 5.2 Adding Keys to the Agent / constrained add identity message
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-5.2
    text: |-
      The SSH_AGENTC_ADD_ID_CONSTRAINED message is similar but adds an extra field:

          byte             SSH_AGENTC_ADD_ID_CONSTRAINED
          string           key type
          byte[]           key data
          string           comment
          constraint[]     constraints
    scope: out-of-scope
    reason: keyringd does not accept key-addition requests, including constrained key addition.

  - source:
      title: RFC 9987 — 5.2 Adding Keys to the Agent / empty constraints client preference
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-5.2
    text: Clients SHOULD prefer the SSH_AGENTC_ADD_IDENTITY message over sending an SSH_AGENTC_ADD_ID_CONSTRAINED message with an empty "constraints" field, though both are valid and equivalent.
    scope: other-component
    reason: This requirement governs messages selected by an SSH Agent client; keyringd implements the responder side.

  - source:
      title: RFC 9987 — 5.2 Adding Keys to the Agent / add result
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-5.2
    text: An agent MUST reply with SSH_AGENT_SUCCESS if the key was successfully loaded as a result of one of these messages or SSH_AGENT_FAILURE otherwise.
    scope: out-of-scope
    reason: keyringd deliberately rejects all key-addition requests because its credentials are managed outside the SSH Agent protocol.

  - source:
      title: RFC 9987 — 5.2 Adding Keys to the Agent / duplicate key constraints
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-5.2
    text: Adding a key that is already present in an agent SHOULD replace any constraints it was previously loaded with those (if any) that are present in the subsequent add request, as this ensures that security-relevant constraints on a loaded key best match user expectations.
    scope: out-of-scope
    reason: keyringd does not accept key-addition requests or Agent-protocol key constraints.

  - source:
      title: RFC 9987 — 5.2 Adding Keys to the Agent / duplicate key refusal
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-5.2
    text: Otherwise, an agent MAY refuse to load a key that has already been loaded.
    scope: out-of-scope
    reason: keyringd refuses all key-addition requests before duplicate-key handling is applicable.

  - source:
      title: RFC 9987 — 5.2 Adding Keys to the Agent / supported key type subset
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-5.2
    text: An agent MAY support only a subset of the key types defined here and MAY support additional key types as described below.
    scope: out-of-scope
    reason: This permission concerns key types accepted by the unsupported Agent key-addition operation; public identity and signature formats are governed separately.

  - source:
      title: RFC 9987 — 5.2 Adding Keys to the Agent / unrecognized key type
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-5.2
    text: If an agent does not recognise the type name in a request to add a key, then it MUST respond with an SSH_AGENT_FAILURE reply.
    scope: out-of-scope
    reason: keyringd does not parse individual key types for the unsupported key-addition operation and rejects the operation as a whole under the generic unsupported-request requirement.

  - source:
      title: RFC 9987 — 5.2.1 DSA Keys / add message
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-5.2.1
    text: |-
      Digital Signature Algorithm (DSA) keys have key type name "ssh-dss" and are defined in [RFC4253]. They may be added to the agent using the following message. The "constraints" field is only present for the SSH_AGENTC_ADD_ID_CONSTRAINED message.

          byte             SSH_AGENTC_ADD_IDENTITY or
                           SSH_AGENTC_ADD_ID_CONSTRAINED
          string           "ssh-dss"
          mpint            p
          mpint            q
          mpint            g
          mpint            y
          mpint            x
          string           comment
          constraint[]     constraints
    scope: out-of-scope
    reason: keyringd does not accept DSA or any other private key through Agent key-addition messages.

  - source:
      title: RFC 9987 — 5.2.1 DSA Keys / fields
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-5.2.1
    text: The "p", "q", and "g" values are the DSA domain parameters. The "y" and "x" values are the public and private keys, respectively. These values are as defined by Section 4.1 of [FIPS.186-4].
    scope: out-of-scope
    reason: keyringd does not accept DSA private keys through Agent key-addition messages.

  - source:
      title: RFC 9987 — 5.2.2 ECDSA Keys / add message
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-5.2.2
    text: |-
      Elliptic Curve Digital Signature Algorithm (ECDSA) keys have key types starting with "ecdsa-sha2-" and are defined in [RFC5656]. They may be added to the agent using the following message. The "constraints" field is only present for the SSH_AGENTC_ADD_ID_CONSTRAINED message.

          byte             SSH_AGENTC_ADD_IDENTITY or
                           SSH_AGENTC_ADD_ID_CONSTRAINED
          string           key type
          string           ecdsa_curve_name
          string           Q
          mpint            d
          string           comment
          constraint[]     constraints
    scope: out-of-scope
    reason: keyringd does not accept ECDSA or any other private key through Agent key-addition messages.

  - source:
      title: RFC 9987 — 5.2.2 ECDSA Keys / fields
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-5.2.2
    text: The values "Q" and "d" are the ECDSA public and private values respectively. Both are defined by Section 6.2 of [FIPS.186-5].
    scope: out-of-scope
    reason: keyringd does not accept ECDSA private keys through Agent key-addition messages.

  - source:
      title: RFC 9987 — 5.2.3 EdDSA Keys / add message
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-5.2.3
    text: |-
      [RFC8709] defines Edwards-curve Digital Signature Algorithm (EdDSA) keys (see [RFC8032]) Ed25519 and Ed448 with key type names "ssh-ed25519" and "ssh-ed448", respectively. These may be added to the agent using the following message. The "constraints" field is only present for the SSH_AGENTC_ADD_ID_CONSTRAINED message.

          byte             SSH_AGENTC_ADD_IDENTITY or
                           SSH_AGENTC_ADD_ID_CONSTRAINED
          string           "ssh-ed25519" or "ssh-ed448"
          string           ENC(A)
          string           k || ENC(A)
          string           comment
          constraint[]     constraints
    scope: out-of-scope
    reason: keyringd does not accept EdDSA or any other private key through Agent key-addition messages.

  - source:
      title: RFC 9987 — 5.2.3 EdDSA Keys / fields
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-5.2.3
    text: The first value is the EdDSA public key ENC(A). The second value is a concatenation of the private key k and the public ENC(A) key (this repetition of the public key is to maintain compatibility with widely deployed implementations). The contents and interpretation of the ENC(A) and k values are defined by Section 3.2 of [RFC8032].
    scope: out-of-scope
    reason: keyringd does not accept EdDSA private keys through Agent key-addition messages.

  - source:
      title: RFC 9987 — 5.2.4 RSA Keys / add message
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-5.2.4
    text: |-
      RSA keys have key type name "ssh-rsa" and are defined in [RFC4253]. They may be added to the agent using the following message. The "constraints" field is only present for the SSH_AGENTC_ADD_ID_CONSTRAINED message.

          byte             SSH_AGENTC_ADD_IDENTITY or
                           SSH_AGENTC_ADD_ID_CONSTRAINED
          string           "ssh-rsa"
          mpint            n
          mpint            e
          mpint            d
          mpint            iqmp
          mpint            p
          mpint            q
          string           comment
          constraint[]     constraints
    scope: out-of-scope
    reason: keyringd does not accept RSA or any other private key through Agent key-addition messages.

  - source:
      title: RFC 9987 — 5.2.4 RSA Keys / fields
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-5.2.4
    text: '"n" is the public composite modulus. "e" is the public exponent. "d" is the private exponent. "p" and "q" are its constituent private prime factors. "iqmp" is the inverse of "q" modulo "p". All of these values, except "iqmp" (which can be calculated from the others), are defined by Section 5.1 of [FIPS.186-5].'
    scope: out-of-scope
    reason: keyringd does not accept RSA private keys through Agent key-addition messages.

  - source:
      title: RFC 9987 — 5.2.5 Other Keys / additional key types
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-5.2.5
    text: Agents and their clients MAY support additional key types not documented here.
    scope: out-of-scope
    reason: keyringd does not support the Agent key-addition operation for standard or additional key types.

  - source:
      title: RFC 9987 — 5.2.5 Other Keys / vendor-specific key type names
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-5.2.5
    text: Vendor-specific key types MUST use the domain-qualified naming convention defined in Section 6 of [RFC4251] until codepoints are allocated by IANA [IANA-PUBKEYS].
    scope: out-of-scope
    reason: keyringd does not define vendor-specific key types for the Agent key-addition operation.

  - source:
      title: RFC 9987 — 5.2.6 Adding Keys from a Token / request format
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-5.2.6
    text: |-
      Keys hosted on smart-cards or other hardware tokens may be added using the SSH_AGENTC_ADD_SMARTCARD_KEY and SSH_AGENTC_ADD_SMARTCARD_KEY_CONSTRAINED requests. Note that the "constraints" field is only included for the SSH_AGENTC_ADD_SMARTCARD_KEY_CONSTRAINED variant of this message.

          byte             SSH_AGENTC_ADD_SMARTCARD_KEY or
                           SSH_AGENTC_ADD_SMARTCARD_KEY_CONSTRAINED
          string           token id
          string           PIN
          constraint[]     constraints
    scope: out-of-scope
    reason: keyringd does not load Token or smart-card keys through SSH Agent protocol requests.

  - source:
      title: RFC 9987 — 5.2.6 Adding Keys from a Token / token identifier and PIN
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-5.2.6
    text: Here "token id" is an opaque identifier for the hardware token and "PIN" is an optional password or PIN to unlock the key. The interpretation of "token id" is not defined by the protocol; it is left solely up to the agent.
    scope: out-of-scope
    reason: keyringd does not accept token identifiers or PINs through Agent key-addition requests.

  - source:
      title: RFC 9987 — 5.2.6 Adding Keys from a Token / load result
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-5.2.6
    text: An agent MUST reply with SSH_AGENT_SUCCESS if one or more keys were successfully loaded as a result of one of these messages or with SSH_AGENT_FAILURE if no keys were found.
    scope: out-of-scope
    reason: keyringd does not load keys from tokens through the SSH Agent protocol.

  - source:
      title: RFC 9987 — 5.2.6 Adding Keys from a Token / rejected token request
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-5.2.6
    text: The agent MUST also return SSH_AGENT_FAILURE if the "token id" was not recognised, if the request was against agent policy, or if the agent doesn't support token-hosted keys at all.
    scope: out-of-scope
    reason: keyringd rejects the unsupported token-key operation as a whole under the generic unsupported-request requirement rather than implementing its request-specific processing.

  - source:
      title: RFC 9987 — 5.2.7 Key Constraints / constrained request encoding
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-5.2.7
    text: |-
      Zero or more constraints may be specified when adding a key with one of the *_CONSTRAINED requests. Multiple constraints are appended consecutively to the end of the request:

          byte             constraint1_type
          byte[]           constraint1_data
          byte             constraint2_type
          byte[]           constraint2_data
          ....
          byte             constraintN_type
          byte[]           constraintN_data
    scope: out-of-scope
    reason: keyringd does not accept constrained key-addition requests.

  - source:
      title: RFC 9987 — 5.2.7 Key Constraints / unknown or unsupported constraint
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-5.2.7
    text: To fully parse a constraint, it is necessary to know its structure beforehand; it is not possible to safely recover when an unrecognised constraint is encountered. Given this, if an agent does not recognise or support a requested constraint, it MUST abort parsing, refuse the request, and return an SSH_AGENT_FAILURE message to the client.
    scope: out-of-scope
    reason: keyringd rejects constrained key-addition requests before parsing individual constraints.

  - source:
      title: RFC 9987 — 5.2.7.1 Key Lifetime Constraint / encoding
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-5.2.7.1
    text: |-
      This constraint requests that the agent limit the key's lifetime by deleting it after the specified duration (in seconds) has elapsed from the time the key was added to the agent.

          byte             SSH_AGENT_CONSTRAIN_LIFETIME
          uint32           seconds
    scope: out-of-scope
    reason: keyringd does not accept added keys or lifetime constraints through the SSH Agent protocol.

  - source:
      title: RFC 9987 — 5.2.7.2 Key Confirmation Constraint / encoding
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-5.2.7.2
    text: |-
      This constraint requests that the agent require explicit user confirmation for each private key operation using the key. For example, the agent could present a confirmation dialog before completing a signature operation.

          byte             SSH_AGENT_CONSTRAIN_CONFIRM
    scope: out-of-scope
    reason: keyringd does not accept added keys or confirmation constraints through the SSH Agent protocol; its own signing approval policy is outside this request format.

  - source:
      title: RFC 9987 — 5.2.7.3 Constraint Extensions / encoding
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-5.2.7.3
    text: |-
      Agents may implement experimental or private-use constraints through an extension constraint that supports named constraints.

          byte             SSH_AGENT_CONSTRAIN_EXTENSION
          string           extension name
          byte[]           extension-specific details
    scope: out-of-scope
    reason: keyringd does not accept key constraints or define private constraint extensions.

  - source:
      title: RFC 9987 — 5.2.7.3 Constraint Extensions / UTF-8 name
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-5.2.7.3
    text: The "extension name" MUST consist of a UTF-8 string.
    scope: out-of-scope
    reason: keyringd does not accept or parse constraint extension names because constrained key addition is unsupported.

  - source:
      title: RFC 9987 — 5.2.7.3 Constraint Extensions / vendor suffix
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-5.2.7.3
    text: Vendor extensions MUST be suffixed by the implementation domain following the naming scheme defined in Section 6 of [RFC4251], e.g., "foo@example.com".
    scope: out-of-scope
    reason: keyringd does not define vendor-specific key constraint extensions.

  - source:
      title: RFC 9987 — 5.3 Public Key Encoding / public key blob
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-5.3
    text: Keys previously loaded into an agent are referred to by their public key blob, which is the standard SSH wire encoding for public keys. SSH protocol key encodings are defined in [RFC4253] for "ssh-rsa" and "ssh-dss" keys, in [RFC5656] for "ecdsa-sha2-*" keys, and in [RFC8709] for "ssh-ed25519" and "ssh-ed448" keys.
    tests:
      - keyringd-core::keyringd_core::tests::spec::rfc9987::identity_listing::returns_a_completed_profile_s_identities_in_ssh_agent_wire_format_over_a_connection

  - source:
      title: RFC 9987 — 5.4 Removing Keys from the Agent / remove all request
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-5.4
    text: |-
      A client may request that an agent remove all keys that it stores:

          byte             SSH_AGENTC_REMOVE_ALL_IDENTITIES
    scope: out-of-scope
    reason: keyringd does not allow SSH Agent clients to remove credentials managed by the application.

  - source:
      title: RFC 9987 — 5.4 Removing Keys from the Agent / remove all result
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-5.4
    text: On receipt of such a message, an agent SHOULD delete all keys that it is holding and reply with SSH_AGENT_SUCCESS; otherwise, it MUST reply with SSH_AGENT_FAILURE if the request was refused.
    scope: out-of-scope
    reason: keyringd deliberately refuses Agent-protocol removal requests because credentials are managed outside this protocol.

  - source:
      title: RFC 9987 — 5.4 Removing Keys from the Agent / remove all regardless of policy
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-5.4
    text: This request SHOULD be honoured regardless of any agent policy that limits actions that a given client may take; otherwise, a user would be unable to quickly and completely remove their keys in an urgent situation.
    scope: out-of-scope
    reason: keyringd does not expose its application-managed credentials as a mutable Agent key store.

  - source:
      title: RFC 9987 — 5.4 Removing Keys from the Agent / remove identity request
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-5.4
    text: |-
      Specific keys may also be removed:

          byte             SSH_AGENTC_REMOVE_IDENTITY
          string           key blob
    scope: out-of-scope
    reason: keyringd does not allow SSH Agent clients to remove application-managed credentials.

  - source:
      title: RFC 9987 — 5.4 Removing Keys from the Agent / key blob
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-5.4
    text: Where "key blob" is the standard public key encoding of the key to be removed (Section 5.3).
    scope: out-of-scope
    reason: keyringd does not accept remove-identity requests containing a public key blob.

  - source:
      title: RFC 9987 — 5.4 Removing Keys from the Agent / remove identity result
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-5.4
    text: An agent MUST reply with SSH_AGENT_SUCCESS if the key was deleted or SSH_AGENT_FAILURE if it was not found.
    scope: out-of-scope
    reason: keyringd refuses the unsupported remove-identity operation as a whole rather than maintaining a mutable Agent key store.

  - source:
      title: RFC 9987 — 5.4 Removing Keys from the Agent / remove token keys request
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-5.4
    text: |-
      Token-hosted keys may be removed from an agent using:

          byte             SSH_AGENTC_REMOVE_SMARTCARD_KEY
          string           token id
          string           PIN
    scope: out-of-scope
    reason: keyringd does not load or remove Token-hosted keys through SSH Agent protocol requests.

  - source:
      title: RFC 9987 — 5.4 Removing Keys from the Agent / token identifier and PIN
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-5.4
    text: Where "token id" is an opaque identifier for the hardware token and "PIN" is an optional password or PIN (not typically used), both encoded using UTF-8.
    scope: out-of-scope
    reason: keyringd does not accept Token-key removal requests or their token identifier and PIN fields.

  - source:
      title: RFC 9987 — 5.4 Removing Keys from the Agent / matching token keys
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-5.4
    text: Requesting deletion of token-hosted keys SHOULD cause the agent to remove all keys it loaded from the device matching "token id".
    scope: out-of-scope
    reason: keyringd does not load Token-hosted keys through the SSH Agent protocol and therefore has no matching Agent-managed Token keys to remove.

  - source:
      title: RFC 9987 — 5.4 Removing Keys from the Agent / token removal regardless of policy
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-5.4
    text: Similarly to SSH_AGENTC_REMOVE_ALL_IDENTITIES, agents SHOULD honour this request regardless of local policy to allow fast and complete removal of keys.
    scope: out-of-scope
    reason: keyringd does not expose a mutable Agent key store or Token-key removal operation.

  - source:
      title: RFC 9987 — 5.4 Removing Keys from the Agent / preserve keys on token
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-5.4
    text: Removing a token-hosted key affects the agent only; it SHOULD NOT cause the keys be deleted from the token itself.
    scope: out-of-scope
    reason: keyringd does not implement Agent-protocol Token-key removal.

  - source:
      title: RFC 9987 — 5.4 Removing Keys from the Agent / token removal result
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-5.4
    text: An agent MUST reply with SSH_AGENT_SUCCESS if the keys were deleted or SSH_AGENT_FAILURE if none were found.
    scope: out-of-scope
    reason: keyringd refuses the unsupported Token-key removal operation as a whole.

  - source:
      title: RFC 9987 — 5.5 Requesting a List of Keys / request
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-5.5
    text: |-
      A client may request a list of keys from an agent using the following message:

          byte             SSH_AGENTC_REQUEST_IDENTITIES
    tests:
      - keyringd-ssh-agent-protocol::keyringd_ssh_agent_protocol::tests::spec::rfc9987::wire_messages::decodes_the_fixed_ssh_agentc_request_identities_message
      - keyringd-ssh-agent-protocol::keyringd_ssh_agent_protocol::tests::spec::rfc9987::wire_messages::rejects_contents_appended_to_ssh_agentc_request_identities
      - keyringd-ssh-agent-protocol::keyringd_ssh_agent_protocol::tests::spec::rfc9987::request::decode_ssh_agent_identity_list_request

  - source:
      title: RFC 9987 — 5.5 Requesting a List of Keys / response preamble
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-5.5
    text: |-
      The agent MUST reply with a message with the following preamble:

          byte             SSH_AGENT_IDENTITIES_ANSWER
          uint32           nkeys
    tests:
      - keyringd-ssh-agent-protocol::keyringd_ssh_agent_protocol::tests::spec::rfc9987::wire_messages::encodes_an_empty_ssh_agent_identities_answer_fixed_vector
      - keyringd-ssh-agent-protocol::keyringd_ssh_agent_protocol::tests::spec::rfc9987::response::encode_the_ssh_agent_identity_list_response
      - keyringd-core::keyringd_core::tests::spec::rfc9987::identity_listing::returns_a_completed_profile_s_identities_in_ssh_agent_wire_format_over_a_connection

  - source:
      title: RFC 9987 — 5.5 Requesting a List of Keys / identity entries
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-5.5
    text: |-
      Where "nkeys" indicates the number of keys to follow. Following the preamble are zero or more keys, representing the keys the agent makes available to the client with each encoded as:

          string           key blob
          string           comment
    tests:
      - keyringd-ssh-agent-protocol::keyringd_ssh_agent_protocol::tests::spec::rfc9987::wire_messages::encodes_identity_key_blobs_and_utf_8_comments_in_list_order
      - keyringd-core::keyringd_core::tests::spec::rfc9987::identity_listing::returns_a_completed_profile_s_identities_in_ssh_agent_wire_format_over_a_connection

  - source:
      title: RFC 9987 — 5.5 Requesting a List of Keys / identity entry fields
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-5.5
    text: Where "key blob" is the standard public key encoding of the key (Section 5.3) and "comment" is a human-readable comment encoded as a UTF-8 string.
    tests:
      - keyringd-ssh-agent-protocol::keyringd_ssh_agent_protocol::tests::spec::rfc9987::wire_messages::encodes_identity_key_blobs_and_utf_8_comments_in_list_order
      - keyringd-core::keyringd_core::tests::spec::rfc9987::identity_listing::returns_a_completed_profile_s_identities_in_ssh_agent_wire_format_over_a_connection

  - source:
      title: RFC 9987 — 5.6 Private Key Operations / sign request
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-5.6
    text: |-
      A client may request that the agent perform a private key signature operation using the following message:

          byte             SSH_AGENTC_SIGN_REQUEST
          string           key blob
          string           data
          uint32           flags
    tests:
      - keyringd-ssh-agent-protocol::keyringd_ssh_agent_protocol::tests::spec::rfc9987::wire_messages::decodes_an_ssh_agentc_sign_request_fixed_vector
      - keyringd-ssh-agent-protocol::keyringd_ssh_agent_protocol::tests::spec::rfc9987::wire_messages::rejects_every_truncation_of_an_ssh_agentc_sign_request
      - keyringd-ssh-agent-protocol::keyringd_ssh_agent_protocol::tests::spec::rfc9987::request::decode_the_ssh_agent_signature_request
      - keyringd-ssh-agent-protocol::keyringd_ssh_agent_protocol::tests::spec::rfc9987::request::rejects_extra_data_of_ssh_agent_signature_request

  - source:
      title: RFC 9987 — 5.6 Private Key Operations / sign request fields
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-5.6
    text: Where "key blob" is the key requested to perform the signature (encoded as per Section 5.3), "data" is the data to be signed, and "flags" is a bitfield containing the bitwise OR of zero or more signature flags (see below).
    tests:
      - keyringd-ssh-agent-protocol::keyringd_ssh_agent_protocol::tests::spec::rfc9987::wire_messages::decodes_an_ssh_agentc_sign_request_fixed_vector
      - keyringd-ssh-agent-protocol::keyringd_ssh_agent_protocol::tests::spec::rfc9987::request::decode_the_ssh_agent_signature_request

  - source:
      title: RFC 9987 — 5.6 Private Key Operations / signing failure
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-5.6
    text: If the agent does not support the requested flags, or is otherwise unable or unwilling to generate the signature (for example, because it doesn't have the specified key or the user refused confirmation of a constrained key), it MUST reply with an SSH_AGENT_FAILURE message.
    tests:
      - keyringd-core::keyringd_core::tests::spec::rfc9987::request_handler::rejects_every_nonzero_signature_flag_on_a_non_rsa_identity
      - keyringd-core::keyringd_core::tests::spec::rfc9987::request_handler::rejects_a_signing_request_for_an_unregistered_public_key

  - source:
      title: RFC 9987 — 5.6 Private Key Operations / signing success
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-5.6
    text: |-
      On success, the agent MUST reply with:

          byte             SSH_AGENT_SIGN_RESPONSE
          string           signature
    tests:
      - keyringd-ssh-agent-protocol::keyringd_ssh_agent_protocol::tests::spec::rfc9987::wire_messages::encodes_an_ssh_agent_sign_response_fixed_vector
      - keyringd-core::keyringd_core::tests::spec::rfc9987::request_handler::accepts_a_userauth_signing_request_that_identifies_the_matching_passkey

  - source:
      title: RFC 9987 — 5.6 Private Key Operations / signature format
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-5.6
    text: The signature format is specific to the algorithm of the key type in use. SSH protocol signature formats are defined in [RFC4253] for "ssh-rsa" and "ssh-dss" keys, in [RFC5656] for "ecdsa-sha2-*" keys, and in [RFC8709] for "ssh-ed25519" and "ssh-ed448" keys.
    tests:
      - keyringd-ssh-agent-protocol::keyringd_ssh_agent_protocol::tests::spec::rfc9987::wire_messages::encodes_an_ecdsa_signature_in_the_algorithm_specific_ssh_format

  - source:
      title: RFC 9987 — 5.6.1 Signature Flags / RSA flags
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-5.6.1
    text: 'Two flags are currently defined for signature request messages: SSH_AGENT_RSA_SHA2_256 and SSH_AGENT_RSA_SHA2_512 (defined in Section 8.3). These two flags are only valid for "ssh-rsa" keys and request that the agent return a signature using the "rsa-sha2-256" or "rsa-sha2-512" signature methods, respectively. These signature schemes are defined in [RFC8332].'
    tests:
      - keyringd-ssh-agent-protocol::keyringd_ssh_agent_protocol::tests::spec::rfc9987::wire_messages::decodes_an_ssh_agentc_sign_request_fixed_vector
      - keyringd-core::keyringd_core::tests::spec::rfc9987::request_handler::rejects_every_nonzero_signature_flag_on_a_non_rsa_identity

  - source:
      title: RFC 9987 — 5.7 Locking and Unlocking an Agent / suspended operations
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-5.7
    text: When locked, an agent MUST suspend processing of sensitive operations (private key signature operations at the very least) until it has been unlocked with the same passphrase.
    scope: out-of-scope
    reason: keyringd does not implement the optional Agent lock state or accept lock and unlock requests.

  - source:
      title: RFC 9987 — 5.7 Locking and Unlocking an Agent / lock request
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-5.7
    text: |-
      The following message instructs an agent to lock itself:

          byte             SSH_AGENTC_LOCK
          string           passphrase
    scope: out-of-scope
    reason: keyringd does not implement Agent locking through the SSH Agent protocol.

  - source:
      title: RFC 9987 — 5.7 Locking and Unlocking an Agent / lock result
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-5.7
    text: The agent MUST reply with SSH_AGENT_SUCCESS if locked successfully or SSH_AGENT_FAILURE otherwise (e.g., if the agent was already locked).
    scope: out-of-scope
    reason: keyringd does not implement the optional Agent lock state and rejects the operation as unsupported.

  - source:
      title: RFC 9987 — 5.7 Locking and Unlocking an Agent / unlock request
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-5.7
    text: |-
      The following message requests unlocking an agent:

          byte             SSH_AGENTC_UNLOCK
          string           passphrase
    scope: out-of-scope
    reason: keyringd does not implement Agent locking or unlocking through the SSH Agent protocol.

  - source:
      title: RFC 9987 — 5.7 Locking and Unlocking an Agent / successful unlock
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-5.7
    text: If the agent is already locked and the passphrase matches the one used to lock it, then it MUST unlock and reply with SSH_AGENT_SUCCESS.
    scope: out-of-scope
    reason: keyringd has no Agent lock state or Agent-protocol passphrase.

  - source:
      title: RFC 9987 — 5.7 Locking and Unlocking an Agent / failed unlock
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-5.7
    text: If the agent is already unlocked or if the passphrase does not match, it MUST reply with SSH_AGENT_FAILURE.
    scope: out-of-scope
    reason: keyringd rejects unlock requests as an unsupported operation rather than implementing Agent lock-state transitions.

  - source:
      title: RFC 9987 — 5.8 Extension Mechanism / request encoding
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-5.8
    text: |-
      The agent protocol includes an optional extension mechanism that allows vendor-specific and experimental messages to be sent via the agent protocol. Extension requests from the client consist of:

          byte             SSH_AGENTC_EXTENSION
          string           extension type
          byte[]           extension request-specific contents
    tests:
      - keyringd-ssh-agent-protocol::keyringd_ssh_agent_protocol::tests::spec::rfc9987::wire_messages::decodes_an_ssh_agentc_extension_request_with_opaque_binary_contents
      - keyringd-ssh-agent-protocol::keyringd_ssh_agent_protocol::tests::spec::rfc9987::wire_messages::decodes_an_ssh_agentc_extension_request_with_empty_contents
      - keyringd-ssh-agent-protocol::keyringd_ssh_agent_protocol::tests::spec::rfc9987::connection_framing::reassembles_request_contents_split_across_multiple_body_reads

  - source:
      title: RFC 9987 — 5.8 Extension Mechanism / extension type
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-5.8
    text: The "extension type" indicates the type of the extension message as a UTF-8 string.
    tests:
      - keyringd-ssh-agent-protocol::keyringd_ssh_agent_protocol::tests::spec::rfc9987::wire_messages::decodes_an_ssh_agentc_extension_request_with_opaque_binary_contents
      - keyringd-ssh-agent-protocol::keyringd_ssh_agent_protocol::tests::spec::rfc9987::request::rejects_ssh_agent_extension_name_that_is_not_utf_8

  - source:
      title: RFC 9987 — 5.8 Extension Mechanism / implementation-specific extension name
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-5.8
    text: Implementation-specific extensions MUST be suffixed by the implementation domain following the extension naming scheme defined in Section 6 of [RFC4251], e.g., "foo@example.com".
    scope: out-of-scope
    reason: keyringd does not define implementation-specific SSH Agent protocol extensions.

  - source:
      title: RFC 9987 — 5.8 Extension Mechanism / unsupported extension
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-5.8
    text: An agent that does not support extensions of the supplied type MUST reply with an empty SSH_AGENT_FAILURE message. This reply is also sent by agents that do not support the extension mechanism at all.
    tests:
      - keyringd-ssh-agent-protocol::keyringd_ssh_agent_protocol::tests::spec::rfc9987::connection_framing::reassembles_request_contents_split_across_multiple_body_reads
      - keyringd-core::keyringd_core::tests::spec::rfc9987::request_handler::rejects_an_unsupported_session_bind_extension_request

  - source:
      title: RFC 9987 — 5.8 Extension Mechanism / successful extension response
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-5.8
    text: |-
      The contents of successful extension reply messages are specific to the "extension type". Successful extension requests MUST return either SSH_AGENT_SUCCESS on success or an extension-specific response message:

          byte             SSH_AGENT_EXTENSION_RESPONSE
          string           extension type
          byte[]           extension response-specific contents
    scope: out-of-scope
    reason: keyringd does not implement an SSH Agent protocol extension that can return a successful extension response.

  - source:
      title: RFC 9987 — 5.8 Extension Mechanism / response extension type
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-5.8
    text: Where the "extension type" is the same as that in the request.
    scope: out-of-scope
    reason: keyringd does not produce successful extension-specific responses.

  - source:
      title: RFC 9987 — 5.8 Extension Mechanism / extension failure response
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-5.8
    text: |-
      Extension failure SHOULD be signaled using an SSH_AGENT_EXTENSION_FAILURE message:

          byte             SSH_AGENT_EXTENSION_FAILURE
    scope: out-of-scope
    reason: keyringd has no supported extension whose internal processing can fail; unsupported extensions use SSH_AGENT_FAILURE as required separately.

  - source:
      title: RFC 9987 — 5.8 Extension Mechanism / generic failure distinction
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-5.8
    text: Extensions SHOULD NOT use the standard SSH_AGENT_FAILURE message. This allows failed requests to be distinguished from the extension not being supported.
    scope: out-of-scope
    reason: keyringd has no supported extension whose internal failure must be distinguished from an unsupported extension.

  - source:
      title: RFC 9987 — 5.8.1 Query Extension / request
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-5.8.1
    text: |-
      A single optional extension request "query" is defined to allow a client to query which, if any, extensions are supported by an agent.

          byte             SSH_AGENTC_EXTENSION
          string           "query"
    scope: out-of-scope
    reason: keyringd implements no successful SSH Agent extensions and does not implement the optional query extension.

  - source:
      title: RFC 9987 — 5.8.1 Query Extension / response
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-5.8.1
    text: |-
      If an agent supports the query extension, it SHOULD reply with a list of supported extension names.

          byte             SSH_AGENT_EXTENSION_RESPONSE
          string           "query"
          string[]         supported extension types
    scope: out-of-scope
    reason: keyringd does not implement the optional query extension or advertise supported extensions.

  - source:
      title: RFC 9987 — 6 Connecting to an Agent / connection-oriented endpoint
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-6
    text: Agents are exposed to the local system using a connection-oriented endpoint. On Unix-like systems, it is typical to arrange for the agent to listen on a filesystem-based Unix domain socket. On Microsoft Windows, it is usual to use a Windows Named Pipe.
    tests:
      - keyringd-ssh-agent-protocol::keyringd_ssh_agent_protocol::tests::spec::rfc9987::server::accept_stream_and_handle_ssh_agent_connections

  - source:
      title: RFC 9987 — 6 Connecting to an Agent / endpoint access control
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-6
    text: Access to these endpoints SHOULD be controlled as discussed in Section 10.
    tests:
      - keyringd-linux::keyringd_linux::tests::spec::rfc9987::endpoint::creates_an_owner_only_unix_agent_endpoint
      - keyringd-linux::keyringd_linux::tests::spec::rfc9987::endpoint::declares_an_owner_only_systemd_agent_socket
      - keyringd-macos::keyringd_macos::tests::spec::rfc9987::endpoint::creates_an_owner_only_macos_agent_endpoint
      - keyringd-macos::keyringd_macos::tests::spec::rfc9987::endpoint::declares_an_owner_only_launchd_agent_socket
      - keyringd-wsl::keyringd_wsl_proxy::tests::spec::rfc9987::endpoint::creates_an_owner_only_wsl_agent_endpoint
      - keyringd-wsl::keyringd_wsl_proxy::tests::spec::rfc9987::endpoint::publishes_a_private_discoverable_wsl_agent_endpoint_through_systemd
      - keyringd-windows::keyringd_windows::tests::spec::rfc9987::windows_endpoint_access::restricts_the_windows_agent_pipe_to_authorized_local_principals

  - source:
      title: RFC 9987 — 6 Connecting to an Agent / multiple clients
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-6
    text: Multiple clients may access a single agent by making connections to these sockets.
    tests:
      - keyringd-ssh-agent-protocol::keyringd_ssh_agent_protocol::tests::spec::rfc9987::multiple_connections::processes_requests_from_multiple_clients_concurrently

  - source:
      title: RFC 9987 — 6 Connecting to an Agent / endpoint discovery
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-6
    text: In both cases, it is common to expose the name or address of the listening endpoint via an environment variable named "SSH_AUTH_SOCK". Clients of an agent will use this variable to locate and connect to the listening agent. Alternatively, agents MAY use an implicit mechanism for clients to locate their endpoint, such as a default per-user location.
    tests:
      - keyringd-linux::keyringd_linux::system::open_ssh::configuration::tests::publishes_a_discoverable_per_user_agent_endpoint_to_openssh
      - keyringd-macos::keyringd_macos::tests::spec::rfc9987::endpoint::publishes_the_macos_agent_endpoint_through_launchd
      - keyringd-wsl::keyringd_wsl_proxy::tests::spec::rfc9987::endpoint::publishes_a_private_discoverable_wsl_agent_endpoint_through_systemd
      - keyringd-windows::keyringd_windows::tests::spec::rfc9987::endpoint_discovery::discovers_the_windows_agent_through_ssh_auth_sock

  - source:
      title: RFC 9987 — 7 Forwarding Access to an Agent / optional feature
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-7
    text: Using the connection protocol described in [RFC4254], the agent protocol may be forwarded over an SSH connection. This allows agent forwarding to be requested for any session channel using a model that is similar to the connection protocol's support for X11 Forwarding (Section 6.3 of [RFC4254]). This feature is OPTIONAL for the SSH protocol and agent implementations.
    scope: other-component
    reason: The SSH client and server provide the forwarding transport; keyringd exposes the local Agent endpoint and can be used transparently through that transport.

  - source:
      title: RFC 9987 — 7.1 Advertising Agent Forwarding Support / advertisement
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-7.1
    text: |-
      Support for agent forwarding may be advertised by an SSH server using the extension mechanism described in [RFC8308] using the name "agent-forward" in the SSH_MSG_EXT_INFO message.

          string           "agent-forward"
          string           "0" (version)
    scope: other-component
    reason: Agent-forwarding advertisement is performed by an SSH server; keyringd does not implement an SSH server.

  - source:
      title: RFC 9987 — 7.1 Advertising Agent Forwarding Support / opportunistic request
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-7.1
    text: SSH clients MAY opportunistically attempt to request agent forwarding in the absence of an advertisement (see [RFC8308]) using the vendor-specific names mentioned below.
    scope: other-component
    reason: This optional behavior belongs to an SSH client; keyringd implements the Agent responder.

  - source:
      title: RFC 9987 — 7.1 Advertising Agent Forwarding Support / vendor-specific names
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-7.1
    text: Likewise, SSH servers MAY implement the vendor-specific names in addition to the one described here.
    scope: other-component
    reason: Supporting vendor-specific Agent-forwarding names is an SSH server responsibility outside keyringd.

  - source:
      title: RFC 9987 — 7.2 Requesting Agent Forwarding / channel request
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-7.2
    text: |-
      An SSH client may request agent forwarding for a previously opened session (see Section 6.1 of [RFC4254]) using the following channel request. This request is sent after the channel has been opened, but before a shell, command, or subsystem has been executed.

          byte             SSH_MSG_CHANNEL_REQUEST
          uint32           channel_id
          string           "agent-req" or "auth-agent-req@openssh.com"
          boolean          want_reply
    scope: other-component
    reason: Constructing the forwarding channel request is an SSH client responsibility outside keyringd.

  - source:
      title: RFC 9987 — 7.2 Requesting Agent Forwarding / request fields
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-7.2
    text: Where "channel_id" is the identifier for an established session channel (as returned from a previous SSH_MSG_CHANNEL_OPEN request) and the "want_reply" flag indicates whether the SSH server should respond with a confirmation of whether the request was successful (as specified in Section 5.4 of [RFC4254]).
    scope: other-component
    reason: These fields belong to the SSH connection protocol implemented by the SSH client and server, not the Agent endpoint.

  - source:
      title: RFC 9987 — 7.2 Requesting Agent Forwarding / server endpoint
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-7.2
    text: If an SSH server accepts this request, typically it will arrange to make an endpoint (e.g., a listening socket) available and advertise this fact to the subordinate session. Most implementations on Unix-like systems do this by providing a user-private listening Unix domain socket and recording its location in an environment variable "SSH_AUTH_SOCK".
    scope: other-component
    reason: Creating the remote forwarded-Agent endpoint is an SSH server responsibility.

  - source:
      title: RFC 9987 — 7.2 Requesting Agent Forwarding / standard request name
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-7.2
    text: The "agent-req" name SHOULD only be used if support was explicitly advertised as per Section 7.1.
    scope: other-component
    reason: Selecting the forwarding request name is an SSH client responsibility.

  - source:
      title: RFC 9987 — 7.3 Agent Connection Requests / channel open
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-7.3
    text: |-
      After an SSH client has requested that a session have agent forwarding enabled, the SSH server may request a connection to the forwarded agent. The SSH server does this by requesting a dedicated channel to communicate with the SSH client's agent.

          byte             SSH_MSG_CHANNEL_OPEN
          string           "agent-connect" or "auth-agent@openssh.com"
          uint32           channel_id
          uint32           local_window
          uint32           local_maxpacket
    scope: other-component
    reason: Opening the forwarded-Agent SSH channel is an SSH server responsibility outside keyringd.

  - source:
      title: RFC 9987 — 7.3 Agent Connection Requests / channel fields
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-7.3
    text: The "channel_id", "local_window", and "local_maxpacket" fields should be interpreted as specified by Section 5.1 of [RFC4254].
    scope: other-component
    reason: These are SSH connection-protocol fields interpreted by SSH client and server implementations.

  - source:
      title: RFC 9987 — 7.3 Agent Connection Requests / standard channel type
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-7.3
    text: As above, the "agent-connect" open type name SHOULD only be used if support was explicitly advertised as per Section 7.1.
    scope: other-component
    reason: Selecting the SSH channel type is an SSH server responsibility.

  - source:
      title: RFC 9987 — 7.3 Agent Connection Requests / concurrent forwarded connections
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-7.3
    text: An SSH client SHOULD be prepared to handle multiple concurrent forwarded connections to a client-side agent; otherwise, requests to access the agent from the remote side that happen to overlap prior requests may fail.
    scope: other-component
    reason: Managing forwarded SSH channels is an SSH client responsibility; keyringd separately handles multiple direct Agent endpoint connections under Section 6.

  - source:
      title: RFC 9987 — 7.3 Agent Connection Requests / connection without prior forwarding request
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-7.3
    text: An SSH client MAY accept agent connection requests (subject to authorisation) without a prior agent forwarding request having been made to support the situation where agent forwarding without opening a session is desired.
    scope: other-component
    reason: Authorizing forwarded connection requests is an SSH client responsibility.

  - source:
      title: RFC 9987 — 7.3 Agent Connection Requests / connection after session closure
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-7.3
    text: Similarly, an SSH client MAY continue to accept agent connection requests after the session for which agent forwarding was requested has closed.
    scope: other-component
    reason: Forwarded channel lifetime policy belongs to the SSH client.

  - source:
      title: RFC 9987 — 7.3 Agent Connection Requests / unauthorized connection
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-7.3
    text: An SSH client MUST refuse unauthorised agent connection requests, when agent forwarding is neither requested nor desired by the SSH client but an SSH server sends an agent connection request anyway.
    scope: other-component
    reason: Authorization of SSH forwarding channel requests belongs to the SSH client, which keyringd does not implement.

  - source:
      title: RFC 9987 — 7.3 Agent Connection Requests / single forwarded Agent
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-7.3
    text: Because the "agent-connect" request contains no identifier to distinguish which session channel originated the connection request, an SSH connection can effectively forward access to only a single SSH client-side agent using this protocol (although there may be multiple concurrent connections to that single agent).
    scope: other-component
    reason: This limitation applies to the SSH client and server forwarding layer rather than the Agent responder.

  - source:
      title: RFC 9987 — 8.1 Message Type Numbers / client requests
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-8.1
    text: |-
      The following numbers are used as message types for requests from the client to the agent.

      SSH_AGENTC_REQUEST_IDENTITIES                 11
      SSH_AGENTC_SIGN_REQUEST                       13
      SSH_AGENTC_ADD_IDENTITY                       17
      SSH_AGENTC_REMOVE_IDENTITY                    18
      SSH_AGENTC_REMOVE_ALL_IDENTITIES              19
      SSH_AGENTC_ADD_SMARTCARD_KEY                  20
      SSH_AGENTC_REMOVE_SMARTCARD_KEY               21
      SSH_AGENTC_LOCK                               22
      SSH_AGENTC_UNLOCK                             23
      SSH_AGENTC_ADD_ID_CONSTRAINED                 25
      SSH_AGENTC_ADD_SMARTCARD_KEY_CONSTRAINED      26
      SSH_AGENTC_EXTENSION                          27
    tests:
      - keyringd-ssh-agent-protocol::keyringd_ssh_agent_protocol::tests::spec::rfc9987::wire_messages::decodes_the_fixed_ssh_agentc_request_identities_message
      - keyringd-ssh-agent-protocol::keyringd_ssh_agent_protocol::tests::spec::rfc9987::wire_messages::decodes_an_ssh_agentc_sign_request_fixed_vector
      - keyringd-ssh-agent-protocol::keyringd_ssh_agent_protocol::tests::spec::rfc9987::wire_messages::decodes_an_ssh_agentc_extension_request_with_opaque_binary_contents
      - keyringd-ssh-agent-protocol::keyringd_ssh_agent_protocol::tests::spec::rfc9987::wire_messages::preserves_every_registered_but_unsupported_client_request_number
      - keyringd-core::keyringd_core::tests::spec::rfc9987::request_handler::rejects_every_unsupported_or_unassigned_ssh_agent_request_type

  - source:
      title: RFC 9987 — 8.1 Message Type Numbers / Agent replies
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-8.1
    text: |-
      The following numbers are used as message types for replies from the agent to the client.

      SSH_AGENT_FAILURE               5
      SSH_AGENT_SUCCESS               6
      SSH_AGENT_IDENTITIES_ANSWER      12
      SSH_AGENT_SIGN_RESPONSE          14
      SSH_AGENT_EXTENSION_FAILURE      28
      SSH_AGENT_EXTENSION_RESPONSE     29
    tests:
      - keyringd-ssh-agent-protocol::keyringd_ssh_agent_protocol::tests::spec::rfc9987::wire_messages::encodes_every_supported_agent_reply_with_its_registered_message_number

  - source:
      title: RFC 9987 — 8.1.1 Reserved Message Type Numbers / legacy SSH protocol
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-8.1.1
    text: 'The following message type numbers are reserved for implementations that implement support for the legacy SSH protocol version 1: 1-4, 7-10, 15-16, and 24 (inclusive). These message numbers MAY be used by an implementation supporting the legacy protocol but MUST NOT be reused otherwise.'
    tests:
      - keyringd-ssh-agent-protocol::keyringd_ssh_agent_protocol::tests::spec::rfc9987::wire_messages::does_not_reuse_legacy_ssh_protocol_message_numbers

  - source:
      title: RFC 9987 — 8.1.1 Reserved Message Type Numbers / zero
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-8.1.1
    text: Message number 0 is also reserved and MUST NOT be used.
    tests:
      - keyringd-ssh-agent-protocol::keyringd_ssh_agent_protocol::tests::spec::rfc9987::wire_messages::does_not_use_reserved_message_number_zero

  - source:
      title: RFC 9987 — 8.1.1 Reserved Message Type Numbers / Private Use
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-8.1.1
    text: The range of message numbers 240-255 is reserved for Private Use extensions to the agent protocol and MUST NOT be used by generic implementations (see [RFC8126] for more information on Private Use).
    tests:
      - keyringd-ssh-agent-protocol::keyringd_ssh_agent_protocol::tests::spec::rfc9987::wire_messages::does_not_use_private_use_message_numbers_in_the_generic_implementation

  - source:
      title: RFC 9987 — 8.2 Constraint Identifiers / assignments
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-8.2
    text: |-
      The following numbers are used to identify key constraints. These are only used in key constraints and are not sent as message numbers.

      SSH_AGENT_CONSTRAIN_LIFETIME      1
      SSH_AGENT_CONSTRAIN_CONFIRM       2
      SSH_AGENT_CONSTRAIN_EXTENSION     255
    scope: out-of-scope
    reason: keyringd does not accept constrained key-addition requests or parse individual constraint identifiers.

  - source:
      title: RFC 9987 — 8.2 Constraint Identifiers / reserved zero
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-8.2
    text: The constraint identifier 0 is reserved.
    scope: out-of-scope
    reason: keyringd does not accept or emit key constraint identifiers.

  - source:
      title: RFC 9987 — 8.3 Signature Flags / assignments
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-8.3
    text: |-
      The following numbers may be present in signature request (SSH_AGENTC_SIGN_REQUEST) messages. These flags form a bit field by taking the logical OR of zero or more flags.

      SSH_AGENT_RSA_SHA2_256      0x00000002
      SSH_AGENT_RSA_SHA2_512      0x00000004
    tests:
      - keyringd-ssh-agent-protocol::keyringd_ssh_agent_protocol::tests::spec::rfc9987::wire_messages::decodes_an_ssh_agentc_sign_request_fixed_vector
      - keyringd-core::keyringd_core::tests::spec::rfc9987::request_handler::rejects_every_nonzero_signature_flag_on_a_non_rsa_identity

  - source:
      title: RFC 9987 — 8.3 Signature Flags / reserved value
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-8.3
    text: The flag value 1 is reserved for historical implementations.
    tests:
      - keyringd-core::keyringd_core::tests::spec::rfc9987::request_handler::rejects_every_nonzero_signature_flag_on_a_non_rsa_identity

  - source:
      title: RFC 9987 — 9.1 Guidance for Designated Experts / review criteria
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-9.1
    text: When a Designated Expert (DE) is asked to review additions to the new registries described in this document (Section 9.2, Section 9.3, Section 9.5, and Section 9.6), they are requested to verify that suitable documentation as described in [RFC8126] exists and is permanently and publicly available. The DE is also requested to check the clarity of purpose and use of the requested codepoints. The DE should also verify that specifications produced in the IETF that request codepoints in these registries have been made available to the SSHM Working Group and the ssh@ietf.org mailing list for review. Requests for codepoints made for specifications produced outside the IETF should not conflict with active IETF work or prior IETF specifications.
    scope: other-component
    reason: These review duties belong to IANA Designated Experts and do not govern keyringd runtime behavior.

  - source:
      title: RFC 9987 — 9.1 Guidance for Designated Experts / scarce codepoints
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-9.1
    text: The available number of codepoints in the SSH agent protocol numbers (Section 9.2), constraint numbers (Section 9.3), and SSH agent signature flags (Section 9.5) registries are limited, so the DE is requested to ensure the use of codepoints is very well justified. For the SSH agent protocol message numbers, named extension requests (Section 9.6) provide an alternative for most uses with no practical limitation on the number of available codepoints. For key constraint numbers, the constraint extension mechanism (Section 5.2.7.3) provides a similar alternative that is not limited by available codepoints.
    scope: other-component
    reason: Codepoint allocation review belongs to IANA Designated Experts; keyringd consumes assigned values but does not administer the registries.

  - source:
      title: RFC 9987 — 9.2 SSH Agent Protocol Message Type Numbers Registry / allocation
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-9.2
    text: The "SSH Agent Protocol Message Type Numbers" registry records the message type numbers for client requests and agent responses. It is located in the "Secure Shell (SSH) Protocol Parameters" registry group [IANA-SSH]. Its initial state consists of the following numbers and reservations. Future message number allocations shall occur via Expert Review as per [RFC8126].
    scope: other-component
    reason: Maintaining the message-number registry and allocating future codepoints are IANA responsibilities.

  - source:
      title: RFC 9987 — 9.3 SSH Agent Key Constraint Numbers Registry / allocation
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-9.3
    text: The "SSH Agent Key Constraint Numbers" registry records the message numbers for key use constraints. It is located in the "Secure Shell (SSH) Protocol Parameters" registry group [IANA-SSH]. Its initial state is as follows. Future key constraint number allocations shall occur via Expert Review as per [RFC8126].
    scope: other-component
    reason: Maintaining the key-constraint registry and allocating future codepoints are IANA responsibilities.

  - source:
      title: RFC 9987 — 9.4 SSH Agent Key Constraint Extension Names Registry / allocation
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-9.4
    text: The "SSH Agent Key Constraint Extension Names" registry records the names used in the SSH_AGENT_CONSTRAIN_EXTENSION constraint extension type (Section 5.2.7.3). It is located in the "Secure Shell (SSH) Protocol Parameters" registry group [IANA-SSH]. Its initial state is empty. Future key constraint extension name allocations shall occur via Expert Review as per [RFC8126].
    scope: other-component
    reason: Maintaining and allocating names in this registry are IANA responsibilities.

  - source:
      title: RFC 9987 — 9.5 SSH Agent Signature Flags Registry / allocation
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-9.5
    text: The "SSH Agent Signature Flags" registry records the values for signature request (SSH_AGENTC_SIGN_REQUEST) flag values. It is located in the "Secure Shell (SSH) Protocol Parameters" registry group [IANA-SSH]. Its initial state consists of the following numbers. Note that as the flags are combined by bitwise OR, all flag values must be powers of two and the maximum available flag value is 0x80000000. Future signature flag allocations shall occur via Expert Review as per [RFC8126].
    scope: other-component
    reason: Maintaining the signature-flag registry and allocating future values are IANA responsibilities; keyringd consumes the values defined in Section 8.3.

  - source:
      title: RFC 9987 — 9.6 SSH Agent Extension Request Names Registry / allocation
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-9.6
    text: |-
      The "SSH Agent Extension Request Names" registry records the names used in the generic extension request message (SSH_AGENTC_EXTENSION). It is located in the "Secure Shell (SSH) Protocol Parameters" registry group [IANA-SSH]. Its initial state consists of the following names.

      query     RFC 9987, Section 5.8.1

      Future name allocations shall occur via Expert Review as per [RFC8126].
    scope: other-component
    reason: Maintaining the extension-request-name registry and allocating future names are IANA responsibilities.

  - source:
      title: RFC 9987 — 9.7 Additions to the Extension Names Registry / agent-forward
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-9.7
    text: |-
      IANA has added the following entries to the "Extension Names" registry [IANA-SSH-EXT] in the "Secure Shell (SSH) Protocol Parameters" registry group [IANA-SSH].

      agent-forward     RFC 9987, Section 7.1
    scope: other-component
    reason: Updating the SSH extension-name registry is an IANA responsibility; the external SSH client and server use this name when providing Agent forwarding for keyringd.

  - source:
      title: RFC 9987 — 9.8 Additions to the Channel Request Names Registry / agent-req
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-9.8
    text: |-
      IANA has added the following entries to the "Connection Protocol Channel Request Names" registry [IANA-SSH-CHANREQ] in the "Secure Shell (SSH) Protocol Parameters" registry group [IANA-SSH].

      agent-req     RFC 9987, Section 7.2
    scope: other-component
    reason: Updating the SSH channel-request-name registry is an IANA responsibility; the external SSH client and server use this name when providing Agent forwarding for keyringd.

  - source:
      title: RFC 9987 — 9.9 Additions to the Channel Types Registry / agent-connect
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-9.9
    text: |-
      IANA has added the following entries to the "Connection Protocol Channel Types" registry [IANA-SSH-CHANTYPE] under the "Secure Shell (SSH) Protocol Parameters" registry group [IANA-SSH].

      agent-connect     RFC 9987, Section 7.3
    scope: other-component
    reason: Updating the SSH channel-type registry is an IANA responsibility; the external SSH client and server use this type when providing Agent forwarding for keyringd.

  - source:
      title: RFC 9987 — 10 Security Considerations / authorized endpoint exposure
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-10
    text: Since being able to access an agent is usually sufficient to perform private key operations, it is critically important that the agent only be exposed to its owner and their authorised delegates.
    tests:
      - keyringd-linux::keyringd_linux::tests::spec::rfc9987::endpoint::creates_an_owner_only_unix_agent_endpoint
      - keyringd-linux::keyringd_linux::tests::spec::rfc9987::endpoint::declares_an_owner_only_systemd_agent_socket
      - keyringd-macos::keyringd_macos::tests::spec::rfc9987::endpoint::creates_an_owner_only_macos_agent_endpoint
      - keyringd-macos::keyringd_macos::tests::spec::rfc9987::endpoint::declares_an_owner_only_launchd_agent_socket
      - keyringd-wsl::keyringd_wsl_proxy::tests::spec::rfc9987::endpoint::creates_an_owner_only_wsl_agent_endpoint
      - keyringd-wsl::keyringd_wsl_proxy::tests::spec::rfc9987::endpoint::publishes_a_private_discoverable_wsl_agent_endpoint_through_systemd
      - keyringd-windows::keyringd_windows::tests::spec::rfc9987::windows_endpoint_access::restricts_the_windows_agent_pipe_to_authorized_local_principals

  - source:
      title: RFC 9987 — 10 Security Considerations / Unix endpoint access control
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-10
    text: On Unix-like systems, this may be achieved via filesystem permissions on the agent socket and/or identity checks on the client connected to a socket (e.g., SO_PEERCRED on some Unix-like systems).
    tests:
      - keyringd-linux::keyringd_linux::tests::spec::rfc9987::endpoint::creates_an_owner_only_unix_agent_endpoint
      - keyringd-linux::keyringd_linux::tests::spec::rfc9987::endpoint::declares_an_owner_only_systemd_agent_socket
      - keyringd-macos::keyringd_macos::tests::spec::rfc9987::endpoint::creates_an_owner_only_macos_agent_endpoint
      - keyringd-macos::keyringd_macos::tests::spec::rfc9987::endpoint::declares_an_owner_only_launchd_agent_socket
      - keyringd-wsl::keyringd_wsl_proxy::tests::spec::rfc9987::endpoint::creates_an_owner_only_wsl_agent_endpoint
      - keyringd-wsl::keyringd_wsl_proxy::tests::spec::rfc9987::endpoint::publishes_a_private_discoverable_wsl_agent_endpoint_through_systemd

  - source:
      title: RFC 9987 — 10 Security Considerations / Windows endpoint access control
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-10
    text: On Windows, access to a named pipe may be controlled by attaching a security descriptor at the time of its creation.
    tests:
      - keyringd-windows::keyringd_windows::tests::spec::rfc9987::windows_endpoint_access::restricts_the_windows_agent_pipe_to_authorized_local_principals

  - source:
      title: RFC 9987 — 10 Security Considerations / prevent private-key extraction
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-10
    text: The primary design intention of an agent is that an attacker with unprivileged access to their victim's agent should be prevented from gaining a copy of any keys that have been loaded into it. This may not preclude the attacker from stealing use of those keys (e.g., if they have been loaded without a confirmation constraint).
    scope: out-of-scope
    reason: keyringd does not load or retain private keys in the Agent process; signing keys remain non-extractable in authenticators, TPMs, or Secure Enclaves.

  - source:
      title: RFC 9987 — 10 Security Considerations / process memory protection
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-10
    text: Given this, the agent should, as far as possible, prevent its memory from being read by other processes to prevent theft of loaded keys. Typically, this includes disabling debugging interfaces and preventing process memory dumps on abnormal termination.
    scope: out-of-scope
    reason: keyringd does not load private keys into the Agent process; private signing keys remain in authenticators or platform secure hardware.

  - source:
      title: RFC 9987 — 10 Security Considerations / side-channel resistance
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-10
    text: While a full treatment of side-channel attacks is beyond the scope of this specification, agents SHOULD use cryptographic implementations that are resistant to side-channel attacks and MAY take additional measures to hide the actual time spent processing private key operations. Failure to do so may expose keys to recovery through these side-channels.
    scope: other-component
    reason: keyringd delegates private-key operations to authenticators, TPMs, or Secure Enclaves; side-channel resistance of those operations belongs to those external cryptographic implementations.

  - source:
      title: RFC 9987 — 10 Security Considerations / forwarding defaults and untrusted hosts
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-10
    text: SSH implementations SHOULD NOT forward use of an agent by default, and users SHOULD NOT forward use of an agent to hosts that are not fully trusted, as doing so could expose access to the user's keys to attackers on remote hosts.
    scope: other-component
    reason: Agent-forwarding defaults belong to the external SSH client, and the decision to forward keyringd to a trusted host belongs to the user.

  - source:
      title: RFC 9987 — 10 Security Considerations / forwarded key controls
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-10
    text: Agents SHOULD implement additional controls over key visibility and use for forwarded agent connections; otherwise, the user has only an all-or-nothing choice about whether to forward an agent.
    scope: deferred
    reason: keyringd can be used through Agent forwarding, but the current local Agent endpoint cannot distinguish forwarded connections or their destinations; forwarding-specific visibility and use controls require provenance or destination information from the SSH forwarding layer.

  - source:
      title: RFC 9987 — 10 Security Considerations / trusted token provider libraries
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-10
    text: To avoid the loading of potentially hostile code, agents that support loading token-hosted keys via a library path SHOULD ensure that only trusted token provider libraries are loadable.
    scope: out-of-scope
    reason: keyringd does not load Token-hosted keys or provider libraries from paths supplied through the SSH Agent protocol.

  - source:
      title: RFC 9987 — 10 Security Considerations / token library isolation
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-10
    text: Additionally, agents SHOULD ensure that loaded token library code cannot gain access to other keys loaded in the agent and MAY disallow remote clients from loading token keys entirely.
    scope: out-of-scope
    reason: keyringd does not load Token provider libraries or accept Agent requests to load Token keys.

  - source:
      title: RFC 9987 — 10 Security Considerations / Agent lock brute-force protection
      url: https://www.rfc-editor.org/rfc/rfc9987.html#section-10
    text: Finally, with respect to the agent locking functionality in Section 5.7, an agent SHOULD take countermeasures against brute-force guessing attacks on the passphrase.
    scope: out-of-scope
    reason: keyringd does not implement the optional Agent lock state or Agent-protocol passphrase.

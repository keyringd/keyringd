  - source:
      title: CTAP 2.2 — 6.1.3 Discoverable credentials / non-discoverable lookup
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#sctn-discoverable
    text: >-
      In contrast, server-side credentials (also known as non-discoverable credentials) have the property that their credential IDs MUST be supplied by the Relying Party in authenticatorGetAssertion’s allowList parameter in order for the authenticator to discover and employ them.
    scope: out-of-scope
    reason: keyringd creates and uses discoverable credentials only.
    tests:
      - keyringd-fido-client::keyringd_fido_client::tests::spec::ctap22::ctap_client::requires_an_allow_list_to_use_a_non_discoverable_credential

  - source:
      title: CTAP 2.2 — 6.1.3 Discoverable credentials / stored state
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#sctn-discoverable
    text: >-
      All state that is kept for a discoverable credential MUST be stored client side—i.e., such that the authenticator working together with the client platform, if necessary, can satisfy requested authenticator operations.
    scope: other-component
    reason: Storage of discoverable credential state is provided by the authenticator or credential provider, not by the keyringd client library.

  - source:
      title: CTAP 2.2 — 6.1.3 Discoverable credentials / deleted state
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#non-discoverable-credentials
    text: >-
      If a discoverable credential’s state is deleted, e.g., by the authenticatorCredentialManagement command or overwritten by authenticatorMakeCredential, the associated credentialID MUST no longer yield a public key credential source, e.g., when processed by the authenticator’s equivalent of the Lookup Credential Source by Credential ID Algorithm including cases where the credential source is encoded within the credentialID.
    scope: other-component
    reason: Credential storage deletion and lookup are authenticator behavior; keyringd does not implement credential management.
    tests:
      - keyringd-fido-client::keyringd_fido_client::tests::spec::ctap22::ctap_client::replaces_an_existing_discoverable_credential_for_the_same_relying_party_account


      title: CTAP 2.2 — 8.3 Utility functions / uint32LittleEndian
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#utility-functions
    text: Returns a sequence of four bytes whose values are the least-significant eight bits of x, x >> 8, x >> 16, and x >> 24, respectively.
    scope: out-of-scope
    reason: This specification pseudocode helper is not a keyringd API; Rust to_le_bytes is used directly where the wire format requires it.


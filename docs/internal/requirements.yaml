      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#pinProto2
    text: If demPlaintext is less than 16 bytes in length, return an error Split demPlaintext after the 16th byte to produce two subspans, iv and ct. Return the AES-256-CBC decryption of ct using key and iv.
    tests:
      - keyringd-fido-client::keyringd_fido_client::tests::spec::ctap22::ctap_client::pin_uv_auth::crypto::protocol_two_rejects_a_ciphertext_shorter_than_its_iv
      - keyringd-fido-client::keyringd_fido_client::tests::spec::ctap22::ctap_client::pin_uv_auth::crypto::protocol_two_reads_the_iv_prefix_and_uses_a_full_authenticator
      - keyringd-fido-client::keyringd_fido_client::tests::spec::ctap22::ctap_client::pin_uv_auth::crypto::protocol_two_accepts_an_iv_only_ciphertext_as_an_empty_plaintext


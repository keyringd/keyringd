      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#hybrid-qr-initiated
    text: The UUID, 0000fff9-0000-1000-8000-00805f9b34fb, must be included in the advert and client platforms must require that candidate devices are advertising this UUID. That UUID must also have a 20-byte service data payload which is trial decrypted to search for a match to the displayed QR code.
    tests:
      - keyringd-fido-client::keyringd_fido_client::tests::spec::ctap22::transport::hybrid::ble_scanner::service_identifier_matches_the_hybrid_specification
      - keyringd-fido-client::keyringd_fido_client::tests::spec::ctap22::transport::hybrid::crypto::rejects_advertisement_service_data_that_is_not_exactly_20_bytes

      title: CTAP 2.2 — 7.5 Set PIN Complexity Policy
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#sctn-feature-descriptions-pinComplexityPolicy
    text: The authenticatorConfig command’s setMinPINLength subCommand allows the platform to enable the PIN Complexity Policy for the authenticator, force a change of PIN before allowing User Verification, and setting the list of minPinLengthRPIDs that allow the specified RP ID to receive the extension response.
    scope: out-of-scope
    reason: keyringd does not implement authenticator configuration, PIN policy changes, or the pinComplexityPolicy extension.

  - source:
      title: CTAP 2.2 — 7.6 JSON-based Messages
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#sctn-feature-descriptions-jsonBasedMessages
    text: Support for JSON-based messages, and more specifically Digital Credentials API requests using JSON-based messages, is determined by the presence of the string dc in the array for key 3 of the post handshake message’s CBOR map as defined in Hybrid Transports.
    scope: out-of-scope
    reason: keyringd uses hybrid transport for FIDO/WebAuthn CTAP traffic and does not implement Digital Credentials API JSON messages.


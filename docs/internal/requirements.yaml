      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#hybrid-qr-initiated
    text: The routing ID is an opaque value that must be provided to the tunnel service and which aids its operation.
    tests:
      - keyringd-fido-client::keyringd_fido_client::tests::spec::ctap22::transport::hybrid::tunnel_endpoint::qr_origin_endpoint_uses_connect_route

  - source:
      title: CTAP 2.2 — 11.5.1 QR-initiated Transactions / tunnel ID
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#hybrid-qr-initiated
    text: The first step of doing so is to derive the tunnel ID, a 128-bit identifier that the tunnel service recognises and which identifies the exchange separate from any others that the tunnel service might concurrently be facilitating. It is derived, as detailed above, from the QR secret.
    tests:
      - keyringd-fido-client::keyringd_fido_client::tests::spec::ctap22::transport::hybrid::crypto::derives_distinct_tunnel_identifiers_and_handshake_psks_with_the_assigned_salts_and_purposes
      - keyringd-fido-client::keyringd_fido_client::tests::spec::ctap22::transport::hybrid::tunnel_endpoint::qr_origin_endpoint_uses_connect_route


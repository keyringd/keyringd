      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#hybrid-qr-initiated
    text: The pre-exchanged public key was passed to the authenticator in the QR code, and the pre-shared symmetric key is derived from the QR secret and decrypted BLE advert. (The full BLE advert is included in the PSK derivation to ensure that any future additions to the advert format are automatically authenticated.)
    tests:
      - keyringd-fido-client::keyringd_fido_client::tests::spec::ctap22::transport::hybrid::crypto::derives_distinct_tunnel_identifiers_and_handshake_psks_with_the_assigned_salts_and_purposes
      - keyringd-fido-client::keyringd_fido_client::tests::spec::ctap22::transport::hybrid::noise_session::qr_noise_handshake_and_ctap_frame_interoperable

  - source:
      title: CTAP 2.2 — 11.5.1 QR-initiated Transactions / tunnel encryption
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#hybrid-qr-initiated
    text: Once the handshake is complete, the traffic-keys that result from Noise’s Split operation are assigned to the client platform-to-authenticator and authenticator-to-client platform flows, respectively. Future messages on the tunnel are padded and AES-256-GCM encrypted.
    tests:
      - keyringd-fido-client::keyringd_fido_client::tests::spec::ctap22::transport::hybrid::noise_session::qr_noise_handshake_and_ctap_frame_interoperable

  - source:
      title: CTAP 2.2 — 11.5.1 QR-initiated Transactions / tunnel padding
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#hybrid-qr-initiated
    text: Padding is performed by setting the final byte of the plaintext to the number of preceding bytes that are padding. Padding bytes can take any value but zero is recommended. Implementations can use a padding granularity up to 256 bytes, but 32 is recommended.
    tests:
      - keyringd-fido-client::keyringd_fido_client::tests::spec::ctap22::transport::hybrid::noise_session::qr_noise_handshake_and_ctap_frame_interoperable

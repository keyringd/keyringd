      title: CTAP 2.2 — 12.1 Credential Protection / client input
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#sctn-credProtect-extension
    text: 'create() : A single USVString specifying a protection level of the credential to be created. partial dictionary AuthenticationExtensionsClientInputs { USVString credentialProtectionPolicy; boolean enforceCredentialProtectionPolicy = false; };'
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::authentication_extensions_client_inputs::represents_the_credential_properties_and_credential_protection_client_inputs

  - source:
      title: CTAP 2.2 — 12.1 Credential Protection / allowed policy values
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#sctn-credProtect-extension
    text: 'If this extension is present in an authenticatorMakeCredential request: Verify that the credentialProtectionPolicy string value is one of following: userVerificationOptional: This reflects "FIDO_2_0" semantics. In this configuration, performing some form of user verification is OPTIONAL with or without credentialID list. This is the default state of the credential if the extension is not specified. userVerificationOptionalWithCredentialIDList: In this configuration, credential is discovered only when its credentialID is provided by the platform or when some form of user verification is performed. userVerificationRequired: This reflects that discovery and usage of the credential MUST be preceded by some form of user verification.'
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::ctap22::ctap::credential_protection_policy::maps_credential_protection_policies_to_their_ctap_extension_values
      - keyringd-fido-client::keyringd_fido_client::tests::spec::ctap22::ctap_client::rejects_an_invalid_credential_protection_extension_value
      - keyringd-fido-client::keyringd_fido_client::tests::spec::ctap22::ctap_client::enforces_credential_protection_during_discovery_and_allow_listed_authentication
      - keyringd-fido-client::keyringd_fido_client::tests::spec::ctap22::ctap_client::protects_level_three_credentials_from_unauthenticated_exclusion_probing

  - source:
      title: CTAP 2.2 — 12.1 Credential Protection / enforced policy
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#sctn-credProtect-extension
    text: When enforceCredentialProtectionPolicy is true, and credentialProtectionPolicy’s value is either userVerificationOptionalWithCredentialIDList or userVerificationRequired, the platform SHOULD NOT create the credential in a way that does not implement the requested protection policy. (For example, by creating it on an authenticator that does not support this extension.)
    tests:
      - keyringd-fido-client::keyringd_fido_client::tests::spec::ctap22::fido_client::operation::operation_manager::preserves_an_enforced_relying_party_credential_protection_policy

  - source:
      title: CTAP 2.2 — 12.1 Credential Protection / policy preservation
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#sctn-credProtect-extension
    text: 'The platform SHOULD NOT alter the credentialProtectionPolicy value: the Relying Party’s desired credential protection policy overrides any default credential protection policies imposed by the platform.'
    tests:
      - keyringd-fido-client::keyringd_fido_client::tests::spec::ctap22::fido_client::operation::operation_manager::preserves_an_enforced_relying_party_credential_protection_policy


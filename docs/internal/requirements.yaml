  - source:
      title: CTAP 2.2 — 9 Mandatory features / hmac-secret
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#mandatory-features
    text: MUST support the hmac-secret extension.
    scope: other-component
    reason: This requirement applies to an authenticator advertising FIDO_2_2; keyringd does not currently request the hmac-secret extension.

  - source:
      title: CTAP 2.2 — 9 Mandatory features / discoverable credential UV
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#mandatory-features
    text: MUST support PIN establishment/maintenance or a built-in user verification method (or both) if the option ID for rk has the value true.
    scope: other-component
    reason: This is an authenticator capability requirement; keyringd consumes rk, clientPin and uv capability values when selecting its supported UV flow.

  - source:
      title: CTAP 2.2 — 9 Mandatory features / UV option values
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#mandatory-features
    text: The option ID values for clientPin and uv MUST have either the values true or false, depending on if a pin has been set or a biometric template enrolled on the authenticator.
    scope: other-component
    reason: This is authenticator capability-reporting behavior; keyringd interprets the advertised boolean values.

  - source:
      title: CTAP 2.2 — 9 Mandatory features / credential management
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#mandatory-features
    text: MUST either include the credMgmt option ID with the value true in the authenticatorGetInfo response’s options member, or support all the same functionality via a built-in UI, if the rk option ID has the value true.
    scope: other-component
    reason: This requirement applies to FIDO_2_2 authenticators; keyringd deliberately does not implement credential management.

  - source:
      title: CTAP 2.2 — 9 Mandatory features / credential protection
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#mandatory-features
    text: MUST support the credProtect extension if some form of user verification is supported, unless all credentials are implicitly created at credProtect level three.
    scope: other-component
    reason: This is an authenticator requirement; keyringd does not currently request credProtect and relies on authenticator enforcement.

  - source:
      title: CTAP 2.2 — 9 Mandatory features / pinUvAuthToken
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#mandatory-features
    text: MUST include the pinUvAuthToken option ID with the value true in the authenticatorGetInfo response’s options member if either the clientPin or uv option IDs have the value true.
    scope: other-component
    reason: This is authenticator capability-reporting behavior; keyringd uses the relationship to select token-based UV.

  - source:
      title: CTAP 2.2 — 9 Mandatory features / protocol two
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#mandatory-features
    text: MUST include an array element with the value 2 in the authenticatorGetInfo response’s pinUvAuthProtocols member (i.e. support PIN/UV auth protocol two) if it includes any values at all.
    scope: other-component
    reason: This is an authenticator requirement; keyringd supports protocol two and consumes the advertised protocol list.


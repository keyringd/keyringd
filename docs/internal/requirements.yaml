      title: CTAP 2.2 — 6.5.4 PIN/UV Auth Protocol Abstract Definition / platform interface
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#authnrClientPin-puaprot-abstract-dfn
    text: 'The platform interface is: initialize() This is run by the platform when starting a series of transactions with a specific authenticator. encapsulate(peerCoseKey) → (coseKey, sharedSecret) | error Generates an encapsulation for the authenticator’s public key and returns the message to transmit and the shared secret. encrypt(key, demPlaintext) → ciphertext Encrypts a plaintext to produce a ciphertext, which may be longer than the plaintext. The plaintext is restricted to being a multiple of the AES block size (16 bytes) in length. decrypt(key, ciphertext) → plaintext | error Decrypts a ciphertext and returns the plaintext. authenticate(key, message) → signature Computes a MAC of the given message.'
    tests:
      - keyringd-fido-client::keyringd_fido_client::tests::spec::ctap22::ctap_client::pin_uv_auth::shared_secret::both_protocols_agree_and_encrypt_common_secrets

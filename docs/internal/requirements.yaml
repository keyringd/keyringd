  - source:
      title: WebAuthn Level 3 — 5.8.3 Credential descriptor / type
      url: https://www.w3.org/TR/webauthn-3/#dom-publickeycredentialdescriptor-type
    text: This member contains the type of the public key credential the caller is referring to. The value SHOULD be a member of PublicKeyCredentialType but client platforms MUST ignore any PublicKeyCredentialDescriptor with an unknown type. However, if all elements are ignored due to unknown type, then that MUST result in an error since an empty allowCredentials is semantically distinct.
    tests:
      - keyringd-fido-client::keyringd_fido_client::tests::spec::webauthn3::fido_client::ignores_unknown_descriptor_types_unless_every_allowed_credential_is_ignored
      - keyringd-fido-client::keyringd_fido_client::tests::spec::webauthn3::fido_client::ignores_unknown_descriptor_types_in_excludecredentials

  - source:
      title: WebAuthn Level 3 — 5.8.3 Credential descriptor / ID
      url: https://www.w3.org/TR/webauthn-3/#dom-publickeycredentialdescriptor-id
    text: This member contains the credential ID of the public key credential the caller is referring to. This SHOULD be set to the value of the id item of the credential record representing the identified public key credential source. This mirrors the rawId field of PublicKeyCredential.
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::public_key_credential_descriptor::uses_base64url_in_webauthn_json_and_bytes_in_ctap_cbor

  - source:
      title: WebAuthn Level 3 — 5.8.3 Credential descriptor / transports
      url: https://www.w3.org/TR/webauthn-3/#dom-publickeycredentialdescriptor-transports
    text: This OPTIONAL member contains a hint as to how the client might communicate with the managing authenticator of the public key credential the caller is referring to. The values SHOULD be members of AuthenticatorTransport but client platforms MUST ignore unknown values.
    tests:
      - keyringd-fido-client::keyringd_fido_client::tests::spec::webauthn3::fido_client::does_not_reject_an_unknown_transport_hint_on_a_public_key_descriptor

  - source:
      title: WebAuthn Level 3 — 5.8.4 Authenticator transport values
      url: https://www.w3.org/TR/webauthn-3/#enum-transport
    text: 'enum AuthenticatorTransport { "usb", "nfc", "ble", "smart-card", "hybrid", "internal" };'
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::authenticator_transport::exposes_every_transport_identifier_defined_by_webauthn_level_3
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::authenticator_transport::retains_an_unknown_transport_identifier

  - source:

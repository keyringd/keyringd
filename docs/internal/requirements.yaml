      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#hybrid-qr-initiated
    text: The derivation uses [RFC5869] with SHA-256, where the input keying material is the passkey, the salt is an optional input, and the info value is a 32-bit, little-endian, purpose identifier.
    tests:
      - keyringd-fido-client::keyringd_fido_client::tests::spec::ctap22::transport::hybrid::crypto::derives_distinct_tunnel_identifiers_and_handshake_psks_with_the_assigned_salts_and_purposes

  - source:

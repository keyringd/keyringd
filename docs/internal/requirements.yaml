  - source:
      title: WebAuthn Level 3 — 5.4 Credential creation options / RP
      url: https://www.w3.org/TR/webauthn-3/#dom-publickeycredentialcreationoptions-rp
    text: This member contains a name and an identifier for the Relying Party responsible for the request. Its value’s name member is REQUIRED.
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::public_key_credential_rp_entity::requires_a_name_in_webauthn_while_permitting_an_id_only_ctap_entity

  - source:
      title: WebAuthn Level 3 — 5.4 Credential creation options / user
      url: https://www.w3.org/TR/webauthn-3/#dom-publickeycredentialcreationoptions-user
    text: This member contains names and an identifier for the user account performing the registration. Its value’s name, displayName and id members are REQUIRED.
    tests:
      - keyringd-fido-client::keyringd_fido_client::tests::spec::webauthn3::fido_client::rejects_webauthn_creation_options_that_omit_the_required_user_names

  - source:
      title: WebAuthn Level 3 — 5.4 Credential creation options / challenge
      url: https://www.w3.org/TR/webauthn-3/#dom-publickeycredentialcreationoptions-challenge
    text: This member specifies a challenge that the authenticator signs, along with other data, when producing an attestation object for the newly created credential. See the § 13.4.3 Cryptographic Challenges security consideration.
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::public_key_credential_creation_options::json_can_be_converted_back_and_forth_as_a_semantic_type

  - source:
      title: WebAuthn Level 3 — 5.4 Credential creation options / algorithms
      url: https://www.w3.org/TR/webauthn-3/#dom-publickeycredentialcreationoptions-pubkeycredparams
    text: This member lists the key types and signature algorithms the Relying Party supports, ordered from most preferred to least preferred. Duplicates are allowed but effectively ignored. The client and authenticator make a best-effort to create a credential of the most preferred type possible. If none of the listed types can be created, the create() operation fails.
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::ctap22::ctap::authenticator_make_credential_request::preserves_public_key_credential_parameter_preference_order
      - keyringd-fido-client::keyringd_fido_client::tests::spec::webauthn3::fido_client::ignores_unknown_credential_types_while_retaining_a_supported_es256_parameter
      - keyringd-fido-client::keyringd_fido_client::tests::spec::webauthn3::fido_client::treat_the_duplicate_credential_generation_parameters_as_a_single_case

  - source:
      title: WebAuthn Level 3 — 5.4 Credential creation options / algorithm recommendation
      url: https://www.w3.org/TR/webauthn-3/#dom-publickeycredentialcreationoptions-pubkeycredparams
    text: 'Relying Parties that wish to support a wide range of authenticators SHOULD include at least the following COSEAlgorithmIdentifier values: -8 (EdDSA) -7 (ES256) -257 (RS256)'
    scope: out-of-scope
    reason: Existing keyringd documentation deliberately limits credential creation and SSH key conversion to ES256 rather than a wide range of authenticator algorithms.

  - source:
      title: WebAuthn Level 3 — 5.4 Credential creation options / excluded credentials
      url: https://www.w3.org/TR/webauthn-3/#dom-publickeycredentialcreationoptions-excludecredentials
    text: The Relying Party SHOULD use this OPTIONAL member to list any existing credentials mapped to this user account (as identified by user.id). This ensures that the new credential is not created on an authenticator that already contains a credential mapped to this user account.
    scope: other-component
    reason: The RP owns the account-to-credential registry and decides which existing credential IDs to provide; keyringd only transports the supplied excludeCredentials list.

  - source:
      title: WebAuthn Level 3 — 5.4 Credential creation options / authenticator selection
      url: https://www.w3.org/TR/webauthn-3/#dom-publickeycredentialcreationoptions-authenticatorselection
    text: The Relying Party MAY use this OPTIONAL member to specify capabilities and settings that the authenticator MUST or SHOULD satisfy to participate in the create() operation. See § 5.4.4 Authenticator Selection Criteria (dictionary AuthenticatorSelectionCriteria).
    scope: other-component
    reason: This sentence assigns the choice of requested authenticator capabilities to the RP; separate client requirements cover how keyringd interprets supplied selection criteria.

  - source:
      title: WebAuthn Level 3 — 5.4 Credential creation options / attestation
      url: https://www.w3.org/TR/webauthn-3/#dom-publickeycredentialcreationoptions-attestation
    text: The Relying Party MAY use this OPTIONAL member to specify a preference regarding attestation conveyance. Its value SHOULD be a member of AttestationConveyancePreference. Client platforms MUST ignore unknown values, treating an unknown value as if the member does not exist. The default value is none.
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::public_key_credential_creation_options::constructor_apply_web_idl_defaults
      - keyringd-fido-client::keyringd_fido_client::tests::spec::webauthn3::fido_client::treat_unknown_attestation_values_as_unspecified

  - source:
      title: WebAuthn Level 3 — 5.4.3 User entity / user handle
      url: https://www.w3.org/TR/webauthn-3/#dom-publickeycredentialuserentity-id
    text: The user handle of the user account. A user handle is an opaque byte sequence with a maximum size of 64 bytes, and is not meant to be displayed to the user. To ensure secure operation, authentication and authorization decisions MUST be made on the basis of this id member, not the displayName nor name members. See Section 6.1 of [RFC8266].
    scope: other-component
    reason: The RP performs account authentication and authorization and chooses the opaque handle; keyringd enforces the WebAuthn operation's byte-length boundary separately.

  - source:
      title: WebAuthn Level 3 — 5.4.3 User entity / user handle contents
      url: https://www.w3.org/TR/webauthn-3/#dom-publickeycredentialuserentity-id
    text: The user handle MUST NOT contain personally identifying information about the user, such as a username or e-mail address; see § 14.6.1 User Handle Contents for details. The user handle MUST NOT be empty.
    scope: other-component
    reason: The caller supplies account identifiers; keyringd transports the opaque user handle but cannot determine whether it contains personally identifying information.

  - source:
      title: WebAuthn Level 3 — 5.4.4 Authenticator selection / Web IDL defaults
      url: https://www.w3.org/TR/webauthn-3/#dictdef-authenticatorselectioncriteria
    text: |-
      dictionary AuthenticatorSelectionCriteria {
          DOMString authenticatorAttachment;
          DOMString residentKey;
          boolean requireResidentKey = false;
          DOMString userVerification = "preferred";
      };
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::authenticator_selection_criteria::applies_the_webauthn_defaults_for_authenticator_selection

  - source:
      title: WebAuthn Level 3 — 5.4.4 Authenticator selection / attachment
      url: https://www.w3.org/TR/webauthn-3/#dom-authenticatorselectioncriteria-authenticatorattachment
    text: If this member is present, eligible authenticators are filtered to be only those authenticators attached with the specified authenticator attachment modality (see also § 6.2.1 Authenticator Attachment Modality). If this member is absent, then any attachment modality is acceptable. The value SHOULD be a member of AuthenticatorAttachment but client platforms MUST ignore unknown values, treating an unknown value as if the member does not exist.
    tests:
      - keyringd-fido-client::keyringd_fido_client::tests::spec::webauthn3::fido_client::allow_only_cross_platform_candidates_that_match_the_authenticator_attachment
      - keyringd-fido-client::keyringd_fido_client::tests::spec::webauthn3::fido_client::do_not_start_cross_platform_transport_when_platform_attachment_is_specified

  - source:
      title: WebAuthn Level 3 — 5.4.4 Authenticator selection / resident key
      url: https://www.w3.org/TR/webauthn-3/#dom-authenticatorselectioncriteria-residentkey
    text: Specifies the extent to which the Relying Party desires to create a client-side discoverable credential. For historical reasons the naming retains the deprecated “resident” terminology. The value SHOULD be a member of ResidentKeyRequirement but client platforms MUST ignore unknown values, treating an unknown value as if the member does not exist. If no value is given then the effective value is required if requireResidentKey is true or discouraged if it is false or absent.
    tests:
      - keyringd-fido-client::keyringd_fido_client::tests::spec::webauthn3::fido_client::applies_the_legacy_resident_key_flag_when_the_resident_key_value_is_unknown

  - source:
      title: WebAuthn Level 3 — 5.4.4 Authenticator selection / user verification
      url: https://www.w3.org/TR/webauthn-3/#dom-authenticatorselectioncriteria-userverification
    text: This member specifies the Relying Party’s requirements regarding user verification for the create() operation. The value SHOULD be a member of UserVerificationRequirement but client platforms MUST ignore unknown values, treating an unknown value as if the member does not exist.
    tests:
      - keyringd-fido-client::keyringd_fido_client::tests::spec::webauthn3::fido_client::treats_an_unknown_user_verification_value_as_preferred

  - source:
      title: WebAuthn Level 3 — 5.4.5 Authenticator attachment values
      url: https://www.w3.org/TR/webauthn-3/#enum-attachment
    text: 'enum AuthenticatorAttachment { "platform", "cross-platform" };'
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::authenticator_attachment::exposes_the_platform_and_cross_platform_attachment_values

  - source:
      title: WebAuthn Level 3 — 5.4.6 Resident key requirement values
      url: https://www.w3.org/TR/webauthn-3/#enum-residentKeyRequirement
    text: 'enum ResidentKeyRequirement { "discouraged", "preferred", "required" };'
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::resident_key_requirement::exposes_every_resident_key_requirement_value

  - source:
      title: WebAuthn Level 3 — 5.4.7 Attestation conveyance values
      url: https://www.w3.org/TR/webauthn-3/#enum-attestation-convey
    text: 'enum AttestationConveyancePreference { "none", "indirect", "direct", "enterprise" };'
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::attestation_conveyance_preference::exposes_every_attestation_conveyance_preference

  - source:
      title: WebAuthn Level 3 — 5.5 Assertion options / challenge
      url: https://www.w3.org/TR/webauthn-3/#dom-publickeycredentialrequestoptions-challenge
    text: This member specifies a challenge that the authenticator signs, along with other data, when producing an authentication assertion. See the § 13.4.3 Cryptographic Challenges security consideration.
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::public_key_credential_request_options::decodes_authentication_options_json_and_ignores_unsupported_extensions

  - source:
      title: WebAuthn Level 3 — 5.5 Assertion options / RP ID
      url: https://www.w3.org/TR/webauthn-3/#dom-publickeycredentialrequestoptions-rpid
    text: This OPTIONAL member specifies the RP ID claimed by the Relying Party. The client MUST verify that the Relying Party’s origin matches the scope of this RP ID. The authenticator MUST verify that this RP ID exactly equals the rpId of the credential to be used for the authentication ceremony.
    scope: other-component
    reason: keyringd is a native WebAuthn client library and receives RP ID from its caller; browser-origin scope validation has no origin context in this API, while authenticator-side equality is enforced by the authenticator.

  - source:
      title: WebAuthn Level 3 — 5.5 Assertion options / allowed credentials
      url: https://www.w3.org/TR/webauthn-3/#dom-publickeycredentialrequestoptions-allowcredentials
    text: >-
      If not empty, the client MUST return an error if none of the listed credentials can be used. The list is ordered in descending order of preference: the first item in the list is the most preferred credential, and the last is the least preferred.
    tests:
      - keyringd-fido-client::keyringd_fido_client::tests::spec::ctap22::fido_client::operation::operation_manager::returns_no_credentials_if_all_allow_ids_are_excluded
      - keyringd-fido-client::keyringd_fido_client::tests::spec::webauthn3::fido_client::preserve_priority_order_of_allow_credentials

  - source:
      title: WebAuthn Level 3 — 5.5 Assertion options / user verification
      url: https://www.w3.org/TR/webauthn-3/#dom-publickeycredentialrequestoptions-userverification
    text: This OPTIONAL member specifies the Relying Party’s requirements regarding user verification for the get() operation. The value SHOULD be a member of UserVerificationRequirement but client platforms MUST ignore unknown values, treating an unknown value as if the member does not exist. Eligible authenticators are filtered to only those capable of satisfying this requirement.
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::public_key_credential_request_options::constructor_apply_web_idl_defaults
      - keyringd-fido-client::keyringd_fido_client::tests::spec::ctap22::fido_client::operation::ctap_user_verification::does_not_use_clientpin_for_makecredential_or_getassertion_when_those_permissions_are_unavailable

  - source:
      title: WebAuthn Level 3 — 5.6 Abort operations
      url: https://www.w3.org/TR/webauthn-3/#sctn-abortoperation
    text: Developers are encouraged to leverage the AbortController to manage the [[Create]](origin, options, sameOriginWithAncestors) and [[DiscoverFromExternalSource]](origin, options, sameOriginWithAncestors) operations.
    scope: out-of-scope
    reason: AbortController and AbortSignal are browser APIs; keyringd exposes native operation cancellation and lifecycle mechanisms instead.
    tests:
      - keyringd-fido-client::keyringd_fido_client::tests::spec::webauthn3::fido_client::os_usb_exposes_operation_lifecycle_and_cancel_id
      - keyringd-fido-client::keyringd_fido_client::tests::spec::ctap22::fido_client::operation::operation_manager::client_cancel_targets_only_registered_operations
      - keyringd-fido-client::keyringd_fido_client::tests::spec::ctap22::fido_client::operation::operation_manager::excessive_operations_return_busy_and_continue_existing_operations

  - source:
      title: WebAuthn Level 3 — 5.7 Client extension inputs
      url: https://www.w3.org/TR/webauthn-3/#iface-authentication-extensions-client-inputs
    text: This is a dictionary containing the client extension input values for zero or more WebAuthn Extensions.
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::authentication_extensions_client_inputs::represents_the_credential_properties_and_credential_protection_client_inputs

  - source:
      title: WebAuthn Level 3 — 5.7 Client extension outputs
      url: https://www.w3.org/TR/webauthn-3/#iface-authentication-extensions-client-outputs
    text: This is a dictionary containing the client extension output values for zero or more WebAuthn Extensions.
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::authentication_extensions_client_outputs::preserves_an_explicit_false_discoverable_credential_result
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::authentication_extensions_client_outputs::preserves_an_omitted_discoverable_credential_result

  - source:
      title: WebAuthn Level 3 — 5.7 Authenticator extension inputs
      url: https://www.w3.org/TR/webauthn-3/#iface-authentication-extensions-authenticator-inputs
    text: The CDDL type AuthenticationExtensionsAuthenticatorInputs defines a CBOR map containing the authenticator extension input values for zero or more WebAuthn Extensions. Extensions can add members as described in § 9.3 Extending Request Parameters.
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::ctap22::ctap::authenticator_make_credential_request::encodes_every_makecredential_request_member_under_its_assigned_integer_key

  - source:
      title: WebAuthn Level 3 — 5.7 Authenticator extension outputs
      url: https://www.w3.org/TR/webauthn-3/#iface-authentication-extensions-authenticator-outputs
    text: The CDDL type AuthenticationExtensionsAuthenticatorOutputs defines a CBOR map containing the authenticator extension output values for zero or more WebAuthn Extensions. Extensions can add members as described in § 9.3 Extending Request Parameters.
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::authentication_extensions_authenticator_outputs::round_trips_authenticator_extension_outputs_as_a_cbor_map

  - source:
      title: WebAuthn Level 3 — 5.8.1 Collected client data / type
      url: https://www.w3.org/TR/webauthn-3/#dom-collectedclientdata-type
    text: This member contains the string "webauthn.create" when creating new credentials, and "webauthn.get" when getting an assertion from an existing credential. The purpose of this member is to prevent certain types of signature confusion attacks (where an attacker substitutes one legitimate signature for another).
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::collected_client_data::you_can_round_trip_conversion_of_the_generated_client_data_challenge

  - source:
      title: WebAuthn Level 3 — 5.8.1 Collected client data / challenge
      url: https://www.w3.org/TR/webauthn-3/#dom-collectedclientdata-challenge
    text: This member contains the base64url encoding of the challenge provided by the Relying Party. See the § 13.4.3 Cryptographic Challenges security consideration.
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::collected_client_data::you_can_round_trip_conversion_of_the_generated_client_data_challenge

  - source:
      title: WebAuthn Level 3 — 5.8.1 Collected client data / origin
      url: https://www.w3.org/TR/webauthn-3/#dom-collectedclientdata-origin
    text: This member contains the fully qualified origin of the requester, as provided to the authenticator by the client, in the syntax defined by [RFC6454].
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::collected_client_data::you_can_round_trip_conversion_of_the_generated_client_data_challenge
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::collected_client_data::reject_origin_that_is_not_in_rfc_6454_format

  - source:
      title: WebAuthn Level 3 — 5.8.1.1 Client data serialization / member order
      url: https://www.w3.org/TR/webauthn-3/#clientdatajson-serialization
    text: 'Append 0x7b2274797065223a ({"type":) to result. Append CCDToString(type) to result. Append 0x2c226368616c6c656e6765223a (,"challenge":) to result. Append CCDToString(challenge) to result. Append 0x2c226f726967696e223a (,"origin":) to result. Append CCDToString(origin) to result. Append 0x2c2263726f73734f726967696e223a (,"crossOrigin":) to result.'
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::collected_client_data::output_false_in_level_3_format_and_omit_the_unspecified_top_origin

  - source:
      title: WebAuthn Level 3 — 5.8.1.1 Client data serialization / cross origin
      url: https://www.w3.org/TR/webauthn-3/#clientdatajson-serialization
    text: 'If crossOrigin is not present, or is false: Append 0x66616c7365 (false) to result. Otherwise: Append 0x74727565 (true) to result.'
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::collected_client_data::output_false_in_level_3_format_and_omit_the_unspecified_top_origin
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::collected_client_data::distinguish_between_unspecified_and_explicit_false_of_cross_origin_when_decoding

  - source:
      title: WebAuthn Level 3 — 5.8.1.1 Client data serialization / top origin
      url: https://www.w3.org/TR/webauthn-3/#clientdatajson-serialization
    text: 'If topOrigin is present: Append 0x2c22746f704f726967696e223a (,"topOrigin":) to result. Append CCDToString(topOrigin) to result.'
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::collected_client_data::serializes_a_present_top_origin_after_the_cross_origin_member

  - source:
      title: WebAuthn Level 3 — 5.8.2 Credential type values
      url: https://www.w3.org/TR/webauthn-3/#enum-credentialType
    text: 'enum PublicKeyCredentialType { "public-key" };'
    tests:

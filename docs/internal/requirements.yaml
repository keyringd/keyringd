      - keyringd-fido::keyringd_fido::tests::spec::ctap22::transport::usb::message_assembler::rejects_incorrect_sequence_number
      - keyringd-fido::keyringd_fido::tests::spec::ctap22::transport::usb::message_assembler::reject_channel_changes_on_the_way
      - keyringd-fido::keyringd_fido::tests::spec::ctap22::transport::usb::message_assembler::reject_new_messages_when_continuation_packet_is_missing


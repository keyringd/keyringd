      title: CTAP 2.2 — 11.2.4 USB HID packet structure / fixed size
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#usb-message-and-packet-structure

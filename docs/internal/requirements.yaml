    text: 'With the tunnel now fully set up, the parties can exchange messages. Each message begins with a byte that denotes the type of the message. An empty message is thus a protocol error. The following types are defined: 0: a shutdown message. 1: a CTAP message. 2: an update message. 3: a JSON-based message.'

    text: 'clientPin ClientPIN feature support: If present and set to true, it indicates that the device is capable of accepting a PIN from the client and PIN has been set. If present and set to false, it indicates that the device is capable of accepting a PIN from the client and PIN has not been set yet. If absent, it indicates that the device is not capable of accepting a PIN from the client. ClientPIN is one of the overall ways to do user verification, although ClientPIN is not considered a built-in user verification method. Not supported'

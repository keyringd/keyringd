  - source:
      title: CTAP 2.2 — 8 Message Encoding / map ordering
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#message-encoding
    text: 'The keys in every map MUST be sorted lowest value to highest. The sorting rules are: If the major types are different, the one with the lower value in numerical order sorts earlier. If two keys have different lengths, the shorter one sorts earlier; If two keys have the same length, the one with the lower value in (byte-wise) lexical order sorts earlier.'
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::ctap22::codec::cbor_codec::orders_map_keys_by_major_type_encoded_length_and_byte_wise_value
      - keyringd-fido::keyringd_fido::tests::spec::ctap22::codec::cbor_codec::requires_ctap_maps_to_be_ordered_from_the_lowest_key_to_the_highest
      - keyringd-fido::keyringd_fido::tests::spec::ctap22::codec::cbor_codec::sorts_ctap_map_keys_from_the_lowest_value_to_the_highest


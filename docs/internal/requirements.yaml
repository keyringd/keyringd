  - source:
      title: CTAP 2.2 — 10.4 Cross-version Credential Compatibility
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#cross-version-credentials

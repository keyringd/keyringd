      title: CTAP 2.2 — 11.2.2 USB HID Protocol structure / transaction
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#usb-protocol-and-framing
    text: A transaction is the highest level of aggregated functionality, which in turn consists of a request, followed by a response message. Once a request has been initiated, the transaction has to be entirely completed or aborted before a second transaction can take place and a response is never sent without a previous request.
    tests:
      - keyringd-fido-client::keyringd_fido_client::tests::spec::ctap22::transport::usb::ctap_transport::completes_a_credential_ceremony_through_ctaphid_packet_framing

  - source:
      title: WebAuthn Level 3 — 5.1 PublicKeyCredential / JSON representation
      url: https://www.w3.org/TR/webauthn-3/#typedefdef-publickeycredentialjson
    text: >-
      typedef DOMString Base64URLString; // The structure of this object will be either // RegistrationResponseJSON or AuthenticationResponseJSON typedef object PublicKeyCredentialJSON; dictionary RegistrationResponseJSON { required DOMString id; required Base64URLString rawId; required AuthenticatorAttestationResponseJSON response; DOMString authenticatorAttachment; required AuthenticationExtensionsClientOutputsJSON clientExtensionResults; required DOMString type; }; dictionary AuthenticatorAttestationResponseJSON { required Base64URLString clientDataJSON; required Base64URLString authenticatorData; required sequence<DOMString> transports; // The publicKey field will be missing if pubKeyCredParams was used to // negotiate a public-key algorithm that the user agent doesn't // understand. (See section “Easily accessing credential data” for a // list of which algorithms user agents must support.) If using such an // algorithm then the public key must be parsed directly from // attestationObject or authenticatorData. Base64URLString publicKey; required COSEAlgorithmIdentifier publicKeyAlgorithm; // This value contains copies of some of the fields above. See // section “Easily accessing credential data”. required Base64URLString attestationObject; }; dictionary AuthenticationResponseJSON { required DOMString id; required Base64URLString rawId; required AuthenticatorAssertionResponseJSON response; DOMString authenticatorAttachment; required AuthenticationExtensionsClientOutputsJSON clientExtensionResults; required DOMString type; }; dictionary AuthenticatorAssertionResponseJSON { required Base64URLString clientDataJSON; required Base64URLString authenticatorData; required Base64URLString signature; Base64URLString userHandle; }; dictionary AuthenticationExtensionsClientOutputsJSON { };
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::authenticator_attestation_response::rejects_a_derived_member_that_disagrees_with_the_attestation_object
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::authenticator_attestation_response::round_trips_a_registration_response_with_all_derived_members
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::public_key_credential::authentication_response_can_be_transformed_as_a_semantic_type

  - source:
      title: WebAuthn Level 3 — 5.1 PublicKeyCredential / authenticator attachment
      url: https://www.w3.org/TR/webauthn-3/#dom-publickeycredential-authenticatorattachment
    text: This attribute reports the authenticator attachment modality in effect at the time the navigator.credentials.create() or navigator.credentials.get() methods successfully complete. The attribute’s value SHOULD be a member of AuthenticatorAttachment. Relying Parties SHOULD treat unknown values as if the value were null.
    scope: out-of-scope
    reason: keyringd exposes native authenticator results rather than implementing navigator.credentials.create() or navigator.credentials.get(), so it does not determine the browser attachment modality reported on their returned credential.

  - source:
      title: WebAuthn Level 3 — 5.1 PublicKeyCredential / ID
      url: https://www.w3.org/TR/webauthn-3/#iface-pkcredential
    text: This attribute is inherited from Credential, though PublicKeyCredential overrides Credential’s getter, instead returning the base64url encoding of the data contained in the object’s [[identifier]] internal slot.
    scope: out-of-scope
    reason: This defines the browser PublicKeyCredential.id getter. keyringd returns documented native operation results rather than a browser Credential object and does not implement an RP-server request-validation API.

  - source:
      title: WebAuthn Level 3 — 5.1 PublicKeyCredential / raw ID
      url: https://www.w3.org/TR/webauthn-3/#dom-publickeycredential-rawid
    text: This attribute returns the ArrayBuffer contained in the [[identifier]] internal slot.
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::public_key_credential::authentication_response_can_be_transformed_as_a_semantic_type

  - source:
      title: WebAuthn Level 3 — 5.1 PublicKeyCredential / JSON binary values
      url: https://www.w3.org/TR/webauthn-3/#dom-publickeycredential-tojson
    text: The client is in charge of serializing values to JSON types as usual, but MUST take additional steps to first encode any ArrayBuffer values to DOMString values using base64url encoding.
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::public_key_credential::authentication_response_can_be_transformed_as_a_semantic_type

  - source:
      title: WebAuthn Level 3 — 5.1 PublicKeyCredential / credential ID length
      url: https://www.w3.org/TR/webauthn-3/#dom-publickeycredential-identifier-slot
    text: This API does not constrain the format of this identifier, except that it MUST NOT be longer than 1023 bytes and MUST be sufficient for the authenticator to uniquely select a key.
    scope: other-component
    reason: The authenticator chooses the credential ID; keyringd transports and preserves the identifier but does not generate it.

  - source:
      title: WebAuthn Level 3 — 5.1.3 Create / BufferSource snapshot
      url: https://www.w3.org/TR/webauthn-3/#sctn-createCredential

  - source:
      title: CTAP 2.2 — 12.7 HMAC Secret Extension
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#sctn-hmac-secret-extension

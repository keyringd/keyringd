# Requirement ledger derived from the original specifications.
# Test IDs are intentionally added only after the specification ledger is complete.
# other-component: the requirement belongs to another component.
# out-of-scope: the requirement is excluded from the supported scope.
requirements:
  - source:
      title: CTAP 2.2 — 1 Introduction / superseded features
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#intro
    text: Thus a superseded document or feature SHOULD NOT be used unless the replacement is not implemented by the counterparty.
    scope: out-of-scope
    reason: keyringd does not implement superseded CTAP1/U2F commands or protocol fallback and uses their CTAP2/WebAuthn replacements exclusively.

  - source:
      title: CTAP 2.2 — 1 Introduction / CTAP1 support
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#intro
    text: CTAP2 authenticators SHOULD also implement CTAP1/U2F.
    scope: other-component
    reason: This is an authenticator recommendation; keyringd deliberately does not implement CTAP1/U2F commands.

  - source:
      title: CTAP 2.2 — 3 Protocol Structure / message encoding
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#protocol-structure
    text: 'Message Encoding: In order to invoke a method in the authenticator API, the host must construct and encode a request and send it to the authenticator over the chosen transport protocol. The authenticator will then process the request and return an encoded response.'
    tests:
      - keyringd-fido-client::keyringd_fido_client::tests::spec::ctap22::transport::usb::ctap_transport::completes_a_credential_ceremony_through_ctaphid_packet_framing
      - keyringd-fido-client::keyringd_fido_client::tests::spec::ctap22::transport::usb::hid_api::detect_only_hid_devices_that_match_fido_usage_page_and_ctaphid_usage
      - keyringd-fido-client::keyringd_fido_client::tests::spec::ctap22::transport::hybrid::ctap_transport::cache_first_get_info_to_transfer_ctap_message

  - source:
      title: CTAP 2.2 — 3 Protocol Structure / transport binding
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#protocol-structure
    text: 'Transport-specific Binding: Requests and responses are conveyed to roaming authenticators over specific transports (e.g., USB, NFC, Bluetooth). For each transport technology, message bindings are specified for this protocol.'
    tests:
      - keyringd-fido-client::keyringd_fido_client::tests::spec::ctap22::transport::usb::ctap_transport::completes_a_credential_ceremony_through_ctaphid_packet_framing
      - keyringd-fido-client::keyringd_fido_client::tests::spec::ctap22::transport::hybrid::ctap_transport::cache_first_get_info_to_transfer_ctap_message

  - source:
      title: CTAP 2.2 — 4 Protocol Overview / capability discovery
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#prot-overview-query-getinfo
    text: The platform gets information about the authenticator using the authenticatorGetInfo command, which helps it determine the authenticator’s capabilities.
    tests:
      - keyringd-fido-client::keyringd_fido_client::tests::spec::ctap22::transport::usb::ctap_transport::completes_a_credential_ceremony_through_ctaphid_packet_framing
      - keyringd-fido-client::keyringd_fido_client::tests::spec::ctap22::transport::hybrid::ctap_transport::cache_first_get_info_to_transfer_ctap_message
      - keyringd-fido-client::keyringd_fido_client::tests::spec::ctap22::fido_client::operation::ctap_user_verification::exclude_candidates_that_cannot_accept_post_filter_requests

  - source:
      title: CTAP 2.2 — 5 Terminology / pre-flight
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#sctn-terminology
    text: In order to determine whether authenticatorMakeCredential’s excludeList or authenticatorGetAssertion’s allowList contain credential IDs that are already present on an authenticator, a platform typically invokes authenticatorGetAssertion with the "up" option key set to false and optionally pinUvAuthParam one or more times.
    scope: out-of-scope
    reason: This is an informative description of a typical pre-flight strategy, not a normative requirement; keyringd sends the supplied allowList or excludeList to the selected authenticator without separate probing.

  - source: { title: CTAP 2.2 — 6.1 authenticatorMakeCredential, url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#authenticatorMakeCredential }
    text: authenticatorMakeCredential (0x01)
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::ctap22::ctap::ctap_command::maps_ctap_authenticator_commands_to_their_assigned_command_bytes

  - source:
      title: CTAP 2.2 — 6.1 authenticatorMakeCredential / clientDataHash
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#authenticatorMakeCredential
    text: >-
      clientDataHash (0x01) Byte String Required Hash of the ClientData contextual binding specified by host. See [WebAuthn].
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::ctap22::ctap::authenticator_make_credential_request::encodes_every_makecredential_request_member_under_its_assigned_integer_key

  - source:
      title: CTAP 2.2 — 6.1 authenticatorMakeCredential / rp
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#makecred-rpid
    text: >-
      rp (0x02) PublicKeyCredentialRpEntity Required This PublicKeyCredentialRpEntity data structure describes a Relying Party with which the new public key credential will be associated. It contains the relying party identifier (rp.id of type text string, (optionally) a human-friendly RP name of type text string. The RP name is to be used by the authenticator when displaying the credential to the user for selection and usage authorization.
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::ctap22::ctap::authenticator_make_credential_request::encodes_every_makecredential_request_member_under_its_assigned_integer_key
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::public_key_credential_rp_entity::requires_a_name_in_webauthn_while_permitting_an_id_only_ctap_entity

  - source:
      title: CTAP 2.2 — 6.1 authenticatorMakeCredential / optional RP display data
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#makecred-rpid
    text: The RP name and URL are OPTIONAL so that the RP can be more privacy friendly if it chooses to.
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::public_key_credential_rp_entity::requires_a_name_in_webauthn_while_permitting_an_id_only_ctap_entity

  - source:
      title: CTAP 2.2 — 6.1 authenticatorMakeCredential / legacy icon members
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#authenticatorMakeCredential
    text: Authenticators MUST NOT error if the icon member is present, they MAY not store this value.
    scope: other-component
    reason: This is authenticator behavior; the keyringd client only needs its protocol model to tolerate the legacy member where represented.

  - source:
      title: CTAP 2.2 — 6.1 authenticatorMakeCredential / user
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#makecred-rpid
    text: >-
      user (0x03) PublicKeyCredentialUserEntity Required This PublicKeyCredentialUserEntity data structure describes the user account to which the new public key credential will be associated at the RP. It contains an RP-specific user account identifier of type byte string, (optionally) a user name of type text string, (optionally) a user display name of type text string, and (optionally) a URL of type text string, referencing a user icon image (of a user avatar, for example).
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::ctap22::ctap::authenticator_make_credential_request::encodes_every_makecredential_request_member_under_its_assigned_integer_key
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::public_key_credential_user_entity::requires_names_in_webauthn_while_permitting_an_id_only_ctap_entity

  - source:
      title: CTAP 2.2 — 6.1 authenticatorMakeCredential / user account identifier
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#makecred-rpid
    text: Note that while an empty account identifier is valid, it has known interoperability hurdles in practice and platforms are RECOMMENDED to avoid sending them.
    scope: other-component
    reason: The relying-party application supplies the account identifier to keyringd-fido-client; the library preserves that opaque identifier and does not create user accounts.

  - source:
      title: CTAP 2.2 — 6.1 authenticatorMakeCredential / optional user display data
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#makecred-rpid
    text: The user name and display name are OPTIONAL for privacy reasons for single-factor scenarios where only user presence is required.
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::public_key_credential_user_entity::requires_names_in_webauthn_while_permitting_an_id_only_ctap_entity

  - source:
      title: CTAP 2.2 — 6.1 authenticatorMakeCredential / pubKeyCredParams
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#makecred-pubkeycredparams
    text: >-
      pubKeyCredParams (0x04) Array of PublicKeyCredentialParameters Required List of supported algorithms for credential generation, as specified in [WebAuthn].
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::ctap22::ctap::authenticator_make_credential_request::encodes_every_makecredential_request_member_under_its_assigned_integer_key
      - keyringd-fido::keyringd_fido::tests::spec::ctap22::ctap::authenticator_make_credential_request::preserves_public_key_credential_parameter_preference_order

  - source:
      title: CTAP 2.2 — 6.1 authenticatorMakeCredential / pubKeyCredParams ordering
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#makecred-pubkeycredparams
    text: The array is ordered from most preferred to least preferred and MUST NOT include duplicate entries.
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::ctap22::ctap::authenticator_make_credential_request::preserves_public_key_credential_parameter_preference_order
      - keyringd-fido::keyringd_fido::tests::spec::ctap22::ctap::authenticator_make_credential_request::duplicate_public_key_credential_parameter_is_rejected_when_encoding

  - source:
      title: CTAP 2.2 — 6.1 authenticatorMakeCredential / algorithm identifiers
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#makecred-pubkeycredparams
    text: PublicKeyCredentialParameters' algorithm identifiers are values that SHOULD be registered in the IANA COSE Algorithms registry [IANA-COSE-ALGS-REG].
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::public_key_credential_parameters::encodes_es256_with_its_registered_cose_algorithm_identifier

  - source:
      title: CTAP 2.2 — 6.1 authenticatorMakeCredential / excludeList definition
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#makecred-excludelist
    text: >-
      excludeList (0x05) Array of PublicKeyCredentialDescriptor Optional An array of PublicKeyCredentialDescriptor structures, as specified in [WebAuthn]. The authenticator returns an error if the authenticator already contains one of the credentials enumerated in this array. This allows RPs to limit the creation of multiple credentials for the same account on a single authenticator.
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::ctap22::ctap::authenticator_make_credential_request::encodes_every_makecredential_request_member_under_its_assigned_integer_key
      - keyringd-fido-client::keyringd_fido_client::tests::spec::ctap22::ctap_client::protects_level_three_credentials_from_unauthenticated_exclusion_probing

  - source:
      title: CTAP 2.2 — 6.1 authenticatorMakeCredential / extensions
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#makecred-extensions
    text: >-
      extensions (0x06) CBOR map of extension identifier → authenticator extension input values Optional Parameters to influence authenticator operation, as specified in [WebAuthn]. These parameters might be authenticator specific.
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::ctap22::ctap::authenticator_make_credential_request::encodes_every_makecredential_request_member_under_its_assigned_integer_key

  - source:
      title: CTAP 2.2 — 6.1 authenticatorMakeCredential / options
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#makecred-options
    text: options (0x07) Map of authenticator options Optional Parameters to influence authenticator operation, as specified in in the table below.
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::ctap22::ctap::authenticator_make_credential_request::encodes_every_makecredential_request_member_under_its_assigned_integer_key

  - source:
      title: CTAP 2.2 — 6.1 authenticatorMakeCredential / option value types
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#makecred-option-key
    text: All option keys have boolean values.
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::ctap22::ctap::authenticator_make_credential_request::encodes_every_makecredential_request_member_under_its_assigned_integer_key

  - source:
      title: CTAP 2.2 — 6.1 authenticatorMakeCredential / pinUvAuthParam
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#makecred-pinuvauthparam
    text: pinUvAuthParam (0x08) Byte String Optional Result of calling authenticate(pinUvAuthToken, clientDataHash)
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::ctap22::ctap::authenticator_make_credential_request::encodes_every_makecredential_request_member_under_its_assigned_integer_key
      - keyringd-fido-client::keyringd_fido_client::tests::spec::ctap22::fido_client::operation::operation_manager::uses_getpinuvauthtokenusinguvwithpermissions_before_makecredential

  - source:
      title: CTAP 2.2 — 6.1 authenticatorMakeCredential / pinUvAuthProtocol
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#makecred-pinuvauthprotocol
    text: pinUvAuthProtocol (0x09) Unsigned Integer Optional PIN/UV protocol version chosen by the platform
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::ctap22::ctap::authenticator_make_credential_request::encodes_every_makecredential_request_member_under_its_assigned_integer_key
      - keyringd-fido::keyringd_fido::tests::spec::ctap22::ctap::authenticator_make_credential_request::can_represent_protocol_specifications_without_authentication_parameters
      - keyringd-fido-client::keyringd_fido_client::tests::spec::ctap22::fido_client::operation::operation_manager::uses_getpinuvauthtokenusinguvwithpermissions_before_makecredential

  - source:
      title: CTAP 2.2 — 6.1 authenticatorMakeCredential / enterpriseAttestation
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#ep-param
    text: >-
      enterpriseAttestation (0x0A) Unsigned Integer optional An authenticator supporting this enterprise attestation feature is enterprise attestation capable and signals its support via the ep Option ID in the authenticatorGetInfo command response. If the enterpriseAttestation parameter is absent, attestation’s privacy characteristics are unaffected, regardless of whether the enterprise attestation feature is presently enabled. If present with a valid value, the usual privacy concerns around attestation batching may not apply to the results of this operation and the platform is requesting an enterprise attestation that includes uniquely identifying information.
    scope: out-of-scope
    reason: keyringd does not request enterprise attestation; the wire field remains representable so inputs and responses fail safely.

  - source:
      title: CTAP 2.2 — 6.1 authenticatorMakeCredential / attestationFormatsPreference
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#makecred-attestationformatspreference
    text: >-
      attestationFormatsPreference (0x0B) Array of String optional A prioritized list of attestation statement format identifiers that the client and/or RP prefers. Authenticators that support multiple formats may use this list to select a format compatible with the caller. Clients may request omission of attestation by including a single element with the string value "none".
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::ctap22::ctap::authenticator_make_credential_request::encodes_every_makecredential_request_member_under_its_assigned_integer_key
      - keyringd-fido::keyringd_fido::tests::spec::ctap22::ctap::authenticator_make_credential_request::preserves_attestation_format_preference_order_and_the_single_none_request

  - source:
      title: CTAP 2.2 — 6.1 authenticatorMakeCredential / rk option
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#makecred-rk
    text: rk false Specifies whether this credential is to be discoverable or not.
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::ctap22::ctap::authenticator_make_credential_request::round_trips_an_es256_discoverable_credential_request
      - keyringd-fido-client::keyringd_fido_client::tests::spec::ctap22::ctap_client::creates_discoverable_es256_credentials_and_verifies_every_returned_assertion
      - keyringd-fido-client::keyringd_fido_client::tests::spec::ctap22::ctap_client::requires_an_allow_list_to_use_a_non_discoverable_credential

  - source:
      title: CTAP 2.2 — 6.1 authenticatorMakeCredential / up option
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#makecred-up
    text: Platforms MAY send the "up" option key to CTAP2.1 authenticators, and its value MUST be true if present.
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::ctap22::ctap::authenticator_make_credential_request::rejects_makecredential_options_forbidden_by_the_platform_requirements

  - source:
      title: CTAP 2.2 — 6.1 authenticatorMakeCredential / false up option
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#makecred-up
    text: The value false will cause a CTAP2_ERR_INVALID_OPTION response regardless of authenticator version.
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::ctap22::ctap::authenticator_make_credential_request::rejects_makecredential_options_forbidden_by_the_platform_requirements

  - source:
      title: CTAP 2.2 — 6.1 authenticatorMakeCredential / preferred user verification
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#makecred-uv
    text: Instead, platforms SHOULD create a pinUvAuthParam by obtaining pinUvAuthToken via getPinUvAuthTokenUsingUvWithPermissions or getPinUvAuthTokenUsingPinWithPermissions, as appropriate.
    tests:
      - keyringd-fido-client::keyringd_fido_client::tests::spec::ctap22::fido_client::operation::operation_manager::uses_getpinuvauthtokenusinguvwithpermissions_before_makecredential

  - source:
      title: CTAP 2.2 — 6.1 authenticatorMakeCredential / CTAP2.0 up compatibility
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#makecred-uv
    text: Platforms SHOULD NOT send "up" to a CTAP2.0 authenticator.
    tests:
      - keyringd-fido-client::keyringd_fido_client::tests::spec::ctap22::fido_client::operation::operation_manager::omits_the_up_option_when_sending_a_request_to_a_ctap_2_0_authenticator
    scope: deferred
    reason: CTAP2.0 compatibility requires version-aware request construction. Implementation is deferred to prioritize completing the CTAP2.2 client. Until implemented, interoperability with CTAP2.0-only authenticators may be reduced.

  - source:
      title: CTAP 2.2 — 6.1 authenticatorMakeCredential / text encoding
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#authenticatorMakeCredential
    text: 'Note: Text strings are UTF-8 encoded (CBOR major type 3).'
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::public_key_credential_rp_entity::requires_a_name_in_webauthn_while_permitting_an_id_only_ctap_entity
      - keyringd-fido::keyringd_fido::tests::spec::webauthn3::webauthn::public_key_credential_user_entity::requires_names_in_webauthn_while_permitting_an_id_only_ctap_entity

  - source:
      title: CTAP 2.2 — 6.1 authenticatorMakeCredential / excludeList presence
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#makecred-excludelist
    text: If this parameter is present, it MUST NOT be empty.
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::ctap22::ctap::authenticator_make_credential_request::omits_an_empty_exclude_list_supplied_through_the_platform_builder

  - source:
      title: CTAP 2.2 — 6.1 authenticatorMakeCredential / uv exclusivity
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#makecred-uv
    text: Platforms MUST NOT include both the "uv" option key and the pinUvAuthParam parameter in the same request.
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::ctap22::ctap::authenticator_make_credential_request::rejects_makecredential_options_forbidden_by_the_platform_requirements

  - source:
      title: CTAP 2.2 — 6.1 authenticatorMakeCredential / uv capability
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#makecred-uv
    text: Platforms MUST NOT include the "uv" option key if the authenticator does not support built-in user verification.
    tests:
      - keyringd-fido-client::keyringd_fido_client::tests::spec::ctap22::fido_client::operation::operation_manager::omits_the_uv_option_when_the_authenticator_has_no_built_in_user_verification

  - source:
      title: CTAP 2.2 — 6.1.2 authenticatorMakeCredential Algorithm / authenticatorSelection
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#sctn-makeCred-authnr-alg
    text: CTAP2.1 platforms SHOULD use § 6.9 authenticatorSelection (0x0B).
    scope: out-of-scope
    reason: keyringd performs transport discovery and product UI selection but does not send the optional CTAP authenticatorSelection command.

  - source:
      title: CTAP 2.2 — 6.1.2 authenticatorMakeCredential Algorithm / pinUvAuthProtocol
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#sctn-makeCred-authnr-alg
    text: >-
      If the pinUvAuthParam parameter is present: If the pinUvAuthProtocol parameter’s value is not supported, return CTAP1_ERR_INVALID_PARAMETER error. If the pinUvAuthProtocol parameter is absent, return CTAP2_ERR_MISSING_PARAMETER error.
    scope: other-component
    reason: These status responses are authenticator behavior; the client request model prevents the missing-protocol combination and propagates authenticator status errors.

  - source:
      title: CTAP 2.2 — 6.1.2 authenticatorMakeCredential Algorithm / option handling
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#op-makecred-step-options
    text: If the options parameter is present, process all option keys and values present in the parameter. Treat any option keys that are not understood as absent.
    scope: other-component
    reason: Processing is authenticator behavior; the protocol model preserves open option identifiers so a client can interoperate with extensions.

  - source:
      title: CTAP 2.2 — 6.1.2 authenticatorMakeCredential Algorithm / required option support
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#op-makecred-step-options
    text: 'Note: As this specification defines normative behaviours for the "rk", "up", and "uv" option keys, they MUST be understood by all authenticators.'
    scope: other-component
    reason: Recognition of the standard option keys is authenticator behavior; keyringd sends rk and relies on the specified up and uv handling.

  - source:
      title: CTAP 2.2 — 6.1.2 authenticatorMakeCredential Algorithm / uv default
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#op-makecred-step-options
    text: 'If the "uv" option is absent, let the "uv" option be treated as being present with the value false. (This is the default)'
    scope: other-component
    reason: Applying the default is authenticator behavior; keyringd relies on the specified default when it omits the deprecated uv option.

  - source:
      title: CTAP 2.2 — 6.1.2 authenticatorMakeCredential Algorithm / rk default
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#op-makecred-step-options
    text: 'Let the "rk" option be treated as being present with the value false. (This is the default.)'
    scope: other-component
    reason: Applying the default is authenticator behavior; keyringd explicitly requests rk=true for its supported discoverable credentials.

  - source:
      title: CTAP 2.2 — 6.1.2 authenticatorMakeCredential Algorithm / up default
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#op-makecred-step-options
    text: 'If the "up" option is absent, let the "up" option be treated as being present with the value true (i.e., this is the default for both CTAP2.0 and CTAP2.1 authenticators).'
    scope: other-component
    reason: Applying the default is authenticator behavior; keyringd omits up for CTAP2.0 compatibility and relies on this default.

  - source:
      title: CTAP 2.2 — 6.1.2 authenticatorMakeCredential Algorithm / enterprise RP vetting
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#op-makecred-step-if-enterpriseAttestation
    text: >-
      If the authenticator supports platform-managed enterprise attestation (whether or not vendor-facilitated enterprise attestation is also supported), and the enterpriseAttestation parameter’s value is 2, then the platform MUST have performed the necessary vetting of the request’s rp.id (e.g., via local policy lookup), and the authenticator MAY return an enterprise attestation without checking whether the request’s rp.id matches an entry on the authenticator’s pre-configured RP ID list (if any).
    scope: out-of-scope
    reason: keyringd does not request enterprise attestation and exposes no enterprise RP-vetting policy.

  - source:
      title: CTAP 2.2 — 6.1.2 authenticatorMakeCredential Algorithm / enterpriseAttestation value
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#op-makecred-step-if-enterpriseAttestation
    text: If the enterpriseAttestation parameter’s value is not 1 or 2, then end the operation by returning CTAP2_ERR_INVALID_OPTION.
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::ctap22::ctap::authenticator_make_credential_request::rejects_undefined_enterprise_attestation_request_values
    scope: out-of-scope
    reason: keyringd does not request enterprise attestation; its protocol model nevertheless rejects undefined values before sending them.

  - source:
      title: CTAP 2.2 — 6.1.2 authenticatorMakeCredential Algorithm / extension outputs
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#op-makecred-step-extensions
    text: The set of keys in the authenticator extension outputs map MUST be equal to, or a subset of, the keys of the authenticator extension inputs map.
    scope: other-component
    reason: This is authenticator output-generation behavior; client-side validation is considered when an extension output is consumed by keyringd.

  - source:
      title: CTAP 2.2 — 6.1.2 authenticatorMakeCredential Algorithm / discoverable credential creation
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#op-makecred-step-rk
    text: 'If the "rk" option is set to true: The authenticator MUST create a discoverable credential.'
    scope: other-component
    reason: Credential creation and storage are authenticator behavior; keyringd requests discoverable credentials and validates the returned credential data.

  - source:
      title: CTAP 2.2 — 6.1.2 authenticatorMakeCredential Algorithm / large-blob replacement
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#op-makecred-step-rk
    text: Platforms MUST NOT assume that authenticators will do this.
    scope: out-of-scope
    reason: The referenced behavior is erasure of large-blob data when replacing a credential; largeBlob is not currently implemented.

  - source:
      title: CTAP 2.2 — 6.1.2 authenticatorMakeCredential Algorithm / non-discoverable credential creation
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#op-makecred-step-rk
    text: 'Otherwise, if the "rk" option is false: the authenticator MUST create a non-discoverable credential.'
    scope: other-component
    reason: keyringd only creates discoverable credentials; creation and storage of non-discoverable credentials are authenticator behavior.

  - source:
      title: CTAP 2.2 — 6.1.2 authenticatorMakeCredential Algorithm / attestation format selection
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#op-makecred-step-rk
    text: If the authenticator supports multiple attestation formats and the attestationFormatsPreference parameter is present, the authenticator MUST choose a supported format whose attestation statement format identifier appears with the lowest index in the supplied array.
    scope: other-component
    reason: Attestation format selection is authenticator behavior; keyringd can express the preference and decode the selected format.


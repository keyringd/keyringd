      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#pinProto2
    text: If key is longer than 32 bytes, discard the excess. (This selects the HMAC-key portion of the shared secret. When key is the pinUvAuthToken, it is exactly 32 bytes long and thus this step has no effect.) Return the result of computing HMAC-SHA-256 on key and message.
    tests:
      - keyringd-fido-client::keyringd_fido_client::tests::spec::ctap22::ctap_client::pin_uv_auth::crypto::protocol_two_reads_the_iv_prefix_and_uses_a_full_authenticator

  - source:

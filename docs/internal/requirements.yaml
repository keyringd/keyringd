      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#hybrid-qr-initiated
    text: The key used to decrypt adverts is then a 64-byte value derived from the QR secret with keyPurposeEIDKey.
    tests:
      - keyringd-fido-client::keyringd_fido_client::tests::spec::ctap22::transport::hybrid::crypto::match_known_eid_derivation_vector

  - source:
      title: CTAP 2.2 — 11.5.1 QR-initiated Transactions / advertisement authentication
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#hybrid-qr-initiated
    text: When decrypting adverts, these 64 bytes of EID key are considered as a pair of 256-bit keys where the first 32 bytes are an AES key and the second 32 bytes are an HMAC-SHA256 key. A candidate BLE advert is valid if the final four bytes are a correct HMAC tag of the other 16 bytes. For each valid BLE advert, those initial 16 bytes are then taken to be an AES block and decrypted with the AES key.
    tests:
      - keyringd-fido-client::keyringd_fido_client::tests::spec::ctap22::transport::hybrid::crypto::authenticate_and_decrypt_advertisement

  - source:
      title: CTAP 2.2 — 11.5.1 QR-initiated Transactions / advertisement plaintext
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#hybrid-qr-initiated
    text: 'Once successfully authenticated and decrypted, a BLE advert yields 16 bytes of plaintext. These 16 bytes consist of (in order): A flags byte, which is currently zero. This could be used for versioning in the future. 80 bits of connection nonce. A 24-bit routing ID. A 16-bit tunnel service identifier.'
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::ctap22::transport::hybrid::advertisement::splits_a_decrypted_hybrid_advertisement_into_its_specified_fields

  - source:
      title: CTAP 2.2 — 11.5.1 QR-initiated Transactions / tunnel service domain
      url: https://fidoalliance.org/specs/fido-v2.2-ps-20250714/fido-client-to-authenticator-protocol-v2.2-ps-20250714.html#hybrid-qr-initiated
    text: The encoded tunnel service identifier is a uint16. Values zero through 255 are assigned, and values >= 256 are translated into a domain name by hashing. A “cable” label is prepended to hashed domains to allow for use of CNAME records.
    tests:
      - keyringd-fido::keyringd_fido::tests::spec::ctap22::transport::hybrid::tunnel_server_domain::decode_assigned_domain_and_hashed_domain

  - source:

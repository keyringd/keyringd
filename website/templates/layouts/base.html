<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {#seo page site /}
  <meta name="theme-color" content="#24577a">
  <link rel="icon" href="{site.url.resolve('icon.svg')}" type="image/svg+xml">
  <link rel="stylesheet" href="{site.url.resolve('css/site.css')}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header wrap">
    <a class="brand" href="{site.url}"><img src="{site.url.resolve('icon.svg')}" width="40" height="40" alt=""><span>Keyringd</span></a>
    <nav aria-label="Main navigation">
      <a href="{site.url.resolve('getting-started/')}">Get started</a>
      <a href="{site.url.resolve('docs/')}">Docs</a>

      <a href="https://github.com/keyringd/keyringd">GitHub <span aria-hidden="true">↗</span></a>
    </nav>
  </header>
  <main id="main">{#insert /}</main>
  <footer class="site-footer wrap">
    <div><a class="brand" href="{site.url}">Keyringd</a><p>Hardware-backed SSH keys. Not at the cost of convenience.</p></div>
    <div class="footer-links"><a href="{site.url.resolve('project/')}">Project</a><a href="https://github.com/keyringd/keyringd/issues">Report an issue</a><a href="https://github.com/keyringd/keyringd/blob/master/LICENSE">Apache 2.0</a></div>

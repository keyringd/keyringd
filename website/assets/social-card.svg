<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <title>Keyringd — Protect your SSH keys from theft.</title>
  <desc>Hardware-backed SSH keys, certified by a passkey. A new computer receives a new device key while the SSH server keeps the same setup.</desc>
  <defs>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#315e73" stroke-width="1" opacity=".42"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#1c4b61" stop-opacity=".45"/>
      <stop offset="1" stop-color="#1c4b61" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="#0d2f43"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <ellipse cx="900" cy="320" rx="410" ry="300" fill="url(#glow)"/>
  <circle cx="1160" cy="34" r="300" fill="none" stroke="#91b4c5" stroke-width="1.5" opacity=".2"/>
  <circle cx="1160" cy="34" r="214" fill="none" stroke="#91b4c5" stroke-width="1" opacity=".12"/>

  <image href="../public/logo-mark.svg" x="62" y="42" width="52" height="52"/>
  <text x="124" y="79" fill="#fff" font-family="Segoe UI Variable, Aptos, Segoe UI, Arial, sans-serif" font-size="32" font-weight="750" letter-spacing="-1">Keyringd</text>

  <path d="M64 146h24" stroke="#d3a354" stroke-width="3" stroke-linecap="round"/>
  <text x="104" y="152" fill="#e3b766" font-family="Segoe UI Variable, Aptos, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2.2">HARDWARE-BACKED SSH KEYS, CERTIFIED BY A PASSKEY</text>

  <text x="62" y="252" fill="#fff" font-family="Segoe UI Variable, Aptos, Segoe UI, Arial, sans-serif" font-size="62" font-weight="760" letter-spacing="-2.4">Protect your SSH keys</text>
  <text x="62" y="326" fill="#91b4c5" font-family="Segoe UI Variable, Aptos, Segoe UI, Arial, sans-serif" font-size="62" font-weight="760" letter-spacing="-2.4">from theft.</text>
  <text x="64" y="391" fill="#fff" font-family="Segoe UI Variable, Aptos, Segoe UI, Arial, sans-serif" font-size="29" font-weight="650" letter-spacing="-.6">Not at the cost of convenience.</text>

  <text x="64" y="554" fill="#e3b766" font-family="Segoe UI Variable, Aptos, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1.2">KEYRINGD.COM</text>

  <image href="../public/images/hero-device-story.svg" x="680" y="74" width="540" height="468"/>
</svg>

<figure class="auth-diagram" aria-labelledby="certificate-auth-caption">
  <div class="auth-setup">
    <div class="auth-setup-copy">
      <span class="tiny-label">DURING SETUP</span>
      <strong>Your passkey signs the Device Certificate.</strong>
    </div>
    <div class="auth-setup-flow" aria-hidden="true">
      <svg class="auth-icon" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8"/><path d="M18 18 33 33M23 23l5-5m0 10 5-5"/></svg>
      <span>Passkey</span><span class="auth-small-arrow">→</span>
      <svg class="auth-icon" viewBox="0 0 32 40" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 3h14l8 8v26H5zM19 3v9h8M10 24l4 4 9-10"/></svg>
      <span>Certificate</span>
    </div>
  </div>
  <p class="auth-stage tiny-label">EVERYDAY SSH</p>
  <div class="auth-exchange">
    <div class="auth-panel auth-computer">
      <div class="auth-panel-heading">
        <svg class="auth-icon" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="5" y="7" width="30" height="22" rx="3"/><path d="M2 33h36M15 30h10"/></svg>
        <strong>Your computer</strong>
      </div>
      <div class="auth-client">SSH client <span>via Keyringd</span></div>
      <div class="auth-node auth-certificate">
        <strong>Device Certificate</strong>
        <span>Device Key public key</span>
        <span>Principal · validity · options</span>
        <span class="auth-passkey-detail">Signed by your passkey</span>
      </div>
      <div class="auth-node auth-hardware">
        <svg class="auth-icon" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M18 2v8m14-8v8m14-8v8M18 54v8m14-8v8m14-8v8M2 18h8M2 32h8M2 46h8m44-28h8M54 32h8M54 46h8"/><rect x="10" y="10" width="44" height="44" rx="7"/><circle cx="26" cy="27" r="7"/><path d="M31 32 47 48M36 37l5-5m1 11 5-5"/></svg>
        <strong>Device Key</strong>
        <span>TPM / Secure Enclave</span>
        <span>Signs the authentication request</span>
      </div>
      <p class="auth-note">The private key stays in hardware.</p>
    </div>
    <div class="auth-transfer">
      <strong>SSH request</strong>
      <span class="auth-transfer-line" aria-hidden="true"></span>
      <span>Certificate<br>+ signature</span>
    </div>
    <div class="auth-panel auth-server">
      <div class="auth-panel-heading">
        <svg class="auth-icon" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="5" y="3" width="30" height="14" rx="3"/><rect x="5" y="23" width="30" height="14" rx="3"/><path d="M11 10h2m5 0h10M11 30h2m5 0h10"/></svg>
        <strong>SSH server</strong>
      </div>
      <div class="auth-node auth-trust">
        <span class="tiny-label">REGISTERED ONCE AS A CA</span>
        <strong>Passkey public key</strong>
      </div>
      <ol class="auth-checks">
        <li><strong>Validate the certificate</strong><span>Check the CA signature, principal, validity and options.</span></li>
        <li><strong>Verify the authentication signature</strong><span>Use the Device Key public key from the certificate.</span></li>
      </ol>
    </div>
  </div>
  <figcaption class="auth-caption" id="certificate-auth-caption"><strong>Your passkey certifies. Your Device Key connects.</strong><span>No passkey authentication during everyday SSH.</span></figcaption>
</figure>

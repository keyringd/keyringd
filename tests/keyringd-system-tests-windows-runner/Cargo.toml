[package]
name = "keyringd-system-tests-windows-runner"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
keyringd-testkit = { path = "../keyringd-testkit" }
anyhow.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
keyringd-test-usbip = { path = "../keyringd-test-usbip" }
tokio = { workspace = true, features = ["rt"] }
keyringd-system-tests = { path = "../keyringd-system-tests" }
keyringd-wsl-system-tests = { path = "../keyringd-wsl-system-tests" }
uuid = { workspace = true, features = ["v4"] }
tempfile.workspace = true
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
] }

[dev-dependencies]
tempfile.workspace = true

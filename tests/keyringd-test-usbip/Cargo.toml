[package]
name = "keyringd-test-usbip"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
futures-util.workspace = true
rcgen = { workspace = true, features = ["crypto", "ring", "pem"] }
time.workspace = true
tempfile.workspace = true
anyhow.workspace = true
keyringd-fido-client = { path = "../../keyringd-fido-client" }
thiserror.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "rt", "sync", "time"] }

[dev-dependencies]
keyringd-testkit = { path = "../keyringd-testkit" }
rustls = { workspace = true, features = ["ring"] }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-native-roots"] }
keyringd-fido = { path = "../../keyringd-fido" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[target.'cfg(unix)'.dev-dependencies]
libc.workspace = true

name: Documentation website

on:
  push:
    branches: [master]
    paths:
      - 'website/**'
      - 'xtask/**'
      - 'Cargo.lock'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'xtask/**'
      - 'Cargo.lock'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-website-${{ hashFiles('website/**/*.gradle*', 'website/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-website-
      - name: Install xtask native build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libtss2-dev libdbus-1-dev libudev-dev
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Build documentation
        run: cargo xtask docs build
      - name: Upload pull request preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: website-preview
          path: website/build/roq
          retention-days: 7
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/build/roq

  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: documentation-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

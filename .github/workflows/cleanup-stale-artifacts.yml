name: Clean up stale workflow artifacts

on:
  schedule:
    - cron: '37 19 * * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Delete artifacts at least 24 hours old
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Finish pagination before deleting to avoid skipping artifacts.
          gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select((.created_at | fromdateiso8601) <= (now - 86400)) | .id' \
            > "$RUNNER_TEMP/stale-artifacts"
          xargs -r -I '{}' gh api --method DELETE "repos/${{ github.repository }}/actions/artifacts/{}" \
            < "$RUNNER_TEMP/stale-artifacts"


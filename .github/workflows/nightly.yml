name: Nightly

on:
  schedule:
    # Daily 03:37 JST (18:37 UTC), away from the busy hour boundary.
    - cron: '37 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  build_release_assets:
    if: ${{ github.ref == 'refs/heads/master' }}
    uses: ./.github/workflows/build-release-assets.yml
    with:
      channel: nightly
    secrets: inherit

  publish:
    name: Publish GitHub Release
    needs: build_release_assets
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.build_release_assets.outputs.commit }}
          fetch-depth: 0
      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release-assets
      - name: Publish nightly
        uses: ./.github/actions/publish-nightly
        with:
          commit: ${{ needs.build_release_assets.outputs.commit }}

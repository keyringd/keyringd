[workspace]
resolver = "2"
members = [
    "xtask",
    "keyringd-core",
    "keyringd-ui-core",
    "keyringd-fido",
    "keyringd-fido-client",
    "keyringd-linux",
    "keyringd-macos",
    "keyringd-ssh-agent-protocol",
    "tests/keyringd-test-authenticator",
    "tests/keyringd-test-usbip",
    "tests/keyringd-system-tests",
    "tests/keyringd-system-tests-linux-runner",
    "tests/keyringd-system-tests-macos-runner",
    "tests/keyringd-system-tests-windows-runner",
    "tests/keyringd-testkit",
    "tests/keyringd-testkit-macros",
    "keyringd-windows",
    "tests/keyringd-wsl-system-tests",
    "keyringd-wsl",
]
default-members = [
    "xtask",
    "keyringd-core",
    "keyringd-ui-core",
    "keyringd-fido",
    "keyringd-fido-client",
    "keyringd-ssh-agent-protocol",
    "tests/keyringd-test-authenticator",
    "tests/keyringd-test-usbip",
    "tests/keyringd-testkit",
    "tests/keyringd-testkit-macros",
]

[workspace.package]
version = "0.7.1-nightly"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
aes = "0.9"
aes-gcm = "0.11.1"
flate2 = "1.1.9"
anyhow = "1"
argon2 = "0.6"
async-trait = "0.1"
atspi = "0.30"
base64 = "0.23"
block2 = "0.6"
bt-hci = "0.11.0"
btleplug = "=0.13.5"
cargo-about = "=0.9.3"
cbc = "0.2"
clap = "4"
core-foundation = "0.10"
ctrlc = "3"
dirs = "7"
dispatch2 = "0.3"
ecdsa = "0.17"
futures-channel = "0.3"
futures-util = "0.3"
gethostname = "1.1"
getrandom = "0.4"
# gtk4 0.11.5 needs gtk4-sys 0.11.5; its system-deps 9 conflicts with
# krates 0.21.3's indexmap =2.9.0 used by the license generator.
gtk4 = "=0.11.4"
hex-literal = "1"
hidapi = { version = "2.6", default-features = false }
hkdf = "0.13"
hmac = "0.13"
http = "1"
image = { version = "0.25", default-features = false }
# cargo-about 0.9.2 exposes graph types from krates 0.21.
krates = "0.21"
libadwaita = "0.9"
libc = "0.2"
maud = "0.27"
mockall = "0.15"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
objc2-service-management = "0.3"
p256 = "0.14"
plist = "1"
proc-macro2 = "1"
qrcode = { version = "0.15", default-features = false }
quote = "1"
rand_core = "0.6"
rcgen = { version = "0.14", default-features = false }
rqrr = { version = "0.11", default-features = false }
rustls = { version = "0.23", default-features = false }
security-framework = "3.7"
security-framework-sys = "2.17"
semver = "1"
rustc-demangle = "0.1"
serde = "1"
serde_json = "1"
serde-saphyr = "2.0"
sha2 = "0.11"
snow = "0.10"
spki = { version = "0.8", features = ["alloc"] }
subtle = "2"
syn = "3"
tempfile = "3"
thiserror = "2"
tiny_http = "0.12"
time = "0.3"
tokio = "1"
tokio-tungstenite = "0.30"
tokio-util = "0.7"
toml_edit = "0.23"
toml-span = "0.7"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = "0.3"
tray-icon = "0.26.0"
trybuild = "1"
tss-esapi = "7.7"
unicode-normalization = "0.1"
url = "2"
uuid = "1"
windows = "0.62"
# Upstream snapshot with local fixes; provenance and licenses are in that repository.
windows-canvas = { git = "https://github.com/keyringd/windows-rs-snapshot.git", rev = "c155b459d346c8b86c9032c4809428453373b0c6" }
windows-reactor = { git = "https://github.com/keyringd/windows-rs-snapshot.git", rev = "c155b459d346c8b86c9032c4809428453373b0c6" }
windows-reactor-setup = { git = "https://github.com/keyringd/windows-rs-snapshot.git", rev = "c155b459d346c8b86c9032c4809428453373b0c6" }
zeroize = "1"

[profile.release]
debug = 1
